externalDocs:
  description: Pedoman proyek, peran, dan konvensi klien (README repo pdb)
  url: https://github.com/platformdigitalbandung/pdb#readme
servers:
  - url: https://apk.fly.dev/api
tags:
  - name: botregister
    description: Pendaftaran nomor bot WhatsApp atau refresh token, disertai URL dan Secret WebHook. Bukan pendaftaran pengguna aplikasi - identitas orang datang dari WhatsAuth.
    externalDocs:
      description: Contoh Kode WebHook
      url: https://github.com/whatsauth/webhook
  - name: kalender
    description: Kalender akademik per prodi/angkatan/semester, diturunkan dari ritme mingguan kurikulum. Baca untuk semua pengguna terdaftar, hanya kalender yang sudah diterbitkan. Buat, sunting, terbitkan, dan hapus hanya kaprodi prodi kalender itu (keputusan pemilik produk 2026-09-14) - admin dan dosen biasa ditolak 403.
  - name: proyekkerja
    description: Modul Proyek Kerja/Magang - proyek semester-panjang di tempat kerja mahasiswa, disetujui dosen lalu ditinjau dua pihak (dosen dan atasan) pada tengah dan akhir semester.
  - name: kuisgerbang
    description: >-
      Kuis atas materi asinkron yang wajib ditempuh mahasiswa sebelum sesi tatap muka.
      Modul ini tidak menahan akses ke sesi - ia menyediakan status lulus untuk dicek
      modul lain. Kunci jawaban tidak pernah dikirim ke client sebelum submit.
  - name: sesiujian
    description: >-
      Asesmen berpengawas - jadwal ujian di kampus beserta pencatatan kehadirannya.
      Bukan proctoring otomatis. Skor ujiannya diinput dosen lewat Modul Blok/Proyek.
  - name: materi
    description: >-
      Katalog materi asinkron (video YouTube, bacaan, atau berkas PDF) per minggu
      rumpun. Progres materi wajib menunjuk materi di katalog ini. Bacaan disimpan
      sebagai teks, bukan tautan luar, supaya gulirnya bisa dilacak; berkas PDF
      disimpan di repo storage GitHub privat dan dibaca di dalam platform supaya
      halamannya bisa dilacak.
  - name: progresmateri
    description: >-
      Pelacakan konsumsi materi asinkron - seberapa jauh mahasiswa menyelesaikan
      video, bacaan, atau berkas PDF per minggu rumpun, dikirim berkala oleh
      player web. persen_selesai yang tersimpan tidak pernah turun, begitu juga
      halaman_terakhir. Tanpa perintah WhatsApp.
  - name: rpl
    description: >-
      Rekognisi Pembelajaran Lampau - pengakuan pengalaman kerja SEBELUM masuk kuliah
      jadi kredit satu rumpun. Beda dari Proyek Kerja/Magang yang untuk proyek selama
      kuliah berjalan.
  - name: akademik
    description: Roster mahasiswa - sumber identitas akademik bersama yang dipakai modul dasbor, blok/proyek, dan proyek kerja. Diisi pengelola prodi, bukan pendaftaran mandiri.
  - name: device
    description: Set whatsapp yg digunakan
    externalDocs:
      description: Tata cara input kode
      url: https://faq.whatsapp.com/1324084875126592
  - name: message
    description: Mengirim pesan ke tujuan
    externalDocs:
      description: Contoh Kode Program
      url: https://github.com/whatsauth/webhook/blob/09c999be72e25660395f27c879456938a57561d1/function.go#L36C9-L36C9
  - name: whatsauth
    description: Get Token and Authorize
  - name: version
    description: Cek status dan commit deployan yang sedang berjalan
  - name: tugas
    description: Portal Tugas - pengumpulan tugas mahasiswa dan laporan kemiripan
  - name: kurikulum
    description: Data referensi kurikulum - prodi, rumpun, CPL, ritme mingguan
  - name: dasbor
    description: Dasbor mahasiswa - beban belajar mingguan dan pelacakan capaian pembelajaran (CPL)
  - name: autograder
    description: Hasil autograder kode dari GitHub Actions - webhook workflow_run bertanda tangan HMAC, artefak diambil backend sendiri
  - name: rekaman
    description: Rekaman sesi daring sinkron (YouTube) dengan tenggat tengah malam setelah sesi dan rekap keterlambatan untuk kaprodi
  - name: rapor
    description: Rapor per semester dan rekap nilai dari penilaian blok/proyek - skala huruf A-E, IP/IPK dari mata kuliah yang sudah dinilai
  - name: beranda
    description: Agenda beranda per peran - hal yang belum dikerjakan dan yang akan datang untuk admin, kaprodi, dosen, dan mahasiswa
  - name: jabatan
    description: Jabatan pimpinan - daftar dosen untuk penetapan kaprodi oleh super admin
  - name: forum
    description: Forum asinkron per rumpun per minggu dengan SLA respons dosen 1x24 jam yang hanya berjalan Senin-Rabu WIB
  - name: kepatuhan
    description: Laporan kepatuhan per mata kuliah untuk akreditasi - menit asinkron, daring sinkron, dan opsional luring/daring terhadap tuntutan SKS, beserta bukti penilaian dan CPL
  - name: proyekblok
    description: >-
      Modul Blok/Proyek - instance proyek per rumpun kurikulum dan penilaian per mahasiswa per mata kuliah.
      DIPENSIUNKAN sejak 2026-09-26 (keputusan developer Arfan, satu sistem nilai) - penilaian dilakukan di buku
      nilai kelas rumpun (tag kelas); rapor, cakupan CPL, dan laporan kepatuhan tidak lagi membaca rute ini.
      Rute tetap ada, halamannya dialihkan.
  - name: akun
    description: Masuk dengan NIM/email + kata sandi (templat bagian email sebelum @ + ADB) dan ganti kata sandi sendiri
  - name: pengguna
    description: Halaman Pengguna untuk admin dan kaprodi - dosen, mahasiswa, reset kata sandi ke templat, aktif/nonaktif, dan jabatan admin
  - name: kelas
    description: >-
      Kelas sebagai pusat pembelajaran (sejak 2026-09-25, keputusan developer Arfan) - satu kelas per rumpun
      berproyek pengikat, atau per mata kuliah untuk rumpun wadah mata kuliah lepas, dalam satu kalender
      semester terbit. Peserta otomatis dari roster (prodi + angkatan + semester), pengajar ditunjuk kaprodi,
      tugas bertenggat, buku nilai berbobot, pengumuman, dan satu grup WhatsApp per kelas (dibuat lewat bot;
      pengingat tenggat tugas dikirim bot ke grup itu 24 jam sebelumnya). Hak menulis materi, kuis, tugas,
      rekaman, dan nilai ikut kelas.
paths:
  /health:
    # Rute ini ada di AKAR, bukan di bawah /api - server default dokumen ini
    # berakhiran /api, jadi path item ini menimpanya. Tanpa override, pembaca
    # dokumen akan memanggil https://apk.fly.dev/api/health yang menjawab 404.
    servers:
      - url: https://apk.fly.dev
        description: Produksi (akar, di luar prefix /api)
    get:
      tags:
        - tugas
      summary: Health check Portal Tugas (publik, tanpa token)
      description: >-
        Mengembalikan status service dan jumlah tugas yang tersimpan.
        Alamat lengkapnya `https://apk.fly.dev/health` - TANPA prefix `/api`.
      operationId: healthTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  n_tugas:
                    type: integer
                    example: 3
  /tugas:
    get:
      tags:
        - tugas
      summary: Daftar tugas
      description: >-
        Hanya pengguna terdaftar (dosen/admin atau mahasiswa di roster). Mahasiswa hanya menerima
        tugas kelas yang ia ikuti (sejak 2026-09-26 tugas prodi tanpa kelas dihapus; query prodi
        diabaikan), dan tiap tugas membawa sudah_kirim dan kirim_terakhir miliknya sendiri. Dosen,
        kaprodi, dan admin menerima semua tugas, bisa disaring dengan query prodi.
      operationId: daftarTugas
      security:
        - whatsauthToken: []
      parameters:
        - in: query
          name: prodi
          schema:
            type: string
          required: false
          description: Kode prodi untuk menyaring daftar (hanya berlaku untuk dosen/kaprodi/admin)
      responses:
        '401':
          description: Tanpa token, token tidak valid/kedaluwarsa, atau draft=1 diminta tanpa token dosen yang sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor pada token belum terdaftar sebagai dosen, admin, atau mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tugas:
                    type: array
                    items:
                      $ref: '#/components/schemas/TugasRingkas'
  /tugas/kiriman/{kid}/berkas:
    get:
      tags:
        - tugas
      summary: Berkas jawaban satu kiriman (pengajar tugas itu, atau mahasiswa pemiliknya)
      description: >-
        Berkas asli dari repo storage privat sebagai base64, beserta teks yang terbaca saat kiriman
        diekstrak. Kalau berkas tidak bisa diambil dari penyimpanan, `galat_berkas` terisi dan teksnya
        tetap dikirim.
      operationId: berkasKiriman
      parameters:
        - {in: path, name: kid, required: true, schema: {type: string}, description: "Id kiriman dari `GET /tugas/{id}/kiriman`"}
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  nama: {type: string, example: jawaban.pdf}
                  teks: {type: string, description: Teks yang terbaca dari berkas}
                  n_kata: {type: integer}
                  isi_base64: {type: string, description: Isi berkas asli; tidak ada kalau berkas tidak tersimpan}
                  galat_berkas: {type: string, description: Ada kalau berkas gagal diambil dari penyimpanan}
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan pengajar tugas itu maupun kaprodinya, atau kiriman milik mahasiswa lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kiriman atau tugasnya tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /tugas/{id}:
    get:
      tags:
        - tugas
      summary: Detail tugas
      description: >-
        Hanya pengguna terdaftar (dosen/admin atau mahasiswa di roster). Untuk mahasiswa, tugas prodi
        lain, tugas lama tanpa prodi, dan tugas kelas yang tidak ia ikuti dijawab 404. Mahasiswa
        sekalian menerima `kiriman_saya` (kiriman terakhirnya); nilai dan komentar baru ikut setelah
        pengajar mengembalikannya.
      operationId: detailTugas
      security:
        - whatsauthToken: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor pada token belum terdaftar sebagai dosen, admin, atau mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TugasDetail'
        '404':
          description: Tugas tidak ditemukan (untuk mahasiswa juga tugas prodi lain atau kelas yang tidak diikuti)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
    put:
      tags:
        - tugas
      summary: Ubah tugas (pengajar kelas tugas itu / kaprodinya)
      description: >-
        Mengganti judul, petunjuk, minggu, tenggat, dan nilai maksimal. Tugas prodi lama: pengajar
        kelas di prodi itu atau kaprodinya. Kiriman yang sudah masuk tidak dihitung ulang
        keterlambatannya.
      operationId: ubahTugas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "ObjectID tugas"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatTugasKelasRequest'
      responses:
        '200':
          description: Tugas tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tugas'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan pengajar kelas tugas itu maupun kaprodinya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Tugas atau kelasnya tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Isian tidak sah (judul kosong, tenggat tidak terbaca, nilai maksimal di luar 1-1000, atau minggu di luar 0-52)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
