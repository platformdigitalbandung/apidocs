      description: >-
        youtube_id boleh diisi ID 11 karakter atau tautan YouTube apa pun
        (watch, youtu.be, embed, shorts, live) - server mengurainya. Bacaan
        wajib punya isi teks. Jenis berkas dibuat lebih dulu di sini untuk
        mendapat id, berkas PDF-nya menyusul lewat POST /materi/{id}/berkas -
        jadi materi berkas yang baru dibuat belum punya berkas. Field milik
        jenis lain dikosongkan server.
