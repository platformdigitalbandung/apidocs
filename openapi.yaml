      summary: Masuk dengan NIM/email + kata sandi (publik)
      description: >-
        Menukar NIM (mahasiswa) atau email (dosen, atau email roster mahasiswa) +
        kata sandi menjadi token 18 jam yang sama dengan WhatsAuth: Id = nomor
        WhatsApp di data pengguna, role dari basis data. Email dicari di dosen
        lebih dulu, lalu di roster; tidak peka huruf besar/kecil. Kata sandi yang
        belum pernah diganti = templat (bagian email sebelum @ + ADB; mahasiswa
        tanpa email NIM + ADB). Akun tidak ditemukan dan kata sandi salah dijawab
        sama (`401`). Dipakai tab **Kata sandi** halaman login.
      operationId: masukSandi
