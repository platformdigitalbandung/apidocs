openapi: 3.0.3
info:
  title: Dokumen API Platform Digital Bandung
  description: |
    API backend **Platform Digital Bandung** (`https://apk.fly.dev`) — satu backend
    Go (GoCroot) untuk dua kanal: web `https://platform.digitalbdg.ac.id` dan bot
    WhatsApp. Dokumen ini adalah sumber kebenaran rute dan skema; setiap rute di
    `apkflydev/url/` wajib ada di sini (nol selisih dua arah). Commit backend yang
    sedang berjalan: `GET /api/version` (field `commit`).

    Rute di bawah `servers` (`/api`), kecuali `/health` di akar. Pedoman proyek,
    peran, dan konvensi klien web (crootjs) ada di README repo `pdb`; ringkasan
    untuk agen AI/developer ada di [`SKILL.md`](./SKILL.md).

    ## Cara mendapatkan token

    Tidak ada pendaftaran mandiri: akun adalah mahasiswa di roster atau dosen di
    `dosentugas` yang didaftarkan pengelola. Satu-satunya halaman login
    `https://platform.digitalbdg.ac.id/login/` punya dua cara masuk yang
    menghasilkan token yang **sama** (Id = nomor WhatsApp di data pengguna):

    **A. NIM/email + kata sandi** (sejak 2026-09-25): `POST /akun/masuk` dengan
    `{"identitas": "<NIM atau email>", "sandi": "..."}` membalas `LoginInfo`.
    Mahasiswa masuk dengan NIM (atau email roster), dosen dengan email kampus.
    Kata sandi yang belum pernah diganti adalah **templat**: bagian email sebelum
    `@` (huruf kecil) + `ADB`; mahasiswa tanpa email: NIM + `ADB`. Kata sandi
    diganti lewat `PUT /akun/sandi`; admin/kaprodi mereset ke templat lewat
    `POST /pengguna/sandi/reset`. Percobaan gagal dibatasi 10 per NIM/email dan
    30 per alamat IP dalam 15 menit (`429`). Akun tanpa nomor WhatsApp dan dosen
    nonaktif ditolak `403`.

    **B. WhatsAuth** (nomor WhatsApp dibuktikan lewat pesan ke bot):

    1. Halaman login membuka WebSocket `wss://apk.fly.dev/ws/whatsauth/public`,
       mengirim `uuid` acak, lalu menampilkan QR / tombol Buka WhatsApp yang
       berisi kata kunci WhatsAuth bot.
    2. Pengguna mengirim pesan itu dari WhatsApp-nya; bot memanggil
       `POST /whatsauth/request` (kanal bot, header `token`), backend mencari
       peran nomor itu di basis data dan menerbitkan token PASETO v4.public
       berisi `Id` (nomor WA), `Alias` (nama), dan `Data.role`
       (mis. `["dosen","kaprodi"]`), berlaku **18 jam**.
    3. Token dikirim balik lewat WebSocket sebagai `{"login": "<token>"}` dan
       disimpan di cookie `login` (`path=/`). Klien web mengirimnya sebagai
       `Authorization: Bearer <token>` pada setiap rute berskema `whatsauthToken`.
    4. **Cadangan OTP** (sejak 2026-09-18): kalau halaman login sudah tidak
       tersambung ke room QR saat pesan diproses, bot membalas dengan OTP 6 digit
       (berlaku 5 menit, sekali pakai, dicabut setelah 5 kode salah) dan panduan
       memakainya. Pengguna menekan **Masuk dengan OTP** di halaman login, lalu
       halaman itu menukar nomor + OTP lewat `POST /whatsauth/otp` menjadi token
       yang sama. OTP hanya dikirim bot ke nomor yang baru mengirim pesan
       WhatsAuth; tidak ada rute untuk memintanya dari web.

    WebSocket hanya menerima `Origin` `https://platform.digitalbdg.ac.id`, jadi
    klien non-web tidak bisa membuat sesi login sendiri; skrip/agen memakai token
    yang diambil dari cookie `login` sesi peramban yang sah, atau token operator
    dari `cmd/gentoken` (hanya untuk nomor bot). Rute WebSocket (pesan pertama,
    bentuk balasan, magic link) didokumentasikan di `apkflydev/README.md` bagian
    "Rute WebSocket", bukan di sini (OpenAPI 3.0 tidak memodelkan WebSocket).

    ## Peran dan hak (ringkas)

    | Peran | Ditentukan dari | Hak utama |
    |---|---|---|
    | mahasiswa | nomor ada di roster `mahasiswa` (tanpa klaim role) | materi, kuis, tugas, forum, nilai, rapor, dasbor, proyek kerja, RPL — hanya prodi rosternya |
    | dosen | `dosentugas` aktif → role `dosen` | membaca semua prodi; roster & email kampus; tinjau RPL, rapor per NIM, pengawas ujian, proyek kerja bimbingan |
    | pengajar kelas | email kampus ada di `kelas.pengajar`, ditunjuk kaprodi | + materi & kuis rumpun/mata kuliah kelas itu, tugas bertenggat, penilaian, bobot & buku nilai, rekaman sesi kalender kelas itu |
    | kaprodi | `prodi.kaprodi_email` → role `kaprodi` | + kurikulum, kalender semester, kelola kelas (menunjuk pengajar dari semua dosen aktif, peserta), semua hak pengajar di kelas prodinya, laporan tingkat prodi **prodinya** |
    | admin | `dosentugas.jabatan = "admin"` → role `admin` | menetapkan kaprodi, membuat prodi baru, laporan semua prodi; **tidak** mengubah kurikulum/kalender/kuis/materi/tugas |

    Tanpa token → `401`; nomor tidak terdaftar atau peran kurang → `403`;
    dokumen tidak ada → `404`; isian tidak sah → `422`. Hak dibaca dari basis
    data tiap permintaan (pergantian kaprodi berlaku seketika), kecuali klaim
    `role` di token yang baru berubah setelah masuk ulang.

    ## Bentuk galat

    Rute platform membalas `{"detail": "<pesan untuk pengguna>"}` (skema
    `DetailError`) dengan kode 401/403/404/422/5xx. Rute bot WhatsApp warisan
    (`botregister`, `device`, `send/message/*`, `numbers/isonwa`,
    `whatsauth/request`) membalas `{"error": "..."}` (skema `ErrorMessage`) dan
    memakai header `token`, bukan Bearer.

    ## Batas dan format

    - Badan permintaan maksimal **24 MiB** (Fiber `BodyLimit`); berkas PDF materi
      maksimal **20 MiB**; kiriman tugas dan bukti RPL ikut batas 24 MiB.
    - Unggah berkas memakai `multipart/form-data` dengan satu field berkas; field
      teks dikirim lewat query string. Berkas dibaca balik sebagai base64 di JSON.
    - Berkas disimpan di repo GitHub privat; basis data hanya menyimpan
      `StorageRef` (`repo`/`path`/`sha`). Nama berkas disanitasi server.
    - Kode prodi huruf kecil `[a-z][a-z0-9-]{1,19}`; yang berlaku dari
      `GET /kurikulum/prodi` (jangan dihardcode selain contoh).
    - Waktu dalam WIB (Asia/Jakarta); tanggal sesi kalender `YYYY-MM-DD`.

    ## Urutan pemakaian tipikal

    - **Menyiapkan prodi (kaprodi):** `PUT /kurikulum/prodi/{prodi}` → rumpun/CPL
      → `PUT /kurikulum/ritme/{nama}` → `POST /kalender` → `PUT /kalender/{id}`
      → `POST /kalender/{id}/terbitkan` (kelas dibuat otomatis) →
      `GET /kelas/pilihan-pengajar` (semua dosen aktif ber-email) → `PUT /kelas/{id}`
      (tunjuk pengajar; pengajar otomatis tercatat di prodi kelas itu).
    - **Kelas (sejak 2026-09-25):** `GET /kelas/saya` → `GET /kelas/{id}` →
      `GET /kelas/{id}/isi` (materi, kuis, tugas per minggu) →
      `GET /kelas/{id}/nilai` (buku nilai; peserta hanya barisnya).
    - **Tugas kelas (pengajar → mahasiswa):** `POST /kelas/{id}/tugas`
      (+ `POST /tugas/{id}/lampiran`) → mahasiswa `GET /tugas/{id}` →
      `POST /tugas/{id}/kirim` (multipart; lewat tenggat tetap diterima, ditandai
      terlambat) → `GET /tugas/{id}/kiriman` → `GET /tugas/kiriman/{kid}/berkas`
      → `PUT /tugas/{id}/kiriman/{kid}/nilai` (`kembalikan: true` memperlihatkan
      nilai ke mahasiswa dan memasukkannya ke buku nilai) →
      `GET /tugas/{id}/laporan` (kemiripan). Sejak 2026-09-26 semua tugas milik
      kelas; tugas prodi (tanpa kelas) dan `POST /tugas` dihapus.
    - **Materi & kuis mingguan:** `POST /materi` (+ `POST /materi/{id}/berkas`)
      → mahasiswa `GET /materi?rumpun=&minggu=` → `POST /progresmateri`;
      `POST /kuisgerbang` → `GET /kuisgerbang/{rumpun}/{minggu}` →
      `POST /kuisgerbang/{id}/submit` → `GET /mahasiswa/{nim}/kuisgerbang/status`.
    - **Autograder:** GitHub Actions (`pull_request_target`, binari repo
      `telemetri`) → `POST /autograder/webhook` (HMAC `X-Hub-Signature-256`,
      event `workflow_run`; 202 diabaikan, 401 tanda tangan salah, 503 secret
      belum diset) → backend mengambil artefak dengan `GHPAT` → `GET /autograder`.
      Rincian: `apkflydev/README.md` bagian "Modul Autograder" dan
      `telemetri/README.md`.

    Contoh (token dari cookie `login` peramban yang sudah masuk):

    ```
    curl -s https://apk.fly.dev/api/version
    curl -s -H "Authorization: Bearer $TOKEN" https://apk.fly.dev/api/kurikulum/prodi
    curl -s -H "Authorization: Bearer $TOKEN" "https://apk.fly.dev/api/tugas?prodi=trpl"
    curl -s -H "Authorization: Bearer $TOKEN" -F berkas=@jawaban.pdf \
      "https://apk.fly.dev/api/tugas/<id>/kirim"
    ```

    ## Versi

    `info.version` naik setiap kali rute/skema berubah; tanggal dan commit
    backend padanannya dicatat di README repo `apidocs`. Rute WebSocket
    `/ws/whatsauth/public` (login) dan `/ws/chatgpl/public` aktif;
    `/ws/webrtc/public` dinonaktifkan.
