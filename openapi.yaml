        - tugas
      summary: Isi email kampus dosen (menggantikan NIP)
      description: >-
        Sejak 2026-09-14 platform tidak memakai NIP: identitas dosen adalah email
        kampus, diisi dosen sendiri untuk nomornya sendiri (tidak ada jalur mengisi
