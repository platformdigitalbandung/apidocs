      summary: Tambah atau perbarui ritme mingguan (kaprodi; ritme yang dipakai prodi lain tidak bisa diubah)
      description: >-
        Idempoten per nama. Hari harus nama hari Bahasa Indonesia dan moda
        salah satu dari asinkron, daring_sinkron, opsional_luring_daring,
        bebas. total_menit_per_minggu boleh dikosongkan - dijumlahkan dari
        sesinya; kalau diisi harus sama persis dengan jumlah itu. Ritme dipakai
        bersama semua prodi lewat nama, jadi kaprodi boleh menambah ritme baru
        dan mengubah ritme yang hanya dipakai kalender prodinya (atau belum
