      security:
        - token:
            - write:apiKey
            - read:apiKey
  /send/message/document:
    post:
      tags:
        - message
      summary: Kirim pesan document
      description: Mengirimkan pesan document kepada perorangan atau group
      operationId: sendMessageDoc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /whatsauth/request:
    post:
      tags:
        - whatsauth
      summary: Permintaan otorisasi aplikasi
      description: Mengirimkan token otorisasi pada user
      operationId: whatsauthRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAuth'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
components:
  schemas:
    JID:
      type: object
      properties:
        User:
          type: string
          description: The user ID
        RawAgent:
          type: integer
          format: int32
          description: The raw agent
        Device:
          type: integer
          format: int32
          description: The device ID
        Integrator:
          type: integer
          format: int32
          description: The integrator ID
        Server:
          type: string
          description: The server
      required:
        - User
        - RawAgent
        - Device
        - Integrator
        - Server
    VerifiedName:
      type: object
      properties:
        Name:
          type: string
          description: The verified business name
        Certainty:
          type: string
          description: The certainty of the verification
      required:
        - Name
        - Certainty
    WaList:
      type: object
      properties:
        phonenumbers:
          type: array
          items:
            $ref: '#/components/schemas/IsOnWhatsAppResponse'
      required:
        - phonenumbers
    IsOnWhatsAppResponse:
      type: object
      properties:
        Query:
          type: string
          description: The query string used
        JID:
          $ref: '#/components/schemas/JID'
        IsIn:
          type: boolean
          description: Whether the phone is registered or not
        VerifiedName:
          $ref: '#/components/schemas/VerifiedName'
      required:
        - Query
        - JID
        - IsIn
    WebHook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.site/
            secret: 
              type: string
              example: isju8ekf9ke
            readstatusoff: 
              type: boolean
              example: false
            sendtyping: 
              type: boolean
              example: false
    BotAccount:
      type: object
      properties:
        phonenumber:
          type: string
          example: 6281111
        webhook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.com
            secret: 
              type: string
              example: isju8ekf9ke
        token:
          type: string
          example: v4.public.asoiduas
    PhoneList:
      type: object
      properties:
        phoneNumbers:
          type: array
          items:
            type: string
          description: Daftar nomor telepon
      required:
        - phoneNumbers
      example:
        phoneNumbers:
          - "08123456789"
          - "81234567890"
          - "628123456789"
    TextMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        isgroup:
          type: boolean
          example: false
        messages:
          type: string
          example: hai kak
    ImageMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64image:
          type: string
          example: iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mP8/5+hnoEIwDiqkL4KAcT9GO0U4BxoAAAAAElFTkSuQmCC
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    DocumentMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64doc:
          type: string
          example: 
        filename:
          type: string
          example: filename.pdf
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    WhatsAuth:
      type: object
      properties:
        uuid:
          type: string
          example: isodjaoidsjaoid
        phonenumber:
          type: string
          example: 6281212
        delay:
          type: integer
          example: 2
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
          example: Nomor tidak terdaftar di whatsapp
    TextMessageResponse:
      type: object
      properties:
        Timestamp:
          type: string
          example: 2024-08-02T06:34:58Z
        ID:
          type: string
          example: 3EB0B5C35133EC28D4EA1B
        ServerID:
          type: integer
          example: 0
        DebugTimings:
                    type: object
                    properties:
                      Queue:
                        type: integer
                        example: 480
                      Marshal:
                        type: integer
                        example: 11410
                      GetParticipants:
                        type: integer
                        example: 0
                      GetDevices:
                        type: integer
                        example: 227151959
                      GroupEncrypt:
                        type: integer
                        example: 0
                      PeerEncrypt:
                        type: integer
                        example: 31024016
                      Send:
                        type: integer
                        example: 98170
                      Resp:
                        type: integer
                        example: 234692326
                      Retry:
                        type: integer
                        example: 0
    DeviceResponse:
      type: object
      properties:
        phonenumber:
          type: string
          example: 628888888
        status:
          type: boolean
          example: false
        code:
          type: string
          example: RGCF-L1LH
        message:
          type: string
          example: Pair Code Device
    DetailError:
      description: Bentuk error khusus modul Portal Tugas & Kurikulum (beda dari ErrorMessage yang dipakai modul WhatsAuth)
      type: object
      properties:
        detail:
          type: string
          example: Tugas tidak ditemukan
    TugasRingkas:
      type: object
      properties:
        id:
          type: string
        judul:
          type: string
        deskripsi:
          type: string
        n_kiriman:
          type: integer
    BuatTugasRequest:
      type: object
      properties:
        judul:
          type: string
          example: Tugas Besar Basis Data
        deskripsi:
          type: string
          example: Kerjakan rancangan ERD dan normalisasi
      required:
        - judul
    PerKiriman:
      type: object
      properties:
        id:
          type: string
        nama:
          type: string
        nim:
          type: string
        filename:
          type: string
        max_score:
          type: number
          nullable: true
        pasangan_id:
          type: string
          nullable: true
        pasangan_nama:
          type: string
        band:
          type: string
    Pasangan:
      type: object
      properties:
        a_id:
          type: string
        a_nama:
          type: string
        b_id:
          type: string
        b_nama:
          type: string
        score:
          type: number
        band:
          type: string
    LaporanKemiripan:
      type: object
      properties:
        tugas_id:
          type: string
        disclaimer:
          type: string
          example: "Skor adalah kemiripan tekstual, bukan vonis plagiat. Keputusan akhir tetap pada dosen setelah pemeriksaan manual."
        per_kiriman:
          type: array
          items:
            $ref: '#/components/schemas/PerKiriman'
        pasangan:
          type: array
          items:
            $ref: '#/components/schemas/Pasangan'
    BebanMingguan:
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        minggu:
          type: integer
          description: Nomor minggu dalam kalender semester
          example: 3
        tanggal_mulai:
          type: string
          format: date
          example: "2026-09-07"
        menit_total:
          type: integer
          description: Total menit instruksional terjadwal pada minggu itu
          example: 1440
        sks:
          type: number
          format: float
          description: menit_total dibagi 85 menit per SKS, dibulatkan satu desimal
          example: 16.9
        kapasitas_sks:
          type: number
          format: float
          description: Kapasitas SKS per semester menurut ritme mingguan
          example: 16.9
        hari:
          type: array
          items:
            type: string
          description: Hari yang benar-benar berjadwal; hari bebas (0 menit) tidak disebut
          example: [Senin, Selasa, Rabu, Kamis, Jumat]
        catatan:
          type: string
          description: Terisi hanya kalau ada hari di luar ritme sehingga menitnya diperkirakan dari selisih jam
    CakupanCPL:
      type: object
      properties:
        cpl_kode:
          type: string
          example: CPL02
        domain:
          type: string
          example: Pengetahuan
        tercapai:
          type: boolean
          example: true
        rumpun_bukti:
          type: array
          items:
            type: string
          description: Rumpun yang sudah punya nilai lulus DAN menyentuh CPL ini; kosong berarti belum tercapai
          example: [R1]
    RingkasanCakupanCPL:
      type: object
      properties:
        prodi_kode:
          type: string
          example: trpl
        nim:
          type: string
          description: Terisi pada cakupan per mahasiswa, kosong pada agregat prodi
          example: "2026001"
        total:
          type: integer
          example: 11
        tercapai:
          type: integer
          example: 7
        daftar:
          type: array
          items:
            $ref: '#/components/schemas/CakupanCPL'
    ProyekBlok:
      description: Instance proyek nyata di atas satu rumpun kurikulum untuk satu angkatan. Definisi mata kuliah dan CPL-nya tidak diduplikasi ke sini - ambil dari rumpun lewat rumpun_kode.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        rumpun_kode:
          type: string
          description: Kode rumpun kurikulum yang jadi cetak biru blok ini
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_nip:
          type: string
          description: NIP dosen pembimbing/penilai utama - hanya dia (atau admin) yang boleh menginput nilai
          example: "198001012020121001"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          enum:
            - draft
            - berjalan
            - selesai
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          example: 8
    MataKuliah:
      description: >-
        Satu mata kuliah kurikulum, milik satu rumpun. Diturunkan dari
        `rumpun.mata_kuliah` saat seed - bukan daftar kedua yang diketik ulang.
      type: object
      properties:
        id:
          type: string
          example: 66f1a2b3c4d5e6f7a8b9c0d1
        kode:
          type: string
          description: Unik per prodi, diturunkan dari nama mata kuliah
          example: LITERASI-DIGITAL
        nama:
          type: string
          example: Literasi Digital
        sks:
          type: integer
          description: Angka, bukan teks di dalam tanda kurung
          example: 3
        prodi_kode:
          type: string
          example: trpl
        rumpun_kode:
          type: string
          example: R1
        semester:
          type: integer
          example: 1
        cpl:
          type: array
          description: Opsional; pemetaan CPL yang berlaku sekarang ada di level rumpun
          items:
            type: string
    AnggotaProyek:
      description: >-
        Anggota proyek. Hanya `nim` yang bermakna sebagai masukan - ia kunci asing
        ke koleksi `mahasiswa`. `nama` dan `phonenumber` adalah cuplikan yang
        diselaraskan server dari roster saat proyek disimpan; nilai yang dikirim
        klien untuk kedua field itu diabaikan kalau NIM-nya sudah ada di roster.
      type: object
      properties:
        nim:
          type: string
          description: Kunci asing ke koleksi `mahasiswa`. Prodi anggota harus sama dengan prodi proyek.
          example: "2026001"
        nama:
          type: string
          readOnly: true
          description: Cuplikan dari roster - bukan masukan.
          example: Budi Santoso
        phonenumber:
          type: string
          readOnly: true
          description: >-
            Cuplikan nomor WhatsApp dari roster, dipakai untuk notifikasi. Kepemilikan
            NIM di GET /mahasiswa/{nim}/nilai dibuktikan lewat roster, bukan lewat
            nomor yang tersimpan di dokumen proyek ini.
          example: "6281234567890"
    SetNIPRequest:
      type: object
      properties:
        nohp:
          type: string
          description: Kosongkan untuk mengisi NIP nomor sendiri. Diisi hanya oleh admin untuk dosen lain.
          example: "6281312000300"
        nip:
          type: string
          example: "198501012010011001"
    Mahasiswa:
      description: Satu baris roster akademik. Bukan akun - autentikasi tetap WhatsAuth, dan phonenumber di sini yang menghubungkan token ke identitas akademik.
      type: object
      properties:
        id:
          type: string
        nim:
          type: string
          description: Kunci akademik, unik
          example: "2026001"
        nama:
          type: string
          example: Budi Santoso
        phonenumber:
          type: string
          description: Nomor WhatsApp yang dipakai login WhatsAuth
          example: "6281234567890"
        email:
          type: string
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          description: Semester berjalan, dipakai memilih kalender akademik yang berlaku
          example: 5
        status:
          type: string
          enum: [aktif, cuti, lulus, keluar]
          example: aktif
    TautanTinjauan:
      description: Tautan sekali-pakai untuk atasan, diterbitkan dosen lalu diteruskan sendiri ke atasan.
      type: object
      properties:
        proyek_kerja_id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        atasan_nama:
          type: string
          example: Ibu Atasan
        url:
          type: string
          example: https://platform.digitalbdg.ac.id/tinjauan.html?token=v4.public.xxxx
        token:
          type: string
        kedaluwarsa:
          type: string
          format: date-time
    RingkasTinjauanAtasan:
      description: Tampilan proyek untuk halaman tinjauan atasan - tanpa NIM dan nomor WhatsApp mahasiswa.
      type: object
      properties:
        proyek_kerja_id:
          type: string
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        atasan_nama:
          type: string
          example: Ibu Atasan
        status:
          type: string
          example: berjalan
        sudah_ditinjau:
          type: array
          description: Jenis tinjauan yang sudah dikirim atasan ini
          items:
            type: string
            enum: [tengah-semester, akhir]
    TinjauanAtasanRequest:
      type: object
      properties:
        token:
          type: string
          description: Token dari tautan tinjauan - boleh juga dikirim sebagai query
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
        bukti_url:
          type: array
          items:
            type: string
    ProyekKerja:
      description: Proyek semester-panjang di tempat kerja mahasiswa, dikonversi jadi SKS satu rumpun kurikulum.
      type: object
      properties:
        id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        nim:
          type: string
          example: "2026001"
        phonenumber:
          type: string
          description: Diisi server dari token WhatsAuth saat pengajuan - bukti kepemilikan NIM
          example: "6281234567890"
        prodi_kode:
          type: string
          example: trpl
        semester:
          type: integer
          example: 5
        rumpun_kode:
          type: string
          example: R11
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        dosen_nip:
          type: string
          description: Diisi saat dosen memutuskan pengajuan
          example: "198501012010011001"
        atasan_nama:
          type: string
          example: Ibu Atasan
        atasan_email:
          type: string
          example: atasan@contoh.co.id
        atasan_phonenumber:
          type: string
        status:
          type: string
          enum: [diajukan, disetujui, berjalan, tinjauan-tengah, selesai, ditolak]
          example: diajukan
        catatan:
          type: string
          description: Alasan penolakan atau catatan putusan dosen
    TinjauanProyekKerja:
      description: Satu tinjauan dari satu penilai pada satu titik waktu. Satu peran hanya punya satu tinjauan per jenis.
      type: object
      properties:
        id:
          type: string
        proyek_kerja_id:
          type: string
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        penilai_peran:
          type: string
          enum: [dosen, atasan]
        penilai_nama:
          type: string
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
        bukti_url:
          type: array
          items:
            type: string
    AjukanProyekKerjaRequest:
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        prodi_kode:
          type: string
          example: trpl
        semester:
          type: integer
          example: 5
        rumpun_kode:
          type: string
          example: R11
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        atasan_nama:
          type: string
          example: Ibu Atasan
        atasan_email:
          type: string
          example: atasan@contoh.co.id
        atasan_phonenumber:
          type: string
    PutusanProyekKerjaRequest:
      type: object
      properties:
        setuju:
          type: boolean
          example: true
        catatan:
          type: string
          description: Wajib diisi kalau menolak
    TinjauanProyekKerjaRequest:
      type: object
      properties:
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        penilai_nama:
          type: string
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
        bukti_url:
          type: array
          items:
            type: string
    ProyekKerjaSaya:
      description: Proyek kerja milik pemegang token - yang dibimbing (dosen) atau yang diajukan sendiri (mahasiswa).
      type: object
      properties:
        peran:
          type: string
          enum: [dosen, mahasiswa]
        nip:
          type: string
          description: Diisi hanya untuk dosen
        proyekkerja:
          type: array
          items:
            $ref: '#/components/schemas/ProyekKerja'
    KalenderSemester:
      description: Kalender satu semester untuk satu prodi dan angkatan, diturunkan dari ritme mingguan kurikulum.
      type: object
      properties:
        id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          example: 1
        tanggal_mulai:
          type: string
          format: date-time
          description: Hari Senin pada pekan pertama semester
        sesi:
          type: array
          items:
            $ref: '#/components/schemas/SesiKalender'
        diterbitkan:
          type: boolean
          description: false = draft, belum terlihat publik
          example: false
        diterbitkan_pada:
          type: string
          format: date-time
    SesiKalender:
      description: Satu sesi harian pada kalender, hasil penerjemahan SesiHari ritme mingguan ke tanggal konkret.
      type: object
      properties:
        minggu:
          type: integer
          example: 1
        tanggal:
          type: string
          format: date-time
        hari:
          type: string
          example: Jumat
        moda:
          type: string
          example: opsional_luring_daring
        jam_mulai:
          type: string
          example: "08:00"
        jam_selesai:
          type: string
          example: "20:00"
        keterangan:
          type: string
        rumpun_kode:
          type: string
          description: FK opsional ke Rumpun.Kode
          example: R1
    BuatKalenderRequest:
      type: object
      properties:
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          example: 1
        tanggal_mulai:
          type: string
          description: Format YYYY-MM-DD. Kalau bukan hari Senin, dipakai hari Senin pada pekan yang sama.
          example: "2026-09-14"
        jumlah_minggu:
          type: integer
          description: Kosong = 16
          example: 16
    ProyekSaya:
      description: Proyek milik pemegang token - yang dibimbing (dosen) atau yang diikuti (mahasiswa).
      type: object
      properties:
        peran:
          type: string
          enum: [dosen, mahasiswa]
          example: mahasiswa
        nip:
          type: string
          description: Diisi hanya untuk dosen yang NIP-nya sudah terdaftar
          example: "198501012010011001"
        nim:
          type: string
          description: NIM pemilik nomor, diisi hanya untuk peran mahasiswa
          example: "2026001"
        proyekblok:
          type: array
          items:
            $ref: '#/components/schemas/ProyekBlok'
    PenilaianProyek:
      description: Satu baris nilai per (proyek, nim, kode_mk) - satu proyek menilai beberapa mata kuliah sekaligus lewat artefak yang berbeda, jadi satu mahasiswa punya beberapa baris dalam satu proyek.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901299
        proyek_blok_id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        nim:
          type: string
          example: "2026001"
        kode_mk:
          type: string
          description: >-
            Kunci asing ke koleksi `matakuliah` - kode stabil, bukan teks tampilan.
            Server mengkanonikkannya saat menyimpan, jadi nilai yang dikembalikan di
            sini selalu bentuk kode ini apa pun ejaan yang dikirim.
          example: LITERASI-DIGITAL
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        nilai_akhir:
          type: number
          description: Selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15, tidak pernah diinput manual
          example: 84.25
        catatan:
          type: string
          example: Portofolio rapi, presentasi perlu latihan lagi
        dinilai_oleh:
          type: string
          description: Identitas penilai yang sebenarnya (bisa admin, bukan selalu pembimbing) - NIP dosen kalau nomor WhatsApp di token terdaftar punya NIP, kalau tidak nomornya sendiri dengan awalan "wa:"
          example: "198001012020121001"
    KomponenNilai:
      description: Keempat komponen nilai, masing-masing berskala 0-100. Bobotnya tetap - hasil proyek 40%, ujian 30%, kuis 15%, presentasi 15% - dan dihitung di server, tidak disimpan per dokumen.
      type: object
      properties:
        hasil_proyek:
          type: number
          description: Skala 0-100, boleh memakai nilai kelompok (bobot 40%)
          minimum: 0
          maximum: 100
          example: 88
        ujian:
          type: number
          description: Skala 0-100, individu - ujian berpengawas di kampus (bobot 30%)
          minimum: 0
          maximum: 100
          example: 80
        kuis:
          type: number
          description: Skala 0-100, individu (bobot 15%)
          minimum: 0
          maximum: 100
          example: 85
        presentasi:
          type: number
          description: Skala 0-100, individu meski proyeknya kelompok (bobot 15%)
          minimum: 0
          maximum: 100
          example: 82
    RekapNilai:
      description: Bentuk ringkas nilai satu mahasiswa - nilai akhir per mata kuliah beserta rata-ratanya.
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        per_mata_kuliah:
          type: object
          description: Peta nama mata kuliah ke nilai akhirnya
          additionalProperties:
            type: number
          example:
            Literasi Digital (3): 84.25
            Kewirausahaan (3): 79.5
        rata_rata:
          type: number
          description: Rata-rata dari nilai akhir tiap mata kuliah (bukan dari komponen), dibulatkan 2 angka desimal
          example: 81.88
    BuatProyekBlokRequest:
      type: object
      properties:
        rumpun_kode:
          type: string
          description: Kode rumpun yang harus sudah ada di data kurikulum prodi itu
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_nip:
          type: string
          example: "198001012020121001"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          description: Kalau dikosongkan, diisi draft
          enum:
            - draft
            - berjalan
            - selesai
          default: draft
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          description: Tidak boleh negatif dan tidak boleh lebih awal dari mulai_minggu
          example: 8
      required:
        - rumpun_kode
        - prodi_kode
        - angkatan
        - judul
        - dosen_nip
    InputNilaiRequest:
      description: Body input nilai. nilai_akhir tidak ada di sini karena selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15.
      type: object
      properties:
        nim:
          type: string
          description: Harus NIM yang terdaftar sebagai anggota proyek ini
          example: "2026001"
        kode_mk:
          type: string
          description: >-
            Mata kuliah yang dinilai, harus milik rumpun proyek ini. Boleh ditulis
            sebagai kode (`LITERASI-DIGITAL`), nama lengkap (`Literasi Digital`), atau
            sebagian nama (`literasi`) - server mencocokkannya ke koleksi `matakuliah`
            lalu menyimpan `kode`-nya. Masukan yang cocok ke DUA mata kuliah ditolak
            dengan 422 yang menyebut pilihan yang sah, bukan ditebak. Nilai yang
            tersimpan dan dikembalikan selalu bentuk kode.
          example: literasi digital
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        catatan:
          type: string
          description: Opsional
          example: Portofolio rapi, presentasi perlu latihan lagi
      required:
        - nim
        - kode_mk
        - komponen
  requestBodies:
    TextMessageReq:
      description: Kirim Pesan teks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextMessage'
    TextMessageResp:
      description: Respon dari request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TextMessageResponse'
  securitySchemes:
    token:
      type: apiKey
      name: token
      in: header
    dosenToken:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.public
      description: >-
        Token PASETO WhatsAuth (keypair bersama PUBLICKEY/PRIVATEKEY) dari nomor
        WhatsApp yang terdaftar sebagai dosen, didapat lewat alur POST
        /whatsauth/request. Dikirim sebagai `Authorization: Bearer <token>` —
        BUKAN header `token` seperti endpoint WhatsApp/device di atas. Dokumen
        ini sebelumnya mendeklarasikannya sebagai apiKey header `token`, tidak
        sesuai kode (`mod/portaltugas/auth.go`, `mod/proyekblok/auth.go`
        keduanya membaca header Authorization).
