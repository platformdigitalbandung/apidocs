        rumpun - bukan kunci; kuncinya tetap `kode`. Dipertahankan saat rumpunnya
        disimpan ulang, tapi tidak ikut ke mata kuliah yang berganti nama (kode
        platformnya berubah). Kirim `""` untuk menghapus atributnya. Bentuknya
        dirapikan ke huruf besar; maksimal 32 karakter huruf, angka, titik,
        garis miring, atau tanda hubung.
