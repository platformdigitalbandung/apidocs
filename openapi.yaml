openapi: 3.0.3
info:
  title: Dokumen API Platform
  description: >-
    Penjelasan tata cara pemakaian API dari Whatsauth.


    Catatan: dua route websocket di backend (`/ws/whatsauth/public` untuk QR auth,
    `/ws/chatgpl/public` untuk chatGPL) tidak didokumentasikan di sini karena
    OpenAPI 3.0 tidak punya skema native untuk websocket.
  termsOfService: https://wa.my.id
  contact:
    email: awangga@gmail.com
  license:
    name: Buat dulu webhook untuk menerima dan mengirim pesan
    url: https://github.com/whatsauth/webhook
  version: 1.1.0
externalDocs:
  description: Pendaftaran Token Whatsauth
  url: https://wa.my.id
servers:
  - url: https://apk.fly.dev/api
tags:
  - name: botregister
    description: Pendaftaran nomor bot WhatsApp atau refresh token, disertai URL dan Secret WebHook. Bukan pendaftaran pengguna aplikasi - identitas orang datang dari WhatsAuth.
    externalDocs:
      description: Contoh Kode WebHook
      url: https://github.com/whatsauth/webhook
  - name: device
    description: Set whatsapp yg digunakan
    externalDocs:
      description: Tata cara input kode
      url: https://faq.whatsapp.com/1324084875126592
  - name: message
    description: Mengirim pesan ke tujuan
    externalDocs:
      description: Contoh Kode Program
      url: https://github.com/whatsauth/webhook/blob/09c999be72e25660395f27c879456938a57561d1/function.go#L36C9-L36C9
  - name: whatsauth
    description: Get Token and Authorize
  - name: version
    description: Cek status dan commit deployan yang sedang berjalan
  - name: tugas
    description: Portal Tugas - pengumpulan tugas mahasiswa dan laporan kemiripan
  - name: kurikulum
    description: Data referensi kurikulum - prodi, rumpun, CPL, ritme mingguan
  - name: proyekblok
    description: Modul Blok/Proyek - instance proyek per rumpun kurikulum dan penilaian per mahasiswa per mata kuliah
paths:
  /health:
    get:
      tags:
        - tugas
      summary: Health check Portal Tugas
      description: Mengembalikan status service dan jumlah tugas yang tersimpan
      operationId: healthTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  n_tugas:
                    type: integer
                    example: 3
  /tugas:
    get:
      tags:
        - tugas
      summary: Daftar tugas
      operationId: daftarTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tugas:
                    type: array
                    items:
                      $ref: '#/components/schemas/TugasRingkas'
    post:
      tags:
        - tugas
      summary: Buat tugas baru
      description: Hanya dosen yang sudah login lewat WhatsAuth (lihat /whatsauth/request) yang bisa membuat tugas
      operationId: buatTugas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatTugasRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 66f0a1b2c3d4e5f678901234
                  judul:
                    type: string
                    example: Tugas Besar Basis Data
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal (judul/deskripsi tidak sesuai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /tugas/{id}:
    get:
      tags:
        - tugas
      summary: Detail tugas
      operationId: detailTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  judul:
                    type: string
                  deskripsi:
                    type: string
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/kirim:
    post:
      tags:
        - tugas
      summary: Kumpulkan berkas tugas
      description: Endpoint publik untuk mahasiswa mengumpulkan tugas. Body berupa multipart/form-data berisi nama, nim, dan berkas.
      operationId: kirimTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: Budi Santoso
                nim:
                  type: string
                  example: "1301210001"
                berkas:
                  type: string
                  format: binary
              required:
                - nama
                - nim
                - berkas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  kiriman_id:
                    type: string
                  n_kata:
                    type: integer
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Nama/NIM/berkas tidak valid atau gagal diekstrak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/laporan:
    get:
      tags:
        - tugas
      summary: Laporan kemiripan tugas
      description: Hanya dosen yang sudah login yang bisa mengakses laporan kemiripan antar kiriman
      operationId: laporanTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKemiripan'
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dosen/ping:
    get:
      tags:
        - tugas
      summary: Cek validitas token dosen
      operationId: pingDosen
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  user:
                    type: string
                    example: dosen
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kurikulum/prodi:
    get:
      tags:
        - kurikulum
      summary: Daftar program studi
      operationId: daftarProdi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  prodi:
                    type: array
                    items:
                      type: object
  /kurikulum/prodi/{prodi}/rumpun:
    get:
      tags:
        - kurikulum
      summary: Daftar rumpun matakuliah suatu prodi
      operationId: daftarRumpun
      parameters:
        - in: path
          name: prodi
          schema:
            type: string
          required: true
          description: Kode/slug program studi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  rumpun:
                    type: array
                    items:
                      type: object
  /kurikulum/seed:
    post:
      tags:
        - kurikulum
      summary: Seed data referensi kurikulum
      description: Menulis data referensi kurikulum (prodi, rumpun, CPL, ritme mingguan) ke Mongo. Idempoten, langkah manual satu kali dipanggil operator setelah deploy - dilindungi token dosen yang sama dengan Portal Tugas.
      operationId: seedKurikulum
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  ringkasan:
                    type: object
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekblok:
    get:
      tags:
        - proyekblok
      summary: Daftar proyek blok
      description: Siapa pun yang memegang token WhatsAuth yang masih berlaku boleh melihat daftar proyek blok. Token dikirim lewat header Authorization berisi "Bearer <token>". Filter prodi dan angkatan opsional - kalau keduanya dikosongkan seluruh proyek dikembalikan.
      operationId: daftarProyekBlok
      parameters:
        - in: query
          name: prodi
          schema:
            type: string
          required: false
          description: Kode/slug program studi, saring daftar ke satu prodi saja
          example: trpl
        - in: query
          name: angkatan
          schema:
            type: string
          required: false
          description: Tahun angkatan, saring daftar ke satu angkatan saja
          example: "2026"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyekblok:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProyekBlok'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    post:
      tags:
        - proyekblok
      summary: Buat instance proyek blok
      description: Membuat instance proyek nyata di atas satu rumpun kurikulum (lihat /kurikulum/prodi/{prodi}/rumpun) untuk satu angkatan, beserta anggota dan dosen pembimbingnya. Hanya dosen - atau admin - yang sudah login lewat WhatsAuth (lihat /whatsauth/request) yang boleh membuatnya. Kalau status dikosongkan, nilainya diisi draft.
      operationId: buatProyekBlok
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatProyekBlokRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekBlok'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Pemegang token bukan dosen (dan bukan admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Body JSON tidak valid atau validasi gagal - mis. rumpun_kode tidak ada di data kurikulum prodi itu, judul kosong, status di luar draft/berjalan/selesai, selesai_minggu lebih awal dari mulai_minggu, atau ada nim anggota yang terdaftar dua kali
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekblok/saya:
    get:
      tags:
        - proyekblok
      summary: Proyek blok milik pemegang token
      description: Mengembalikan proyek yang dibimbing kalau nomor WhatsApp di token adalah dosen yang NIP-nya sudah terisi, selain itu proyek yang diikuti sebagai anggota beserta NIM pemilik nomor. Pada peran mahasiswa, nomor WhatsApp anggota lain dikosongkan. Dosen yang NIP-nya belum diisi mendapat peran dosen dengan daftar kosong dan tanpa nip. Fungsi domain yang sama dipakai perintah WhatsApp "daftar proyek saya".
      operationId: proyekBlokSaya
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekSaya'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekblok/{id}:
    get:
      tags:
        - proyekblok
      summary: Detail proyek blok beserta nilainya
      description: Mengembalikan satu proyek blok lengkap dengan seluruh baris penilaiannya (satu baris per mahasiswa per mata kuliah) dan rekap nilai per mahasiswa. Cukup token WhatsAuth yang masih berlaku.
      operationId: detailProyekBlok
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID proyek blok
          example: 66f0a1b2c3d4e5f678901234
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyek:
                    $ref: '#/components/schemas/ProyekBlok'
                  nilai:
                    type: array
                    items:
                      $ref: '#/components/schemas/PenilaianProyek'
                  rekap:
                    type: array
                    items:
                      $ref: '#/components/schemas/RekapNilai'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek blok tidak ditemukan (termasuk kalau id bukan ObjectID yang sah)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekblok/{id}/nilai:
    post:
      tags:
        - proyekblok
      summary: Input atau perbarui nilai satu mahasiswa untuk satu mata kuliah
      description: >-
        Menyimpan nilai satu mahasiswa untuk satu mata kuliah di dalam proyek
        blok ini. Satu proyek menilai beberapa mata kuliah sekaligus, jadi
        kirim satu permintaan per pasangan nim dan kode_mk. Pemanggilan ulang
        dengan pasangan nim dan kode_mk yang sama memperbarui baris yang sudah
        ada, bukan menambah baris baru.


        Hanya dosen pembimbing proyek ini - NIP-nya cocok dengan dosen_nip
        proyek - atau admin yang boleh menilai. Dosen lain yang terdaftar pun
        tidak boleh menilai proyek yang bukan bimbingannya.


        nilai_akhir TIDAK diterima dari body - nilainya selalu dihitung server
        dari komponen dengan bobot tetap hasil proyek 40%, ujian 30%, kuis 15%,
        presentasi 15%. Kalau body memuat nilai_akhir, isinya diabaikan.
      operationId: inputNilaiProyekBlok
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID proyek blok
          example: 66f0a1b2c3d4e5f678901234
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputNilaiRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenilaianProyek'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Pemegang token bukan dosen pembimbing proyek ini (dan bukan admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek blok tidak ditemukan (termasuk kalau id bukan ObjectID yang sah)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Body JSON tidak valid atau validasi gagal - mis. nim bukan anggota proyek ini, mata kuliah bukan bagian rumpun proyek, atau ada komponen di luar rentang 0-100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /mahasiswa/{nim}/nilai:
    get:
      tags:
        - proyekblok
      summary: Riwayat nilai satu mahasiswa
      description: Mengembalikan seluruh baris penilaian satu mahasiswa di semua proyek blok yang pernah diikutinya, beserta rekapnya. Dosen dan admin boleh melihat nilai siapa pun; mahasiswa hanya boleh melihat nilainya sendiri - kepemilikan NIM dibuktikan dari nomor WhatsApp di token yang terdaftar sebagai anggota proyek.
      operationId: nilaiMahasiswa
      parameters:
        - in: path
          name: nim
          schema:
            type: string
          required: true
          description: NIM mahasiswa
          example: "2026001"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  nim:
                    type: string
                    example: "2026001"
                  nilai:
                    type: array
                    items:
                      $ref: '#/components/schemas/PenilaianProyek'
                  rekap:
                    type: array
                    items:
                      $ref: '#/components/schemas/RekapNilai'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Mahasiswa hanya boleh melihat nilainya sendiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /v3/official/send/message/text:
    post:
      tags:
        - message
      summary: Kirim pesan teks (v3, nomor official)
      description: Mengirimkan pesan teks memakai nomor official milik user yang sedang login (token di header, bukan di body)
      operationId: sendMessageTextV3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '403':
          description: Token tidak valid atau tidak punya akses ke nomor official
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /version:
    get:
      tags:
        - version
      summary: Cek status aplikasi
      description: Mengembalikan status aplikasi dan git commit dari deployan yang sedang berjalan, dipakai untuk memastikan deployan berhasil tanpa perlu cek log server.
      operationId: getVersion
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  commit:
                    type: string
                    example: d4a105de7b3078d3c2c29121c4477ca41da7079a
  /botregister:
    post:
      tags:
        - botregister
      summary: Pendaftaran nomor bot WhatsApp atau refresh access token
      description: Mendaftarkan/memperbarui webhook satu nomor BOT WhatsApp beserta token API 30 hari. Ini bukan pendaftaran pengguna aplikasi - platform ini tidak punya pendaftaran pengguna, identitas orang datang dari WhatsAuth. Dokumennya disimpan di koleksi Mongo "bot" (nama lama "user").
      operationId: botRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebHook'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotAccount'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /signup:
    post:
      deprecated: true
      tags:
        - botregister
      summary: (usang) Alias lama /botregister
      description: Nama lama yang menyesatkan - endpoint ini mendaftarkan nomor bot, bukan pengguna aplikasi. Masih dilayani sementara supaya onboarding yang sudah berjalan tidak putus; pakai POST /botregister untuk seterusnya.
      operationId: signUpNewUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebHook'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotAccount'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /device/{token}:
    get:
      tags:
        - device
      summary: Add device Whatsapp
      description: Menambahkan wa user ke server untuk dipakai oleh api dengan memasukkan code dari respon server
      operationId: getDevice
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
          description: Token yang diberikan kepada user
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid status value
  /device/status/{token}:
    get:
      tags:
        - device
      summary: Cek status pairing device
      description: Cek status koneksi device WhatsApp — TIDAK memicu permintaan pair code baru (beda dari GET /device/{token}). Catatan — bukan benar-benar read-only, kalau client belum ada di memori server, endpoint ini tetap membuat koneksi baru di background. Berguna untuk troubleshoot tanpa perlu cek log server.
      operationId: getDeviceStatus
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
          description: Token yang diberikan kepada user
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  phonenumber:
                    type: string
                    example: "6282258512828"
                  store_id_ada:
                    type: boolean
                    description: Pernah berhasil pairing (sesi tersimpan di Postgres)
                  is_connected:
                    type: boolean
                    description: Socket websocket ke server WhatsApp sedang tersambung
                  is_logged_in:
                    type: boolean
                    description: Sesi sudah lolos login penuh, siap kirim/terima pesan
        '403':
          description: Token tidak valid
  /numbers/isonwa:
    post:
      tags:
        - device
      summary: Cek apakan nomor sudah terdaftar di Whatsapp atau belum
      description: Pengecekan daftar nomor yang akan di cek apakah ada di whatsapp atau belum
      operationId: isOnWhatsApp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneList'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaList'
        '400':
          description: Invalid status value
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /v2/send/message/text:
    post:
      tags:
        - message
      summary: Kirim pesan teks
      description: Mengirimkan pesan teks kepada perorangan atau group
      operationId: sendMessageText
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '503':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /send/message/image:
    post:
      tags:
        - message
      summary: Kirim pesan gambar
      description: Mengirimkan pesan gambar kepada perorangan atau group
      operationId: sendMessageImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /send/message/document:
    post:
      tags:
        - message
      summary: Kirim pesan document
      description: Mengirimkan pesan document kepada perorangan atau group
      operationId: sendMessageDoc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /whatsauth/request:
    post:
      tags:
        - whatsauth
      summary: Permintaan otorisasi aplikasi
      description: Mengirimkan token otorisasi pada user
      operationId: whatsauthRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAuth'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
components:
  schemas:
    JID:
      type: object
      properties:
        User:
          type: string
          description: The user ID
        RawAgent:
          type: integer
          format: int32
          description: The raw agent
        Device:
          type: integer
          format: int32
          description: The device ID
        Integrator:
          type: integer
          format: int32
          description: The integrator ID
        Server:
          type: string
          description: The server
      required:
        - User
        - RawAgent
        - Device
        - Integrator
        - Server
    VerifiedName:
      type: object
      properties:
        Name:
          type: string
          description: The verified business name
        Certainty:
          type: string
          description: The certainty of the verification
      required:
        - Name
        - Certainty
    WaList:
      type: object
      properties:
        phonenumbers:
          type: array
          items:
            $ref: '#/components/schemas/IsOnWhatsAppResponse'
      required:
        - phonenumbers
    IsOnWhatsAppResponse:
      type: object
      properties:
        Query:
          type: string
          description: The query string used
        JID:
          $ref: '#/components/schemas/JID'
        IsIn:
          type: boolean
          description: Whether the phone is registered or not
        VerifiedName:
          $ref: '#/components/schemas/VerifiedName'
      required:
        - Query
        - JID
        - IsIn
    WebHook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.site/
            secret: 
              type: string
              example: isju8ekf9ke
            readstatusoff: 
              type: boolean
              example: false
            sendtyping: 
              type: boolean
              example: false
    BotAccount:
      type: object
      properties:
        phonenumber:
          type: string
          example: 6281111
        webhook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.com
            secret: 
              type: string
              example: isju8ekf9ke
        token:
          type: string
          example: v4.public.asoiduas
    PhoneList:
      type: object
      properties:
        phoneNumbers:
          type: array
          items:
            type: string
          description: Daftar nomor telepon
      required:
        - phoneNumbers
      example:
        phoneNumbers:
          - "08123456789"
          - "81234567890"
          - "628123456789"
    TextMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        isgroup:
          type: boolean
          example: false
        messages:
          type: string
          example: hai kak
    ImageMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64image:
          type: string
          example: iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mP8/5+hnoEIwDiqkL4KAcT9GO0U4BxoAAAAAElFTkSuQmCC
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    DocumentMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64doc:
          type: string
          example: 
        filename:
          type: string
          example: filename.pdf
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    WhatsAuth:
      type: object
      properties:
        uuid:
          type: string
          example: isodjaoidsjaoid
        phonenumber:
          type: string
          example: 6281212
        delay:
          type: integer
          example: 2
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
          example: Nomor tidak terdaftar di whatsapp
    TextMessageResponse:
      type: object
      properties:
        Timestamp:
          type: string
          example: 2024-08-02T06:34:58Z
        ID:
          type: string
          example: 3EB0B5C35133EC28D4EA1B
        ServerID:
          type: integer
          example: 0
        DebugTimings:
                    type: object
                    properties:
                      Queue:
                        type: integer
                        example: 480
                      Marshal:
                        type: integer
                        example: 11410
                      GetParticipants:
                        type: integer
                        example: 0
                      GetDevices:
                        type: integer
                        example: 227151959
                      GroupEncrypt:
                        type: integer
                        example: 0
                      PeerEncrypt:
                        type: integer
                        example: 31024016
                      Send:
                        type: integer
                        example: 98170
                      Resp:
                        type: integer
                        example: 234692326
                      Retry:
                        type: integer
                        example: 0
    DeviceResponse:
      type: object
      properties:
        phonenumber:
          type: string
          example: 628888888
        status:
          type: boolean
          example: false
        code:
          type: string
          example: RGCF-L1LH
        message:
          type: string
          example: Pair Code Device
    DetailError:
      description: Bentuk error khusus modul Portal Tugas & Kurikulum (beda dari ErrorMessage yang dipakai modul WhatsAuth)
      type: object
      properties:
        detail:
          type: string
          example: Tugas tidak ditemukan
    TugasRingkas:
      type: object
      properties:
        id:
          type: string
        judul:
          type: string
        deskripsi:
          type: string
        n_kiriman:
          type: integer
    BuatTugasRequest:
      type: object
      properties:
        judul:
          type: string
          example: Tugas Besar Basis Data
        deskripsi:
          type: string
          example: Kerjakan rancangan ERD dan normalisasi
      required:
        - judul
    PerKiriman:
      type: object
      properties:
        id:
          type: string
        nama:
          type: string
        nim:
          type: string
        filename:
          type: string
        max_score:
          type: number
          nullable: true
        pasangan_id:
          type: string
          nullable: true
        pasangan_nama:
          type: string
        band:
          type: string
    Pasangan:
      type: object
      properties:
        a_id:
          type: string
        a_nama:
          type: string
        b_id:
          type: string
        b_nama:
          type: string
        score:
          type: number
        band:
          type: string
    LaporanKemiripan:
      type: object
      properties:
        tugas_id:
          type: string
        disclaimer:
          type: string
          example: "Skor adalah kemiripan tekstual, bukan vonis plagiat. Keputusan akhir tetap pada dosen setelah pemeriksaan manual."
        per_kiriman:
          type: array
          items:
            $ref: '#/components/schemas/PerKiriman'
        pasangan:
          type: array
          items:
            $ref: '#/components/schemas/Pasangan'
    ProyekBlok:
      description: Instance proyek nyata di atas satu rumpun kurikulum untuk satu angkatan. Definisi mata kuliah dan CPL-nya tidak diduplikasi ke sini - ambil dari rumpun lewat rumpun_kode.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        rumpun_kode:
          type: string
          description: Kode rumpun kurikulum yang jadi cetak biru blok ini
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_nip:
          type: string
          description: NIP dosen pembimbing/penilai utama - hanya dia (atau admin) yang boleh menginput nilai
          example: "198001012020121001"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          enum:
            - draft
            - berjalan
            - selesai
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          example: 8
    AnggotaProyek:
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        nama:
          type: string
          example: Budi Santoso
        phonenumber:
          type: string
          description: Nomor WhatsApp anggota - dipakai untuk WhatsAuth dan notifikasi, sekaligus jadi bukti kepemilikan NIM di GET /mahasiswa/{nim}/nilai
          example: "6281234567890"
    ProyekSaya:
      description: Proyek milik pemegang token - yang dibimbing (dosen) atau yang diikuti (mahasiswa).
      type: object
      properties:
        peran:
          type: string
          enum: [dosen, mahasiswa]
          example: mahasiswa
        nip:
          type: string
          description: Diisi hanya untuk dosen yang NIP-nya sudah terdaftar
          example: "198501012010011001"
        nim:
          type: string
          description: NIM pemilik nomor, diisi hanya untuk peran mahasiswa
          example: "2026001"
        proyekblok:
          type: array
          items:
            $ref: '#/components/schemas/ProyekBlok'
    PenilaianProyek:
      description: Satu baris nilai per (proyek, nim, kode_mk) - satu proyek menilai beberapa mata kuliah sekaligus lewat artefak yang berbeda, jadi satu mahasiswa punya beberapa baris dalam satu proyek.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901299
        proyek_blok_id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        nim:
          type: string
          example: "2026001"
        kode_mk:
          type: string
          description: Salah satu mata kuliah pada rumpun proyek ini, ditulis sebagaimana tercatat di data kurikulum
          example: Literasi Digital (3)
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        nilai_akhir:
          type: number
          description: Selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15, tidak pernah diinput manual
          example: 84.25
        catatan:
          type: string
          example: Portofolio rapi, presentasi perlu latihan lagi
        dinilai_oleh:
          type: string
          description: Identitas penilai yang sebenarnya (bisa admin, bukan selalu pembimbing) - NIP dosen kalau nomor WhatsApp di token terdaftar punya NIP, kalau tidak nomornya sendiri dengan awalan "wa:"
          example: "198001012020121001"
    KomponenNilai:
      description: Keempat komponen nilai, masing-masing berskala 0-100. Bobotnya tetap - hasil proyek 40%, ujian 30%, kuis 15%, presentasi 15% - dan dihitung di server, tidak disimpan per dokumen.
      type: object
      properties:
        hasil_proyek:
          type: number
          description: Skala 0-100, boleh memakai nilai kelompok (bobot 40%)
          minimum: 0
          maximum: 100
          example: 88
        ujian:
          type: number
          description: Skala 0-100, individu - ujian berpengawas di kampus (bobot 30%)
          minimum: 0
          maximum: 100
          example: 80
        kuis:
          type: number
          description: Skala 0-100, individu (bobot 15%)
          minimum: 0
          maximum: 100
          example: 85
        presentasi:
          type: number
          description: Skala 0-100, individu meski proyeknya kelompok (bobot 15%)
          minimum: 0
          maximum: 100
          example: 82
    RekapNilai:
      description: Bentuk ringkas nilai satu mahasiswa - nilai akhir per mata kuliah beserta rata-ratanya.
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        per_mata_kuliah:
          type: object
          description: Peta nama mata kuliah ke nilai akhirnya
          additionalProperties:
            type: number
          example:
            Literasi Digital (3): 84.25
            Kewirausahaan (3): 79.5
        rata_rata:
          type: number
          description: Rata-rata dari nilai akhir tiap mata kuliah (bukan dari komponen), dibulatkan 2 angka desimal
          example: 81.88
    BuatProyekBlokRequest:
      type: object
      properties:
        rumpun_kode:
          type: string
          description: Kode rumpun yang harus sudah ada di data kurikulum prodi itu
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_nip:
          type: string
          example: "198001012020121001"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          description: Kalau dikosongkan, diisi draft
          enum:
            - draft
            - berjalan
            - selesai
          default: draft
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          description: Tidak boleh negatif dan tidak boleh lebih awal dari mulai_minggu
          example: 8
      required:
        - rumpun_kode
        - prodi_kode
        - angkatan
        - judul
        - dosen_nip
    InputNilaiRequest:
      description: Body input nilai. nilai_akhir tidak ada di sini karena selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15.
      type: object
      properties:
        nim:
          type: string
          description: Harus NIM yang terdaftar sebagai anggota proyek ini
          example: "2026001"
        kode_mk:
          type: string
          description: Harus salah satu mata kuliah pada rumpun proyek ini. Pencocokannya longgar (tanpa peka huruf besar, cocok sebagian), jadi "literasi digital" pun diterima untuk "Literasi Digital (3)".
          example: Literasi Digital (3)
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        catatan:
          type: string
          description: Opsional
          example: Portofolio rapi, presentasi perlu latihan lagi
      required:
        - nim
        - kode_mk
        - komponen
  requestBodies:
    TextMessageReq:
      description: Kirim Pesan teks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextMessage'
    TextMessageResp:
      description: Respon dari request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TextMessageResponse'
  securitySchemes:
    token:
      type: apiKey
      name: token
      in: header
    dosenToken:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.public
      description: >-
        Token PASETO WhatsAuth (keypair bersama PUBLICKEY/PRIVATEKEY) dari nomor
        WhatsApp yang terdaftar sebagai dosen, didapat lewat alur POST
        /whatsauth/request. Dikirim sebagai `Authorization: Bearer <token>` —
        BUKAN header `token` seperti endpoint WhatsApp/device di atas. Dokumen
        ini sebelumnya mendeklarasikannya sebagai apiKey header `token`, tidak
        sesuai kode (`mod/portaltugas/auth.go`, `mod/proyekblok/auth.go`
        keduanya membaca header Authorization).
