          example: "2026"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  mahasiswa:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mahasiswa'
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /mahasiswa/{nim}:
    delete:
      tags:
        - akademik
      summary: Hapus satu baris roster mahasiswa
      description: >-
        Menghapus HANYA baris rosternya. Nilai proyek blok, jawaban kuis
        gerbang, kehadiran ujian, pengajuan proyek kerja, dan pengajuan RPL
        milik NIM itu sengaja tidak ikut terhapus - itu catatan akademik dan
        bukti akreditasi. Akibatnya dokumen tersebut jadi yatim: NIM-nya tetap
        tersimpan tapi tidak bisa lagi diterjemahkan jadi nama, prodi, atau
        nomor WhatsApp. Karena itu NIM yang masih dirujuk ditolak 422 sampai
        diulang dengan konfirmasi=hapus. Untuk mahasiswa yang lulus atau
        berhenti, yang benar adalah mengubah status lewat POST /mahasiswa,
        bukan menghapus barisnya.
      operationId: hapusMahasiswa
      parameters:
        - in: path
          name: nim
          schema:
            type: string
          required: true
          example: "9999001"
        - in: query
          name: konfirmasi
          schema:
            type: string
            enum: [hapus]
          required: false
          description: Wajib diisi hapus kalau NIM ini masih dirujuk modul lain.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  dihapus:
                    type: string
                    example: "9999001"
                  rujukan_tertinggal:
                    type: string
                    description: Hanya muncul kalau penghapusan dipaksa dengan konfirmasi=hapus; menyebut dokumen yatim yang ditinggalkan.
                    example: 3 nilai proyek blok, 1 pengajuan proyek kerja
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: NIM tidak ada di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: NIM masih dirujuk modul lain dan konfirmasi=hapus belum diberikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/dasbor:
    get:
      tags:
        - proyekkerja
      summary: Dasbor kaprodi proyek kerja
      description: >-
        Berapa proyek kerja yang aktif dan mana yang telat tinjauan
        tengah-semester. Tenggatnya diambil dari kalender semester yang sudah
        TERBIT - titik tengah = sesi minggu ke-ceil(n/2) - bukan dari konstanta
        hari. Kalau kalender terbitnya belum ada, proyek aktif dihitung di
        `tanpa_acuan` dan TIDAK ditebak telat; bendera telat yang dikarang dari
        angka hari tidak bisa dipertanggungjawabkan ke siapa pun. Query
        `angkatan` hanya memilih kalender acuan, BUKAN menyaring proyek, karena
        dokumen proyekkerja tidak menyimpan angkatan.
      operationId: dasborProyekKerja
      parameters:
        - in: query
          name: prodi
          schema:
            type: string
          required: false
          example: trpl
        - in: query
          name: angkatan
          schema:
            type: string
          required: false
          description: Hanya menentukan kalender acuan titik tengah
          example: "2026"
        - in: query
          name: semester
          schema:
            type: integer
          required: false
          example: 5
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasanKaprodi'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kaprodi yang memimpin lebih dari satu prodi belum memilih prodi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan kaprodi prodi ini atau admin. Laporan tingkat prodi hanya untuk kaprodi (prodinya sendiri) dan admin (semua prodi); dosen biasa ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja:
    post:
      tags:
        - proyekkerja
      summary: Ajukan proyek kerja
      description: Mahasiswa mengajukan proyek di tempat kerjanya untuk dikonversi jadi SKS satu rumpun. Nomor WhatsApp diambil dari token, bukan dari body - itu yang jadi bukti kepemilikan NIM. Status awal diajukan; satu nim hanya boleh punya satu pengajuan yang belum ditolak per rumpun.
      operationId: ajukanProyekKerja
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjukanProyekKerjaRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekKerja'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal - field wajib kosong, surel atasan tidak sah, semester di luar rentang, rumpun tidak ada di data kurikulum, atau pengajuan untuk rumpun itu sudah ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/saya:
    get:
      tags:
        - proyekkerja
      summary: Proyek kerja milik pemegang token
      description: >-
        Mengembalikan proyek yang dibimbing kalau nomor pada token adalah dosen
        (dicocokkan lewat email kampus, atau NIP lama pada proyek yang belum
        dimigrasi), selain itu proyek yang diajukan sendiri. Proyek milik
        mahasiswa dicari lewat NIM dari roster `mahasiswa`, bukan lewat nomor WhatsApp
        yang tersalin di dokumen saat pengajuan - nomor bisa berganti, NIM tidak.
      operationId: proyekKerjaSaya
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekKerjaSaya'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >-
            Nomor pada token belum terdaftar di roster `mahasiswa`. Sengaja bukan daftar
            kosong: nomor di luar roster tidak mungkin punya pengajuan, karena pengajuannya
            sendiri sudah ditolak lebih dulu - daftar kosong akan terbaca seperti "Anda
            belum pernah mengajukan".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/tinjauan-atasan:
    get:
      tags:
        - proyekkerja
      summary: Ringkasan proyek untuk halaman tinjauan atasan
      description: Dipakai halaman tinjauan saat dimuat. Otorisasinya token tautan sekali-pakai, bukan WhatsAuth - atasan di kantor mahasiswa bukan pengguna platform ini. Balasannya sengaja ringkas dan tidak memuat NIM maupun nomor WhatsApp mahasiswa.
      operationId: ringkasTinjauanAtasan
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Token dari tautan tinjauan
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasTinjauanAtasan'
        '401':
          description: Tautan tidak sah, bukan tautan tinjauan atasan, atau sudah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
    post:
      tags:
        - proyekkerja
      summary: Atasan mengirim tinjauan lewat tautan
      description: Menyimpan tinjauan sebagai penilai_peran atasan lalu memperbarui status proyek. Balasannya hanya konfirmasi - isi dokumen proyek tidak dikirim balik ke pemegang tautan. Token boleh dikirim di body atau query.
      operationId: tinjauanAtasan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TinjauanAtasanRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  jenis:
                    type: string
                    example: tengah-semester
                  skor:
                    type: number
                    format: double
                    example: 88
                  status_proyek:
                    type: string
                    example: tinjauan-tengah
        '401':
          description: Tautan tidak sah atau sudah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Jenis atau skor tidak sah, atau proyek belum disetujui dan sudah selesai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /proyekkerja/{id}/tautan-tinjauan:
    post:
      tags:
        - proyekkerja
      summary: Terbitkan tautan tinjauan untuk atasan
      description: Dosen menerbitkan tautan sekali-pakai berumur 14 hari yang menunjuk satu proyek, lalu meneruskannya sendiri ke atasan. Platform ini belum punya pengiriman surel, dan mengirim otomatis lewat bot WhatsApp butuh nomor bot pengirim yang belum ada di konfigurasi. Tokennya memakai keypair PASETO yang sama dengan token lain.
      operationId: tautanTinjauanProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TautanTinjauan'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Proyek belum disetujui atau sudah selesai sehingga belum atau tidak lagi menerima tinjauan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/{id}:
    delete:
      tags:
        - proyekkerja
      summary: Hapus pengajuan proyek kerja
      description: Menghapus pengajuan beserta seluruh tinjauannya. Status diajukan atau ditolak langsung terhapus; status disetujui dan seterusnya perlu konfirmasi=hapus karena putusan dosen dan tinjauan yang sudah masuk ikut hilang. Tanpa endpoint ini satu nim dan rumpun yang salah ajukan terkunci selamanya, karena pengajuan kedua ditolak selama yang lama belum ditolak.
      operationId: hapusProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
        - in: query
          name: konfirmasi
          required: false
          schema:
            type: string
            enum: [hapus]
          description: Wajib diisi hapus untuk proyek yang sudah disetujui atau berjalan
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  dihapus:
                    type: string
                    example: 6aa3f4f514984a96f23147dd
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Proyek kerja ini bukan milik pemegang token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Proyek sudah disetujui atau berjalan tetapi konfirmasi=hapus tidak disertakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    get:
      tags:
        - proyekkerja
      summary: Detail proyek kerja beserta tinjauannya
      description: Dosen dan admin boleh melihat proyek mana pun; mahasiswa hanya proyek miliknya sendiri, dibuktikan nomor WhatsApp yang tercatat saat pengajuan. Field nilai_akhir hanya muncul kalau tinjauan akhir dari kedua penilai sudah masuk.
      operationId: detailProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyek:
                    $ref: '#/components/schemas/ProyekKerja'
                  tinjauan:
                    type: array
                    items:
                      $ref: '#/components/schemas/TinjauanProyekKerja'
                  nilai_akhir:
                    type: number
                    format: double
                    example: 85.5
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Proyek kerja ini bukan milik pemegang token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/{id}/putusan:
    post:
      tags:
        - proyekkerja
      summary: Putusan dosen atas pengajuan
      description: Menyetujui atau menolak pengajuan. Dinamai putusan, bukan setuju, karena endpoint ini juga dipakai menolak. Penolakan wajib disertai catatan alasan, dan putusan hanya berlaku untuk pengajuan yang masih berstatus diajukan.
      operationId: putusanProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutusanProyekKerjaRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekKerja'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, email kampus dosen belum diisi, atau bukan pengampu/kaprodi prodi kalender itu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Pengajuan sudah diputuskan sebelumnya, atau penolakan tanpa catatan alasan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/{id}/tinjauan:
    post:
      tags:
        - proyekkerja
      summary: Kirim tinjauan tengah atau akhir
      description: Menyimpan tinjauan dosen lalu memperbarui status proyek dari kelengkapan tinjauannya - status hanya naik kalau kedua pihak (dosen dan atasan) sudah menilai pada titik waktu itu. Satu peran hanya punya satu tinjauan per jenis, mengirim ulang berarti memperbarui. Jalur atasan lewat tautan sekali pakai belum tersedia.
      operationId: tinjauanProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TinjauanProyekKerjaRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyek:
                    $ref: '#/components/schemas/ProyekKerja'
                  tinjauan:
                    $ref: '#/components/schemas/TinjauanProyekKerja'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Jenis/peran/skor tidak sah, atau proyek berstatus belum disetujui atau sudah selesai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dasbor/beban-belajar/{nim}:
    get:
      tags:
        - dasbor
      summary: Beban belajar minggu berjalan seorang mahasiswa
      description: >-
        Menjumlahkan menit instruksional seluruh sesi kalender pada minggu yang
        sedang berjalan, lalu mengubahnya jadi SKS dengan dasar 85 menit
        terjadwal-terbukti per SKS per minggu (SN-Dikti 170 menit, separuhnya
        terjadwal - lihat dokumen kurikulum). Menit diambil dari ritme mingguan,
        bukan selisih jam kalender, karena jam kotor memuat jeda ibadah & makan
        yang tidak dihitung sebagai beban belajar.


        Prodi, angkatan, dan semester mahasiswa dibaca dari koleksi `mahasiswa`.
        Hanya kalender yang sudah diterbitkan yang dipakai. Dosen/admin boleh
        melihat siapa pun; mahasiswa hanya dirinya sendiri (kepemilikan NIM
        dibuktikan dari nomor WhatsApp di token lewat roster).
      operationId: bebanBelajarMahasiswa
      parameters:
        - name: nim
          in: path
          required: true
          schema:
            type: string
          example: "2026001"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BebanMingguan'
        '401':
          description: Token tidak valid atau tidak dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Mahasiswa mencoba melihat beban belajar orang lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: NIM tidak ada di roster mahasiswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kalender semester belum terbit, atau tanggal hari ini di luar rentang kalender
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kuisgerbang:
    get:
      tags:
        - kuisgerbang
      summary: Daftar kuis beserta kunci jawaban (dosen, prodi tempat ia mengajar)
      description: >-
        Untuk menyusun dan menyunting kuis. Berbeda dari jalur mahasiswa, balasan
        ini memuat `indeks_benar` dan jumlah mahasiswa yang sudah mengerjakan.
      operationId: daftarKuisGerbang
      parameters:
        - {in: query, name: prodi, required: false, schema: {type: string}, example: pai}
        - {in: query, name: rumpun, required: false, schema: {type: string}, example: R1}
      responses:
        '200':
          description: Daftar kuis, urut prodi, rumpun, minggu
          content:
            application/json:
              schema:
                type: object
                properties:
                  kuis:
                    type: array
                    items:
                      $ref: '#/components/schemas/KuisGerbangSunting'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    post:
      tags:
        - kuisgerbang
      summary: Buat atau ganti kuis satu prodi + rumpun + minggu (dosen/kaprodi untuk prodi tempat ia mengajar)
      description: >-
        Satu kuis per prodi + rumpun + minggu; mengirim kunci yang sama mengganti
        kuisnya. 1-50 soal, tiap soal 2-6 pilihan, `indeks_benar` (mulai 0) wajib
        menunjuk salah satu pilihan, ambang 0-100 (0 = bawaan 60). Rumpun harus ada
        di kurikulum prodi itu. Kuis yang sudah dikerjakan mahasiswa tidak bisa
        diganti (422), karena skor tercatat dihitung dari soal lama.
      operationId: simpanKuisGerbang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KuisGerbangSunting'
      responses:
        '200':
          description: Kuis tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KuisGerbangSunting'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Susunan kuis tidak sah, rumpun tidak ada di prodi itu, atau kuis sudah dikerjakan mahasiswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kuisgerbang/{id}:
    delete:
      tags:
        - kuisgerbang
      summary: Hapus kuis (dosen/kaprodi untuk prodinya)
      description: >-
        Kuis yang sudah dikerjakan butuh `?konfirmasi=hapus`. Jawaban mahasiswa
        tidak ikut dihapus supaya riwayat skor tetap bisa diaudit.
      operationId: hapusKuisGerbang
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: ObjectID kuis}
        - {in: query, name: konfirmasi, required: false, schema: {type: string, enum: [hapus]}}
      responses:
        '200':
          description: Terhapus
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kuis tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kuis sudah dikerjakan dan belum dikonfirmasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kuisgerbang/{id}/submit:
    post:
      tags:
        - kuisgerbang
      summary: Submit jawaban kuis
      description: >-
        Backend yang menghitung skor dan lulus. NIM diambil dari roster `mahasiswa`
        lewat nomor WhatsApp pada token, bukan dari body. Mengirim ulang memperbarui
        baris yang sama. Kuis milik prodi lain ditolak 403.
      operationId: submitKuisGerbang
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID kuis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jawaban_idx:
                  type: array
                  description: Indeks pilihan (mulai 0) per soal, urutan sama dengan `soal`
                  items:
                    type: integer
                  example: [0, 1, 1, 1]
      responses:
        '200':
          description: Jawaban dinilai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JawabanKuis'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Kuis milik prodi lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kuis tidak ada, atau nomor pada token belum terdaftar di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Jumlah jawaban tidak sama dengan jumlah soal, atau ada indeks di luar pilihan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kuisgerbang/{rumpun}/{minggu}:
    get:
      tags:
        - kuisgerbang
      summary: Ambil soal kuis
      description: >-
        Balasannya tidak pernah memuat `indeks_benar`. Mahasiswa mendapat kuis
        prodinya dari roster (query prodi diabaikan); dosen/admin wajib menyebut
        prodi lewat query.
      operationId: soalKuisGerbang
      parameters:
        - {in: query, name: prodi, required: false, schema: {type: string}, description: Wajib untuk dosen/admin}
        - in: path
          name: rumpun
          schema:
            type: string
          required: true
        - in: path
          name: minggu
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Soal tanpa kunci jawaban
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KuisGerbang'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Belum ada kuis untuk prodi, rumpun, dan minggu itu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Minggu bukan angka yang sah, atau dosen tidak menyebut prodi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /mahasiswa/{nim}/kuisgerbang/status:
    get:
      tags:
        - kuisgerbang
      summary: Status kuis seorang mahasiswa
      description: >-
        Dosen cek siapa yang belum lulus sebelum sesi Jumat; mahasiswa hanya dirinya
        sendiri.
      operationId: statusKuisMahasiswa
      parameters:
        - in: path
          name: nim
          schema:
            type: string
          required: true
      responses:
        '200':
