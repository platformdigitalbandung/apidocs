        '401':
          description: Token kosong, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Pemegang token bukan kaprodi prodi kalender itu (admin dan dosen biasa termasuk)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kalender tidak ditemukan
