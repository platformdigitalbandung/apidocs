openapi: 3.0.3
info:
  title: Dokumen API Platform
  description: >-
    Penjelasan tata cara pemakaian API dari Whatsauth.


    Catatan: dua route websocket di backend (`/ws/whatsauth/public` untuk QR auth,
    `/ws/chatgpl/public` untuk chatGPL) tidak didokumentasikan di sini karena
    OpenAPI 3.0 tidak punya skema native untuk websocket.
  termsOfService: https://wa.my.id
  contact:
    email: awangga@gmail.com
  license:
    name: Buat dulu webhook untuk menerima dan mengirim pesan
    url: https://github.com/whatsauth/webhook
  version: 1.1.0
externalDocs:
  description: Pendaftaran Token Whatsauth
  url: https://wa.my.id
servers:
  - url: https://apk.fly.dev/api
tags:
  - name: botregister
    description: Pendaftaran nomor bot WhatsApp atau refresh token, disertai URL dan Secret WebHook. Bukan pendaftaran pengguna aplikasi - identitas orang datang dari WhatsAuth.
    externalDocs:
      description: Contoh Kode WebHook
      url: https://github.com/whatsauth/webhook
  - name: kalender
    description: Kalender akademik per prodi/angkatan/semester, diturunkan dari ritme mingguan kurikulum. Baca untuk semua pengguna terdaftar, hanya kalender yang sudah diterbitkan. Buat, sunting, terbitkan, dan hapus hanya kaprodi prodi kalender itu (keputusan pemilik produk 2026-09-14) - admin dan dosen biasa ditolak 403.
  - name: proyekkerja
    description: Modul Proyek Kerja/Magang - proyek semester-panjang di tempat kerja mahasiswa, disetujui dosen lalu ditinjau dua pihak (dosen dan atasan) pada tengah dan akhir semester.
  - name: kuisgerbang
    description: >-
      Kuis atas materi asinkron yang wajib ditempuh mahasiswa sebelum sesi tatap muka.
      Modul ini tidak menahan akses ke sesi - ia menyediakan status lulus untuk dicek
      modul lain. Kunci jawaban tidak pernah dikirim ke client sebelum submit.
  - name: sesiujian
    description: >-
      Asesmen berpengawas - jadwal ujian di kampus beserta pencatatan kehadirannya.
      Bukan proctoring otomatis. Skor ujiannya diinput dosen lewat Modul Blok/Proyek.
  - name: materi
    description: >-
      Katalog materi asinkron (video YouTube, bacaan, atau berkas PDF) per minggu
      rumpun. Progres materi wajib menunjuk materi di katalog ini. Bacaan disimpan
      sebagai teks, bukan tautan luar, supaya gulirnya bisa dilacak; berkas PDF
      disimpan di repo storage GitHub privat dan dibaca di dalam platform supaya
      halamannya bisa dilacak.
  - name: progresmateri
    description: >-
      Pelacakan konsumsi materi asinkron - seberapa jauh mahasiswa menyelesaikan
      video, bacaan, atau berkas PDF per minggu rumpun, dikirim berkala oleh
      player web. persen_selesai yang tersimpan tidak pernah turun, begitu juga
      halaman_terakhir. Tanpa perintah WhatsApp.
  - name: rpl
    description: >-
      Rekognisi Pembelajaran Lampau - pengakuan pengalaman kerja SEBELUM masuk kuliah
      jadi kredit satu rumpun. Beda dari Proyek Kerja/Magang yang untuk proyek selama
      kuliah berjalan.
  - name: akademik
    description: Roster mahasiswa - sumber identitas akademik bersama yang dipakai modul dasbor, blok/proyek, dan proyek kerja. Diisi pengelola prodi, bukan pendaftaran mandiri.
  - name: device
    description: Set whatsapp yg digunakan
    externalDocs:
      description: Tata cara input kode
      url: https://faq.whatsapp.com/1324084875126592
  - name: message
    description: Mengirim pesan ke tujuan
    externalDocs:
      description: Contoh Kode Program
      url: https://github.com/whatsauth/webhook/blob/09c999be72e25660395f27c879456938a57561d1/function.go#L36C9-L36C9
  - name: whatsauth
    description: Get Token and Authorize
  - name: version
    description: Cek status dan commit deployan yang sedang berjalan
  - name: tugas
    description: Portal Tugas - pengumpulan tugas mahasiswa dan laporan kemiripan
  - name: kurikulum
    description: Data referensi kurikulum - prodi, rumpun, CPL, ritme mingguan
  - name: dasbor
    description: Dasbor mahasiswa - beban belajar mingguan dan pelacakan capaian pembelajaran (CPL)
  - name: autograder
    description: Hasil autograder kode dari GitHub Actions - webhook workflow_run bertanda tangan HMAC, artefak diambil backend sendiri
  - name: rekaman
    description: Rekaman sesi daring sinkron (YouTube) dengan tenggat tengah malam setelah sesi dan rekap keterlambatan untuk kaprodi
  - name: rapor
    description: Rapor per semester dan rekap nilai dari penilaian blok/proyek - skala huruf A-E, IP/IPK dari mata kuliah yang sudah dinilai
  - name: beranda
    description: Agenda beranda per peran - hal yang belum dikerjakan dan yang akan datang untuk admin, kaprodi, dosen, dan mahasiswa
  - name: jabatan
    description: Jabatan pimpinan - daftar dosen untuk penetapan kaprodi oleh super admin
  - name: forum
    description: Forum asinkron per rumpun per minggu dengan SLA respons dosen 1x24 jam yang hanya berjalan Senin-Rabu WIB
  - name: kepatuhan
    description: Laporan kepatuhan per mata kuliah untuk akreditasi - menit asinkron, daring sinkron, dan opsional luring/daring terhadap tuntutan SKS, beserta bukti penilaian dan CPL
  - name: proyekblok
    description: Modul Blok/Proyek - instance proyek per rumpun kurikulum dan penilaian per mahasiswa per mata kuliah
paths:
  /health:
    # Rute ini ada di AKAR, bukan di bawah /api - server default dokumen ini
    # berakhiran /api, jadi path item ini menimpanya. Tanpa override, pembaca
    # dokumen akan memanggil https://apk.fly.dev/api/health yang menjawab 404.
    servers:
      - url: https://apk.fly.dev
        description: Produksi (akar, di luar prefix /api)
    get:
      tags:
        - tugas
      summary: Health check Portal Tugas
      description: >-
        Mengembalikan status service dan jumlah tugas yang tersimpan.
        Alamat lengkapnya `https://apk.fly.dev/health` - TANPA prefix `/api`.
      operationId: healthTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  n_tugas:
                    type: integer
                    example: 3
  /tugas:
    get:
      tags:
        - tugas
      summary: Daftar tugas
      description: >-
        Hanya pengguna terdaftar (dosen/admin atau mahasiswa di roster). Mahasiswa hanya menerima
        tugas prodinya di roster (sejak 2026-09-15; query prodi diabaikan, tugas lama tanpa prodi tidak
        ikut) dan tiap tugas membawa sudah_kirim dan kirim_terakhir miliknya sendiri. Dosen, kaprodi,
        dan admin menerima semua tugas, bisa disaring dengan query prodi.
      operationId: daftarTugas
      security:
        - dosenToken: []
      parameters:
        - in: query
          name: prodi
          schema:
            type: string
          required: false
          description: Kode prodi untuk menyaring daftar (hanya berlaku untuk dosen/kaprodi/admin)
      responses:
        '401':
          description: Tanpa token, token tidak valid/kedaluwarsa, atau draft=1 diminta tanpa token dosen yang sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor pada token belum terdaftar sebagai dosen, admin, atau mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tugas:
                    type: array
                    items:
                      $ref: '#/components/schemas/TugasRingkas'
    post:
      tags:
        - tugas
      summary: Buat tugas baru
      description: >-
        Tugas wajib milik satu prodi. Hanya dosen pengampu prodi itu (dicentang kaprodi) atau kaprodinya
        yang bisa membuatnya (keputusan pemilik produk 2026-09-15); admin tidak punya hak lintas prodi.
      operationId: buatTugas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatTugasRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 66f0a1b2c3d4e5f678901234
                  judul:
                    type: string
                    example: Tugas Besar Basis Data
                  prodi_kode:
                    type: string
                    example: trpl
        '401':
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau bukan pengampu/kaprodi prodi tugas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal (judul/deskripsi tidak sesuai, prodi kosong atau tidak ada di kurikulum)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /tugas/{id}:
    get:
      tags:
        - tugas
      summary: Detail tugas
      description: >-
        Hanya pengguna terdaftar (dosen/admin atau mahasiswa di roster). Untuk mahasiswa, tugas prodi
        lain atau tugas lama tanpa prodi dijawab 404.
      operationId: detailTugas
      security:
        - dosenToken: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor pada token belum terdaftar sebagai dosen, admin, atau mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  judul:
                    type: string
                  deskripsi:
                    type: string
                  prodi_kode:
                    type: string
        '404':
          description: Tugas tidak ditemukan (untuk mahasiswa juga tugas prodi lain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/kirim:
    post:
      tags:
        - tugas
      summary: Kumpulkan berkas tugas
      description: Hanya mahasiswa di roster. Nama dan NIM kiriman diambil dari roster lewat nomor WhatsApp di token, bukan dari isian form. Body berupa multipart/form-data berisi berkas.
      operationId: kirimTugas
      security:
        - dosenToken: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                berkas:
                  type: string
                  format: binary
              required:
                - berkas
      responses:
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Pemegang token bukan mahasiswa di roster (termasuk dosen/admin), atau tugas bukan untuk prodinya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  kiriman_id:
                    type: string
                  n_kata:
                    type: integer
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Berkas tidak ada atau gagal diekstrak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/laporan:
    get:
      tags:
        - tugas
      summary: Laporan kemiripan tugas
      description: Hanya dosen yang sudah login yang bisa mengakses laporan kemiripan antar kiriman
      operationId: laporanTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKemiripan'
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dosen/ping:
    get:
      tags:
        - tugas
      summary: Cek validitas token dosen
      operationId: pingDosen
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  user:
                    type: string
                    example: dosen
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kurikulum/prodi:
    get:
      tags:
        - kurikulum
      summary: Daftar program studi
      description: Hanya pengguna terdaftar (dosen/admin atau mahasiswa di roster).
      operationId: daftarProdi
      security:
        - dosenToken: []
      responses:
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor pada token belum terdaftar sebagai dosen, admin, atau mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  prodi:
                    type: array
                    items:
                      type: object
    post:
      tags:
        - kurikulum
      summary: Tambah atau perbarui program studi (kaprodi prodi itu; prodi baru hanya admin)
      description: >-
        Membuat program studi baru bisa dilakukan tanpa ubah kode - sebelumnya
        satu-satunya sumber data kurikulum adalah seed hardcode di backend.
        Idempoten per kode. Kode prodi jadi kunci di rumpun, cpl, matakuliah,
        mahasiswa, dan kalender_semester, jadi bentuknya dikunci - huruf kecil,
        angka, tanda hubung, 2-20 karakter, diawali huruf, dan sebaiknya tidak
        diubah lagi setelah ada datanya. Hak tulis (2026-09-14): prodi baru hanya
        admin; prodi yang sudah ada hanya kaprodi prodi itu - admin tidak
        mengubahnya.
      operationId: simpanProdi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prodi'
      responses:
        '200':
          description: tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prodi'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan kaprodi prodi yang sudah ada, atau bukan admin yang membuat prodi baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Bentuk data tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kurikulum/prodi/{prodi}/kaprodi:
    put:
      tags:
        - kurikulum
      summary: Menetapkan kaprodi satu prodi (khusus admin)
      description: >-
        Menyimpan email kampus dosen aktif (koleksi dosentugas) sebagai kaprodi
        prodi itu (prodi.kaprodi_email; sejak 2026-09-14 menggantikan NIP). Email
        kosong mengosongkan jabatannya. Dosen harus sudah mengisi email kampusnya.
        Kaprodi hanya
        membuka laporan tingkat prodi untuk prodinya sendiri. Menyimpan ulang
        data prodi lewat POST /kurikulum/prodi tidak mengubah kaprodi. Admin
        dikenali dari peran admin di token atau jabatan admin di data dosen.
      operationId: tetapkanKaprodi
      parameters:
        - {name: prodi, in: path, required: true, schema: {type: string}, example: trpl}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, description: Email kampus dosen aktif; kosong untuk mengosongkan, example: "dosen@digitalbdg.ac.id"}
      responses:
        '200':
          description: prodi setelah kaprodi ditetapkan
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Prodi tidak ada, atau email bukan milik dosen aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kurikulum/prodi/{prodi}/rumpun:
    get:
      tags:
        - kurikulum
      summary: Daftar rumpun matakuliah suatu prodi
      description: Hanya pengguna terdaftar (dosen/admin atau mahasiswa di roster).
      operationId: daftarRumpun
      security:
        - dosenToken: []
      parameters:
        - in: path
          name: prodi
          schema:
            type: string
          required: true
          description: Kode/slug program studi
      responses:
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor pada token belum terdaftar sebagai dosen, admin, atau mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  rumpun:
                    type: array
                    items:
                      type: object
    post:
      tags:
        - kurikulum
      summary: Tambah atau perbarui rumpun mata kuliah (kaprodi prodi itu)
      description: >-
        prodi_kode diambil dari path, bukan body. Mata kuliah TIDAK punya rute
        sendiri - koleksi matakuliah diturunkan dari daftar mata_kuliah rumpun
        ini saat disimpan, aturan yang sama dengan jalur seed, supaya tidak ada
        dua daftar yang bisa berbeda diam-diam. Idempoten per prodi+kode.
        sks rumpun wajib sama dengan jumlah SKS mata kuliahnya (422, tidak ada
        yang disimpan). Penulisan mata kuliah yang salah tetap menyimpan
        rumpunnya tanpa membentuk mata kuliah (422). Mata kuliah yang dihapus
        atau diganti nama dari daftar ikut dihapus dari koleksi matakuliah
        (matakuliah_dihapus); kalau sudah punya nilai proyek blok, ditolak 422.
      operationId: simpanRumpun
      parameters:
        - in: path
          name: prodi
          schema:
            type: string
          required: true
          description: Kode/slug program studi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rumpun'
      responses:
        '200':
          description: tersimpan beserta mata kuliah yang diturunkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  rumpun:
                    $ref: '#/components/schemas/Rumpun'
                  matakuliah:
                    type: array
                    items:
                      $ref: '#/components/schemas/MataKuliah'
                  matakuliah_dihapus:
                    type: array
                    items: {type: string}
                    description: Kode mata kuliah yang dilepas dari rumpun ini dan dihapus
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan kaprodi prodi ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Prodi belum ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Bentuk data tidak valid, penulisan mata kuliah salah (rumpun tetap tersimpan), SKS rumpun tidak sama jumlah SKS mata kuliah, atau mata kuliah yang dilepas sudah punya nilai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kurikulum/prodi/{prodi}/cpl:
    get:
      tags:
        - kurikulum
      summary: Daftar CPL suatu prodi
      description: Hanya pengguna terdaftar (dosen/admin atau mahasiswa di roster). Termasuk penguatan_usulan dan penopang_lain.
      operationId: daftarCPL
      security:
        - dosenToken: []
      parameters:
        - {in: path, name: prodi, required: true, schema: {type: string}, description: Kode/slug program studi}
      responses:
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor pada token belum terdaftar sebagai dosen, admin, atau mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpl:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapaianPembelajaran'
    post:
      tags:
        - kurikulum
      summary: Tambah atau perbarui capaian pembelajaran (kaprodi prodi itu)
      description: >-
        prodi_kode diambil dari path. Idempoten per prodi+kode. Selama sebuah
        prodi belum punya CPL sama sekali, dasbor CPL mahasiswanya menjawab 422
        dengan sebabnya - bukan 0 tercapai.
        penguatan_usulan dan penopang_lain yang tidak dikirim diambil dari CPL
        yang sudah ada (formulir web tidak punya isiannya); kirim [] untuk
        mengosongkannya.
      operationId: simpanCPL
      parameters:
        - in: path
          name: prodi
          schema:
            type: string
          required: true
          description: Kode/slug program studi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapaianPembelajaran'
      responses:
        '200':
          description: tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapaianPembelajaran'
