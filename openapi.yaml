  /rpl:
    get:
      tags:
        - rpl
      summary: Daftar pengajuan RPL untuk peninjau
      description: >-
        Pengajuan lintas mahasiswa, terbaru dulu. Ditambahkan di luar tiga rute
        rencana modul karena tanpa ini dosen tidak punya cara menemukan
        pengajuan yang menunggu tinjauan - rute lain hanya per NIM. Saringan
        status yang tidak dikenal ditolak 422, bukan dianggap "semua", supaya
        salah ketik tidak mengembalikan seluruh pengajuan seolah berstatus yang
        diminta.
      operationId: daftarRPL
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [diajukan, ditinjau, disetujui, ditolak]
          required: false
          description: Kosong berarti semua status
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  rpl:
                    type: array
                    items:
                      $ref: '#/components/schemas/PengajuanRPL'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen atau admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Saringan status tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    post:
      tags:
        - rpl
      summary: Ajukan RPL + unggah bukti
      description: >-
        Multipart/form-data. NIM diambil server dari roster `mahasiswa` lewat nomor
        WhatsApp pada token, bukan dari body. Status awal selalu `diajukan`. Berkas
        bukti opsional; kegagalan unggah tidak membatalkan pengajuannya.
      operationId: ajukanRPL
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - rumpun_target
                - deskripsi
              properties:
                rumpun_target:
                  type: string
                  description: Kode rumpun yang mau dikonversi
                  example: R11
                deskripsi:
                  type: string
                  example: 3 tahun sebagai backend engineer di PT Contoh
                bukti:
                  type: array
                  description: Portofolio, sertifikat, referensi kerja
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Pengajuan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengajuanRPL'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Nomor pada token belum terdaftar di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: rumpun_target atau deskripsi kosong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /rpl/{id}/tinjau:
    post:
      tags:
        - rpl
      summary: Setuju/tolak pengajuan RPL
      description: >-
        Hanya dosen atau admin. `status` harus salah satu dari `ditinjau`,
        `disetujui`, `ditolak` - `diajukan` tidak bisa dipilih peninjau karena itu
        status yang diberikan sistem saat pengajuan dibuat.
      operationId: tinjauRPL
      parameters:
        - in: path
          description: Id pengajuan RPL (ObjectID) dari `GET /rpl`.
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ditinjau
                    - disetujui
                    - ditolak
                catatan:
                  type: string
                  example: Pengalaman relevan, disetujui penuh
      responses:
        '200':
          description: Putusan tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengajuanRPL'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen maupun admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Pengajuan RPL tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Status tidak bisa dipilih peninjau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /materi:
    get:
      tags:
        - materi
      summary: Daftar katalog materi
      description: >-
        Diurutkan minggu, urutan, lalu judul. Butuh token WhatsAuth apa pun -
        video unlisted tidak boleh terbuka untuk publik.
        Mahasiswa hanya melihat materi PRODINYA SENDIRI - query `prodi` yang
        dikirim diabaikan untuk mereka, pola yang sama dengan `nim` pada daftar
        autograder. Dosen dan admin melihat seluruh prodi dan boleh menyaring
        lewat query.
      operationId: daftarMateri
      parameters:
        - in: query
          description: Saring per kode program studi, mis. `trpl` (mahasiswa otomatis prodi rosternya).
          name: prodi
          schema:
            type: string
          required: false
          example: trpl
        - in: query
          description: Kode rumpun (blok mata kuliah), mis. `R1`; daftar dari `GET /kurikulum/prodi/{prodi}/rumpun`.
          name: rumpun
          schema:
            type: string
          required: false
          example: R1
        - in: query
          name: minggu
          schema:
            type: integer
          required: false
          description: Kosong atau 0 berarti semua minggu
          example: 3
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  materi:
                    type: array
                    items:
                      $ref: '#/components/schemas/Materi'
        '403':
          description: Bukan dosen, admin, maupun mahasiswa di roster - tanpa prodi tidak ada batas yang bisa dipakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Query minggu bukan angka tidak negatif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    post:
      tags:
        - materi
      summary: Tambah materi ke katalog (pengajar kelas rumpun/mata kuliah itu / kaprodinya)
      description: >-
        youtube_id boleh diisi ID 11 karakter atau tautan YouTube apa pun
        (watch, youtu.be, embed, shorts, live) - server mengurainya. Bacaan
        wajib punya isi teks. Jenis berkas dibuat lebih dulu di sini untuk
        mendapat id, berkas PDF-nya menyusul lewat POST /materi/{id}/berkas -
        jadi materi berkas yang baru dibuat belum punya berkas. Field milik
        jenis lain dikosongkan server. Sejak 2026-09-25 hanya pengajar kelas
        rumpun itu (kelas mata kuliah lepas: hanya mata kuliahnya, lewat
        `mk_kode`) atau kaprodinya; `mk_kode` harus mata kuliah rumpun itu.
      operationId: buatMateri
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MateriRequest'
      responses:
        '201':
          description: Materi tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materi'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: >-
            Validasi gagal - field wajib kosong, minggu di luar 1-52, jenis tak
            dikenal, youtube_id bukan video YouTube yang sah, isi bacaan kosong,
            atau rumpun tidak ada pada prodi itu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /materi/{id}:
    put:
      tags:
        - materi
      summary: Perbarui satu materi (pengajar kelas rumpun/mata kuliah materi itu / kaprodinya)
      description: >-
        Mengganti seluruh isi materi; pembuat aslinya dipertahankan. Berkas PDF
        yang sudah diunggah ikut terbawa selama jenisnya tetap `berkas` - body
        pembaruan tidak memuatnya - dan dilepas kalau jenisnya diganti ke
        video/bacaan.
      operationId: perbaruiMateri
      parameters:
        - name: id
          description: Id materi (ObjectID) dari `GET /materi`.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MateriRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materi'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Materi tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    delete:
      tags:
        - materi
      summary: Hapus satu materi
      description: >-
        Tidak berantai: catatan progres yang menunjuk materi ini TIDAK ikut
        terhapus - itu bukti mahasiswa pernah belajar - tapi kehilangan judul
        materinya. Karena itu materi yang sudah punya progres ditolak 422
        sampai diulang dengan konfirmasi=hapus.
      operationId: hapusMateri
      parameters:
        - name: id
          description: Id materi (ObjectID) dari `GET /materi`.
          in: path
          required: true
          schema:
            type: string
        - in: query
          description: Nilai konfirmasi sesuai enum; wajib bila dokumen sudah dipakai atau sudah terbit, tanpa itu dijawab 422.
          name: konfirmasi
          schema:
            type: string
            enum: [hapus]
          required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  dihapus:
                    type: string
                  progres_tertinggal:
                    type: integer
                    description: Jumlah catatan progres yang kini kehilangan judul materinya
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Materi tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Materi sudah punya progres dan konfirmasi=hapus belum diberikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /materi/{id}/berkas:
    post:
      tags:
        - materi
      summary: Unggah berkas PDF ke satu materi
      description: >-
        Multipart/form-data: berkas PDF pada field `berkas`. Jumlah halaman
        (penyebut progres) DIHITUNG SERVER dari berkasnya sejak 2026-09-14;
        field `halaman` kiriman peramban dosen hanya dipakai kalau server gagal
        mengurai PDF-nya. Hanya admin, atau dosen/kaprodi untuk prodi materi
        itu (prodi tempat ia mengajar). Hanya PDF,
        diperiksa dari magic bytes `%PDF-` dan bukan dari nama berkasnya, dan
        maksimal 20 MiB. Berkasnya naik ke repo storage GitHub privat lewat
        GHPAT; yang masuk basis data hanya referensi repo/path/sha
        (pdb/README.md poin 8), dan nama berkas dari dosen disanitasi dulu
        sebelum dipakai jadi bagian path. Materinya sekaligus disetel berjenis
        `berkas`.
      operationId: unggahBerkasMateri
      parameters:
        - name: id
          description: Id materi (ObjectID) dari `GET /materi`.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - berkas
              properties:
                berkas:
                  type: string
                  format: binary
                  description: Berkas PDF, maksimal 20 MiB
                halaman:
                  type: integer
                  minimum: 1
                  description: >-
                    Opsional. Jumlah halaman hitungan peramban dosen, dipakai
                    hanya kalau server tidak bisa menghitung dari berkasnya.
                    Boleh juga dikirim sebagai query string.
                  example: 24
      responses:
