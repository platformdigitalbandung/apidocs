        tersimpan tapi tidak bisa lagi diterjemahkan jadi nama, prodi, atau
        nomor WhatsApp. Karena itu NIM yang masih dirujuk ditolak 422 sampai
        diulang dengan konfirmasi=hapus. Untuk mahasiswa yang lulus atau
        berhenti, yang benar adalah mengubah status lewat POST /mahasiswa,
        bukan menghapus barisnya.
