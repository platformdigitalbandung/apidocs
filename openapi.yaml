                      $ref: '#/components/schemas/PenggunaDosen'
                  admin:
                    type: boolean
                  lingkup:
                    type: array
                    description: Kode prodi yang dipimpin pemanggil sebagai kaprodi
                    items:
                      type: string
        '401':
          description: Token tidak sah
          content:
