        '403':
          description: Pemegang token bukan dosen (dan bukan admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Body JSON tidak valid atau validasi gagal - mis. rumpun_kode tidak ada di data kurikulum prodi itu, judul kosong, status di luar draft/berjalan/selesai, selesai_minggu lebih awal dari mulai_minggu, atau ada nim anggota yang terdaftar dua kali
