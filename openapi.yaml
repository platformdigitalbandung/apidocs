          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /autograder/bobot:
    get:
      tags:
        - autograder
      summary: Pembagian bobot di dalam komponen autograder
      description: >-
        Boleh dibaca siapa pun yang login - mahasiswa berhak tahu dari mana
