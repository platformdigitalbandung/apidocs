            dari 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '502':
          description: Gagal mengunggah ke repo storage GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    get:
      tags:
