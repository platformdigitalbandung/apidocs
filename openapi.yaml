        dengan yang dikirim WebSocket WhatsAuth). OTP diterbitkan bot hanya saat
        pesan WhatsAuth masuk tetapi halaman login sudah tidak tersambung ke room
        QR-nya; berlaku 5 menit (indeks TTL koleksi `otplogin`), sekali pakai,
        dan dicabut setelah 5 percobaan salah. Nomor boleh berawalan 0, 62, atau
        +62. Dipakai tombol **Masuk dengan OTP** di halaman login.
      operationId: masukOTP
