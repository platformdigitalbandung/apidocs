  /beranda/agenda:
    get:
      tags:
        - beranda
      summary: Agenda beranda per peran (mahasiswa, dosen, kaprodi, admin)
      description: >-
        Hal yang belum dikerjakan (`sifat: perlu`) dan yang akan datang
        (`sifat: akan`) untuk setiap peran yang dipegang pemilik token. Peran dicek
        dari database, bukan dari pemilih peran di peramban: bagian yang tidak
        dipegang selalu array kosong dan tidak disebut di `peran`. Bagian yang
        disebut di `peran` tapi kosong berarti semuanya beres. Dihitung saat
        diminta dari koleksi modul lain; butir yang gagal dihitung dilewati
        (dicatat di log server) tanpa menggagalkan agenda.

        Jenis butir per peran:
        mahasiswa - kalender_belum_terbit (akan; kalender prodi, angkatan,
        dan semesternya belum terbit, jadi agenda mingguan belum dihitung),
        materi_belum_selesai, kuis_belum_lulus (minggu berjalan kalender
        terbit), proyek_kerja_menunggu, rpl_menunggu;
        dosen - email_belum_diisi, belum_mengajar_kelas (belum ditunjuk
        pengajar kelas mana pun dan bukan kaprodi), forum_belum_dijawab
        (prodi mengajar), proyek_kerja_putusan, proyek_kerja_tinjauan, rpl_menunggu,
        kalender_belum_terbit (akan; prodi mengajar tanpa kalender terbit),
        rekaman_belum_terbit, materi_minggu_depan_kosong,
        kuis_minggu_depan_kosong, ujian_diawasi;
        kaprodi (per prodi yang dipimpin) - kurikulum_belum_lengkap,
        kalender_belum_terbit, kelas_tanpa_pengajar (kelas
        kalender terbit yang belum selesai), proyek_kerja_telat,
        forum_lewat_sla;
        admin - prodi_tanpa_kaprodi, rujukan_nip_lama (kaprodi masih
        memakai data lama karena belum mengisi email kampus),
        dosen_tanpa_email.


        Urutan: setiap bagian sudah diurutkan dan frontend menampilkannya apa
        adanya. Bagian kaprodi mengikuti ketergantungan pekerjaan - kurikulum,
        kalender, pengajar kelas, lalu laporan (proyek kerja, forum) - bukan
        tanda mendesak. Bagian lain: `perlu` dulu, yang mendesak di depan,
        lalu tenggat terdekat.
      operationId: agendaBeranda
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaBeranda'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor belum terdaftar sebagai mahasiswa maupun dosen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
