            type: string
          required: true
          description: Kode/slug program studi
        - in: query
          name: rumpun
          schema:
            type: string
          required: false
          description: Saring per kode rumpun; kosong berarti seluruh prodi
      responses:
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
