  /kepatuhan/prodi/{prodi}/{angkatan}/{semester}:
    get:
      tags:
        - kepatuhan
      summary: Laporan kepatuhan satu kalender semester (kaprodi prodinya / admin)
      description: >-
        Laporan untuk akreditasi dari kalender semester yang SUDAH TERBIT: menit
        per moda per minggu dan per mata kuliah terhadap target SKS x 85 menit
        terjadwal-terbukti per minggu (170 menit SN-Dikti dicantumkan sebagai
        total yang separuhnya belajar mandiri). Menit tiap sesi diambil dari
        ritme mingguan - sumber yang sama dengan dasbor beban belajar - bukan
        dari jam kotor kalender.


        Menit per mata kuliah adalah ALOKASI: sesi kalender tidak menunjuk mata
        kuliah, jadi menit tiap sesi dibagi ke mata kuliah semester itu
        sebanding SKS (sesi yang menyebut rumpun_kode hanya ke mata kuliah
        rumpun itu). Metode ini disebut di `catatan`. Ekspornya JSON + halaman
        web siap cetak (kepatuhan.html), tanpa berkas.
      operationId: laporanKepatuhanSemester
      parameters:
        - name: prodi
          description: Kode program studi (huruf kecil), mis. `trpl`, `bisdig`, `pai`, `hes`. Daftar yang berlaku dari `GET /kurikulum/prodi`.
          in: path
          required: true
          schema:
            type: string
          example: trpl
        - name: angkatan
          description: Tahun angkatan, mis. `2026`.
          in: path
          required: true
          schema:
            type: string
          example: "2026"
        - name: semester
          description: Nomor semester 1–8.
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKepatuhan'
        '401':
          description: >-
            Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan kaprodi prodi ini atau admin. Laporan tingkat prodi hanya untuk kaprodi (prodinya sendiri) dan admin (semua prodi); dosen biasa ditolak
            Bukan dosen atau admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >-
            Prodi tidak ada di data kurikulum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: >-
            Datanya belum lengkap - belum ada kalender terbit untuk kombinasi itu,
            belum ada mata kuliah semester itu, ritme mingguan belum di-seed, atau
            semester bukan angka. Sengaja bukan 200 dengan laporan kosong: "0 menit"
            di borang terbaca seperti fakta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
