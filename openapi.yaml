        sesi_index: {type: integer}
        minggu: {type: integer}
        tanggal: {type: string, format: date-time}
        hari: {type: string}
        tenggat: {type: string, format: date-time}
        status: {type: string, enum: [terbit-tepat, terbit-terlambat, belum-ada, menunggu, belum-berlangsung]}
        rekaman: {$ref: '#/components/schemas/RekamanSesi'}
    DaftarRekamanKalender:
      type: object
      properties:
        kalender_id: {type: string}
        prodi_kode: {type: string}
        angkatan: {type: string}
        semester: {type: integer}
        sesi:
          type: array
          items: {$ref: '#/components/schemas/SesiRekaman'}
    RekapRekaman:
      type: object
      properties:
        sekarang: {type: string, format: date-time}
        kalender:
          type: array
          items:
            type: object
            properties:
              kalender_id: {type: string}
              prodi_kode: {type: string}
              angkatan: {type: string}
              semester: {type: integer}
              jatuh_tempo: {type: integer}
              terbit_tepat: {type: integer}
              terbit_terlambat: {type: integer}
              belum_ada: {type: integer}
              menunggu: {type: integer}
              perlu_perhatian:
                type: array
                items: {$ref: '#/components/schemas/SesiRekaman'}
    SkalaHuruf:
      type: object
      properties:
        huruf: {type: string, example: C}
        minimal: {type: number, example: 60}
        bobot: {type: number, example: 2}
    NilaiRapor:
      type: object
      properties:
        kode_mk: {type: string, example: LITERASI-DIGITAL}
        nama: {type: string}
        sks: {type: integer}
        rumpun_kode: {type: string}
        nilai_akhir: {type: number, example: 83.2}
        huruf: {type: string, example: A}
        bobot: {type: number, example: 4}
        lulus: {type: boolean}
        cpl:
          type: array
          items: {type: string}
    SemesterRapor:
      type: object
      properties:
        semester: {type: integer}
        mata_kuliah:
          type: array
          items: {$ref: '#/components/schemas/NilaiRapor'}
        sks_dinilai: {type: integer}
        sks_lulus: {type: integer}
        ip: {type: number, example: 3.5}
        cpl_tersentuh:
          type: array
          items: {type: string}
          description: CPL rumpun dari mata kuliah yang lulus
    Rapor:
      type: object
      properties:
        nim: {type: string}
        nama: {type: string}
        prodi_kode: {type: string}
        angkatan: {type: string}
        semester_berjalan: {type: integer}
        semester:
          type: array
          items: {$ref: '#/components/schemas/SemesterRapor'}
        sks_dinilai: {type: integer}
        sks_lulus: {type: integer}
        ipk: {type: number}
        rumpun_diakui_rpl:
          type: array
          items: {type: string}
          description: Tanpa nilai angka; tidak masuk IP/IPK
        tidak_terpetakan:
          type: array
          items:
            type: object
            properties:
              kode_mk: {type: string}
              nilai_akhir: {type: number}
              huruf: {type: string}
        skala:
          type: array
          items: {$ref: '#/components/schemas/SkalaHuruf'}
        catatan:
          type: array
          items: {type: string}
    BarisRekapRapor:
      type: object
      properties:
        nim: {type: string}
        nama: {type: string}
        nilai:
          type: object
          additionalProperties: {type: string}
          description: kode_mk -> huruf; mata kuliah yang belum dinilai tidak muncul
          example: {LITERASI-DIGITAL: A, KEWIRAUSAHAAN: B}
        belum_dinilai: {type: integer}
        sks_dinilai: {type: integer}
        sks_lulus: {type: integer}
        ip: {type: number}
    RekapRaporSemester:
      type: object
      properties:
        prodi_kode: {type: string}
        angkatan: {type: string}
        semester: {type: integer}
        mata_kuliah:
          type: array
          items:
            type: object
            properties:
              kode: {type: string}
              nama: {type: string}
              sks: {type: integer}
        mahasiswa:
          type: array
          items: {$ref: '#/components/schemas/BarisRekapRapor'}
        skala:
          type: array
          items: {$ref: '#/components/schemas/SkalaHuruf'}
    ForumUtas:
      type: object
      properties:
        id: {type: string}
        nim: {type: string}
        prodi_kode: {type: string}
        rumpun_kode: {type: string, example: R1}
        minggu: {type: integer, example: 3}
        judul: {type: string}
        isi: {type: string}
        status: {type: string, enum: [terbuka, dijawab, ditutup]}
        dibuat: {type: string, format: date-time}
        tenggat_sla: {type: string, format: date-time}
        dijawab_dosen_pada: {type: string, format: date-time, description: Waktu balasan dosen pertama; tidak ada kalau belum dijawab dosen}
        jumlah_balasan: {type: integer}
        lewat_tenggat: {type: boolean, description: Dihitung saat dibaca}
    ForumBalasan:
      type: object
      properties:
        id: {type: string}
        forum_id: {type: string}
        peran: {type: string, enum: [dosen, mahasiswa]}
        nim: {type: string, description: Hanya untuk peran mahasiswa}
        email: {type: string, description: Email kampus - hanya untuk peran dosen}
        isi: {type: string}
        dibuat: {type: string, format: date-time}
    TanyaForumRequest:
      type: object
      required: [rumpun_kode, minggu, isi]
      properties:
        rumpun_kode: {type: string, example: R1}
        minggu: {type: integer, minimum: 1, maximum: 52, example: 3}
        judul: {type: string, maxLength: 150, description: Opsional; kosong berarti diambil dari awal isi}
        isi: {type: string, maxLength: 4000}
    BalasForumRequest:
      type: object
      required: [isi]
      properties:
        isi: {type: string, maxLength: 4000}
    ForumDetail:
      type: object
      properties:
        utas: {$ref: '#/components/schemas/ForumUtas'}
        balasan:
          type: array
          items: {$ref: '#/components/schemas/ForumBalasan'}
    RingkasanSLAForum:
      type: object
      properties:
        prodi_kode: {type: string}
        sekarang: {type: string, format: date-time}
        sla_jam: {type: integer, example: 24}
        hari_berlaku:
          type: array
          items: {type: string}
          example: [Senin, Selasa, Rabu]
        terbuka: {type: integer}
        menunggu_dalam_sla: {type: integer}
        terbuka_lewat_tenggat:
          type: array
          items: {$ref: '#/components/schemas/ForumUtas'}
        dijawab_tepat: {type: integer}
        dijawab_terlambat: {type: integer}
    ButirAgenda:
      type: object
      required: [jenis, sifat, judul, jumlah, tautan]
      properties:
        jenis: {type: string, description: 'Kunci stabil, mis. kuis_belum_lulus (daftar lengkap di GET /beranda/agenda)'}
        sifat: {type: string, enum: [perlu, akan], description: 'perlu = belum dikerjakan; akan = akan datang'}
        judul: {type: string}
        keterangan: {type: string}
        jumlah: {type: integer, description: 'Jumlah hal yang bisa dikerjakan satu per satu (mis. 3 pertanyaan forum); 0 untuk butir tunggal atau rincian yang bukan hitungan (mis. kekurangan kurikulum)'}
        tautan: {type: string, description: 'Halaman frontend relatif tempat mengerjakannya, mis. kuis.html'}
        prodi_kode: {type: string}
        tenggat: {type: string, format: date-time}
        mendesak: {type: boolean, description: Sudah lewat tenggat atau SLA}
    AgendaBeranda:
      type: object
      properties:
        peran:
          type: array
          items: {type: string, enum: [admin, kaprodi, dosen, mahasiswa]}
          description: Peran yang dipegang (dan dihitung), urut dari tertinggi
        admin: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        kaprodi: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        dosen: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        mahasiswa: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        minggu_berjalan: {type: integer, description: 'Minggu berjalan kalender terbit prodi mahasiswa/prodi mengajar; 0 di luar masa perkuliahan'}
        dihitung: {type: string, format: date-time}
    DosenJabatan:
      type: object
      properties:
        email: {type: string, description: Email kampus; kosong kalau dosen belum mengisinya}
        nama: {type: string}
        jabatan: {type: string, enum: [admin], description: Kosong untuk dosen tanpa jabatan institusi}
        kaprodi_prodi:
          type: array
          items: {type: string}
          description: Kode prodi yang dipimpin sebagai kaprodi
        prodi_kode:
          type: array
          items: {type: string}
          description: Kode prodi tempat dosen mengajar (dosentugas.prodi_kode)
    MenitModa:
      type: object
      description: Menit instruksional menurut moda sesi kalender. Moda yang tidak dikenal dihitung di `lain` supaya `total` utuh.
      properties:
        asinkron:
          type: integer
        daring_sinkron:
          type: integer
        opsional_luring_daring:
          type: integer
        lain:
          type: integer
        total:
          type: integer
    KepatuhanMinggu:
      type: object
      properties:
        minggu:
          type: integer
        tanggal_mulai:
          type: string
          example: "2026-09-07"
        menit:
          $ref: '#/components/schemas/MenitModa'
    KepatuhanMataKuliah:
      type: object
      properties:
        kode:
          type: string
          example: LITERASI-DIGITAL
        nama:
          type: string
        sks:
          type: integer
        rumpun_kode:
          type: string
        menit:
          allOf:
            - $ref: '#/components/schemas/MenitModa'
          description: Total semester hasil ALOKASI sebanding SKS, bukan catatan per mata kuliah
        minggu_aktif:
          type: integer
        menit_per_minggu:
          type: number
        target_menit_per_minggu:
          type: integer
          description: SKS x 85 menit terjadwal-terbukti
        persen_target:
          type: number
        memenuhi:
          type: boolean
        cpl:
          type: array
          items:
            type: string
          description: Dari rumpun mata kuliah ini; kosong kalau prodi belum punya CPL terdaftar
        jumlah_dinilai:
          type: integer
          description: Mahasiswa berbeda yang punya nilai mata kuliah ini di proyek blok angkatan tersebut
        jumlah_lulus:
          type: integer
    LaporanKepatuhan:
      type: object
      properties:
        prodi_kode:
          type: string
        angkatan:
          type: string
        semester:
          type: integer
        kalender_id:
          type: string
        jumlah_minggu:
          type: integer
        menit_per_sks_sndikti:
          type: integer
          example: 170
        menit_per_sks_terjadwal:
          type: integer
          example: 85
        total_sks:
          type: integer
        kapasitas_sks:
          type: number
          example: 16.9
        menit:
          $ref: '#/components/schemas/MenitModa'
        per_minggu:
          type: array
          items:
            $ref: '#/components/schemas/KepatuhanMinggu'
        mata_kuliah:
          type: array
          items:
            $ref: '#/components/schemas/KepatuhanMataKuliah'
        jumlah_memenuhi:
          type: integer
        cpl_terdaftar:
          type: boolean
          description: false kalau prodi belum punya satu pun CPL (mis. Bisnis Digital)
        catatan:
          type: array
          items:
            type: string
    RekapKepatuhanMataKuliah:
      type: object
      properties:
        prodi_kode:
          type: string
        kode:
          type: string
        nama:
          type: string
        sks:
          type: integer
        semester:
          type: integer
        per_angkatan:
          type: array
          items:
            type: object
            properties:
              angkatan:
                type: string
              kalender_id:
                type: string
              jumlah_minggu:
                type: integer
              baris:
                $ref: '#/components/schemas/KepatuhanMataKuliah'
    RingkasanCakupanCPL:
      type: object
      properties:
        prodi_kode:
          type: string
          example: trpl
        nim:
          type: string
          description: Terisi pada cakupan per mahasiswa, kosong pada agregat prodi
          example: "2026001"
        total:
          type: integer
          description: Seluruh CPL prodi ini
          example: 11
        tercapai:
          type: integer
          description: >-
            JANGAN dibaca sebagai "tercapai dari total" - penyebut yang benar
            adalah dapat_dinilai. Sebagian CPL sengaja tidak dipetakan ke rumpun
            mana pun sehingga tidak akan pernah masuk hitungan ini.
          example: 7
        dapat_dinilai:
          type: integer
          description: total dikurangi ditopang_jalur_lain - jumlah CPL yang memang bisa dibuktikan dari nilai proyek blok
          example: 10
        ditopang_jalur_lain:
          type: integer
          description: Jumlah CPL yang tidak dipetakan ke rumpun mana pun (mis. CPL01 TRPL)
          example: 1
        tercapai_hanya_rpl:
          type: integer
          description: >-
            Berapa dari tercapai yang buktinya SEMATA-MATA RPL, tanpa satu pun
            nilai proyek blok. Angka yang perlu dilihat asesor sebelum membaca
            tercapai sebagai capaian yang dinilai di kelas.
          example: 0
        daftar:
          type: array
          items:
            $ref: '#/components/schemas/CakupanCPL'
    ProyekBlok:
      description: Instance proyek nyata di atas satu rumpun kurikulum untuk satu angkatan. Definisi mata kuliah dan CPL-nya tidak diduplikasi ke sini - ambil dari rumpun lewat rumpun_kode.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        rumpun_kode:
          type: string
          description: Kode rumpun kurikulum yang jadi cetak biru blok ini
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_email:
          type: string
          description: Email kampus dosen pembimbing/penilai utama - hanya dia (atau admin) yang boleh menginput nilai
          example: "dosen@digitalbdg.ac.id"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          enum:
            - draft
            - berjalan
            - selesai
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          example: 8
    KuisGerbang:
      description: Kuis gerbang satu prodi + rumpun pada satu minggu. Dalam balasan API untuk mahasiswa, `soal` tidak pernah memuat `indeks_benar`.
      type: object
      properties:
        id:
          type: string
        prodi_kode:
          type: string
          example: pai
        rumpun_kode:
          type: string
          example: R1
        minggu:
          type: integer
          example: 3
        ambang_lulus:
          type: number
          format: double
          description: Persentase, mis. 70
          example: 70
        soal:
          type: array
          items:
            $ref: '#/components/schemas/SoalKuis'
    KuisGerbangSunting:
      description: Bentuk kuis untuk dosen - body penyusunan dan baris daftar. Memuat kunci jawaban; tidak pernah dipakai membalas mahasiswa.
      type: object
      required: [prodi_kode, rumpun_kode, minggu, soal]
      properties:
        id: {type: string, readOnly: true}
        prodi_kode: {type: string, example: pai}
        rumpun_kode: {type: string, example: R1}
        minggu: {type: integer, example: 2}
        ambang_lulus: {type: number, example: 70, description: 0 berarti bawaan 60}
        dibuat_oleh: {type: string, readOnly: true}
        dikerjakan: {type: integer, readOnly: true, description: Jumlah mahasiswa yang sudah mengerjakan}
        soal:
          type: array
          items:
            type: object
            required: [pertanyaan, pilihan, indeks_benar]
            properties:
              pertanyaan: {type: string, example: "Rukun Islam ada berapa?"}
              pilihan: {type: array, items: {type: string}, example: ["4", "5", "6"]}
              indeks_benar: {type: integer, example: 1, description: Mulai 0}
    SoalKuis:
      description: Satu butir pilihan ganda. `indeks_benar` tidak pernah ikut dalam balasan.
      type: object
      properties:
        pertanyaan:
          type: string
          example: Port standar HTTPS?
        pilihan:
          type: array
          items:
            type: string
          example: ["80", "443", "22"]
    StatusJawabanKuis:
      description: >-
        Satu baris riwayat kuis mahasiswa - pengerjaan (JawabanKuis) beserta prodi, rumpun, dan minggu
        kuisnya, dibaca dari kuis saat diminta. Kosong kalau kuisnya sudah dihapus.
      allOf:
        - $ref: '#/components/schemas/JawabanKuis'
        - type: object
          properties:
            prodi_kode:
              type: string
              example: pai
            rumpun_kode:
              type: string
              example: R1
            rumpun_nama:
              type: string
              example: Studi Al-Quran
            minggu:
              type: integer
              example: 3
    JawabanKuis:
      description: Satu pengerjaan oleh satu mahasiswa atas satu kuis, disimpan per (kuis, nim).
      type: object
      properties:
        id:
          type: string
        kuis_id:
          type: string
        nim:
          type: string
          readOnly: true
          description: Diisi server dari roster lewat nomor WhatsApp pada token
          example: "2026001"
        jawaban_idx:
          type: array
          items:
            type: integer
        skor:
          type: number
          format: double
          description: Persentase 0-100, dihitung server
          example: 75
        lulus:
          type: boolean
          example: true
    SesiUjian:
      description: Satu jadwal ujian untuk satu rumpun.
      type: object
      properties:
        id:
          type: string
        rumpun_kode:
          type: string
          example: R1
        jenis:
          type: string
          enum:
            - tengah-blok
            - akhir-blok
          example: akhir-blok
        tanggal_jam:
          type: string
          format: date-time
          example: "2026-11-20T09:00:00+07:00"
        lokasi:
          type: string
          example: Lab 2, Gedung A
        pengawas:
          type: string
          description: Email kampus dosen pengawas (NIP pada data lama yang belum dimigrasi)
          example: "dosen@digitalbdg.ac.id"
    SesiUjianRequest:
      type: object
      required:
        - rumpun_kode
        - jenis
        - tanggal_jam
        - lokasi
        - pengawas
      properties:
        rumpun_kode:
          type: string
          example: R1
        jenis:
          type: string
          enum:
            - tengah-blok
            - akhir-blok
        tanggal_jam:
          type: string
          description: RFC3339 beserta zona waktu
          example: "2026-11-20T09:00:00+07:00"
        lokasi:
          type: string
          example: Lab 2, Gedung A
        pengawas:
          type: string
          description: Email kampus dosen pengawas
    KehadiranUjian:
      description: Satu baris per (sesi, nim).
      type: object
      properties:
        id:
          type: string
        sesi_ujian_id:
          type: string
        nim:
          type: string
          example: "2026001"
        jam_masuk:
          type: string
          format: date-time
        jam_selesai:
          type: string
          format: date-time
        dicatat_oleh:
          type: string
          readOnly: true
          description: Email kampus pengawas yang check-in manual; tanpa email tercatat sebagai `wa:<nomor>`
    StorageRef:
      description: >-
        Referensi berkas di repo storage GitHub privat. Yang disimpan ke database
        hanya ini, bukan isi berkasnya (pdb/README.md poin 8).
      type: object
      properties:
        repo:
          type: string
          example: platformdigitalbandung/storage
        path:
          type: string
          example: rpl/66f1a2b3c4d5e6f7a8b9c0d1/sertifikat.pdf
        sha:
          type: string
          example: e69de29bb2d1d6434b8b29ae775ad8c2e48c5391
    PengajuanRPL:
      description: >-
        Pengakuan pengalaman kerja sebelum masuk kuliah jadi kredit satu rumpun.
      type: object
      properties:
        id:
          type: string
        nim:
          type: string
          readOnly: true
          description: Diisi server dari roster lewat nomor WhatsApp pada token
          example: "2026TRPL001"
        rumpun_target:
          type: string
          example: R11
        deskripsi:
          type: string
        bukti_url:
          type: array
          description: >-
            Referensi berkas di repo storage GitHub privat (repo/path/sha), bukan isi
            berkasnya - pdb/README.md poin 8.
          items:
            $ref: '#/components/schemas/StorageRef'
        status:
          type: string
          enum:
            - diajukan
            - ditinjau
            - disetujui
            - ditolak
        dinilai_oleh:
          type: string
          readOnly: true
          description: Email kampus peninjau; tanpa email tercatat sebagai `wa:<nomor>`
        catatan:
          type: string
    Prodi:
      type: object
      required: [kode, nama, sks_total, semester, jenjang]
      properties:
        kaprodi_email:
          type: string
          description: Email kampus dosen yang menjabat kaprodi; hanya diubah lewat PUT /kurikulum/prodi/{prodi}/kaprodi
        id: {type: string}
        kode: {type: string, description: 'Huruf kecil/angka/tanda hubung, 2-20 karakter, diawali huruf. Kunci di rumpun, cpl, matakuliah, mahasiswa, kalender_semester', example: pai}
        nama: {type: string, example: Pendidikan Agama Islam}
        sks_total: {type: integer, example: 144}
        semester: {type: integer, description: Jumlah semester program, example: 8}
        jenjang: {type: string, example: S1}
        semester_proyek_kerja_min:
          type: integer
          description: >-
            Semester paling awal mahasiswa prodi ini boleh mengajukan proyek
            kerja/magang. Kosong/0 berarti bawaan platform (4).
          example: 5
    Rumpun:
      type: object
      required: [kode, nama, sks, semester, mata_kuliah]
      properties:
        id: {type: string}
        prodi_kode: {type: string, description: Diisi dari path saat menulis}
        kode: {type: string, example: R1}
        nama: {type: string, example: Dasar Keilmuan}
        mata_kuliah:
          type: array
          description: Sumber tunggal koleksi matakuliah - diturunkan dari daftar ini
          items: {type: string}
        sks: {type: integer, example: 12}
        proyek_pengikat: {type: string}
        moda: {type: string, enum: [ritme_mingguan, tempat_kerja], default: ritme_mingguan}
        semester: {type: integer, example: 1}
        cpl:
          type: array
          items: {type: string}
        catatan: {type: string}
    CapaianPembelajaran:
      type: object
      required: [kode, domain]
      properties:
        id: {type: string}
        prodi_kode: {type: string, description: Diisi dari path saat menulis}
        kode: {type: string, example: CPL01}
        domain: {type: string, example: sikap}
        deskripsi:
          type: string
          description: >-
            Rumusan CPL-nya sendiri. Opsional supaya dokumen lama yang hanya
            berisi kode tetap terbaca.
          example: Bertakwa kepada Tuhan Yang Maha Esa dan mampu menunjukkan sikap religius
        rumpun_penyentuh:
          type: array
          items: {type: string}
        penguatan_usulan:
          type: array
          items: {type: string}
    SesiHari:
      type: object
      required: [hari, moda]
      properties:
        hari: {type: string, description: Nama hari Bahasa Indonesia, example: Senin}
        moda: {type: string, enum: [asinkron, daring_sinkron, opsional_luring_daring, bebas]}
        jam_mulai: {type: string, example: '08.00'}
        jam_selesai: {type: string, example: '10.00'}
        menit_instruksional: {type: integer, example: 120}
        catatan: {type: string}
    RitmeMingguan:
      type: object
      required: [nama, sesi]
      properties:
        id: {type: string}
        nama: {type: string, description: Kalender semester menunjuk ritme lewat nama ini, example: 'Fase 1 - Semester 1-6'}
        sesi:
          type: array
          items:
            $ref: '#/components/schemas/SesiHari'
        total_menit_per_minggu: {type: integer, description: Boleh dikosongkan - dijumlahkan dari sesinya}
        kapasitas_sks_per_semester: {type: number}
    MataKuliah:
      description: >-
        Satu mata kuliah kurikulum, milik satu rumpun. Diturunkan dari
        `rumpun.mata_kuliah` saat seed - bukan daftar kedua yang diketik ulang.
      type: object
      properties:
        id:
          type: string
          example: 66f1a2b3c4d5e6f7a8b9c0d1
        kode:
          type: string
          description: Unik per prodi, diturunkan dari nama mata kuliah
          example: LITERASI-DIGITAL
        nama:
          type: string
          example: Literasi Digital
        sks:
          type: integer
          description: Angka, bukan teks di dalam tanda kurung
          example: 3
        prodi_kode:
          type: string
          example: trpl
        rumpun_kode:
          type: string
          example: R1
        semester:
          type: integer
          example: 1
        cpl:
          type: array
          description: Opsional; pemetaan CPL yang berlaku sekarang ada di level rumpun
          items:
            type: string
    AnggotaProyek:
      description: >-
        Anggota proyek. Hanya `nim` yang bermakna sebagai masukan - ia kunci asing
        ke koleksi `mahasiswa`. `nama` dan `phonenumber` adalah cuplikan yang
        diselaraskan server dari roster saat proyek disimpan; nilai yang dikirim
        klien untuk kedua field itu diabaikan kalau NIM-nya sudah ada di roster.
      type: object
      properties:
        nim:
          type: string
          description: Kunci asing ke koleksi `mahasiswa`. Prodi anggota harus sama dengan prodi proyek.
          example: "2026001"
        nama:
          type: string
          readOnly: true
          description: Cuplikan dari roster - bukan masukan.
          example: Budi Santoso
        phonenumber:
          type: string
          readOnly: true
          description: >-
            Cuplikan nomor WhatsApp dari roster, dipakai untuk notifikasi. Kepemilikan
            NIM di GET /mahasiswa/{nim}/nilai dibuktikan lewat roster, bukan lewat
            nomor yang tersimpan di dokumen proyek ini.
          example: "6281234567890"
    SetEmailDosenRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email kampus pemegang token, wajib @digitalbdg.ac.id
          example: "dosen@digitalbdg.ac.id"
    Mahasiswa:
      description: Satu baris roster akademik. Bukan akun - autentikasi tetap WhatsAuth, dan phonenumber di sini yang menghubungkan token ke identitas akademik.
      type: object
      properties:
        github_username:
          type: string
          description: Opsional, huruf kecil, unik antar-NIM - jembatan hasil autograder ke NIM
          example: marfanwicaksono
        id:
          type: string
        nim:
          type: string
          description: Kunci akademik, unik
          example: "2026001"
        nama:
          type: string
          example: Budi Santoso
        phonenumber:
          type: string
          description: Nomor WhatsApp yang dipakai login WhatsAuth
          example: "6281234567890"
        email:
          type: string
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          description: Semester berjalan, dipakai memilih kalender akademik yang berlaku
          example: 5
        status:
          type: string
          enum: [aktif, cuti, lulus, keluar]
          example: aktif
    TautanTinjauan:
      description: Tautan sekali-pakai untuk atasan, diterbitkan dosen lalu diteruskan sendiri ke atasan.
      type: object
      properties:
        proyek_kerja_id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        atasan_nama:
          type: string
          example: Ibu Atasan
        url:
          type: string
          example: https://platform.digitalbdg.ac.id/tinjauan.html?token=v4.public.xxxx
        token:
          type: string
        kedaluwarsa:
          type: string
          format: date-time
    RingkasTinjauanAtasan:
      description: Tampilan proyek untuk halaman tinjauan atasan - tanpa NIM dan nomor WhatsApp mahasiswa.
      type: object
      properties:
        proyek_kerja_id:
          type: string
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        atasan_nama:
          type: string
          example: Ibu Atasan
        status:
          type: string
          example: berjalan
        sudah_ditinjau:
          type: array
          description: Jenis tinjauan yang sudah dikirim atasan ini
          items:
            type: string
            enum: [tengah-semester, akhir]
    TinjauanAtasanRequest:
      type: object
      properties:
        token:
          type: string
          description: Token dari tautan tinjauan - boleh juga dikirim sebagai query
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
    ProyekKerja:
      description: Proyek semester-panjang di tempat kerja mahasiswa, dikonversi jadi SKS satu rumpun kurikulum.
      type: object
      properties:
        id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        nim:
          type: string
          example: "2026001"
        phonenumber:
          type: string
          description: Diisi server dari token WhatsAuth saat pengajuan - bukti kepemilikan NIM
          example: "6281234567890"
        prodi_kode:
          type: string
          example: trpl
        semester:
          type: integer
          example: 5
        rumpun_kode:
          type: string
          example: R11
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        dosen_email:
          type: string
          description: Email kampus dosen, diisi saat dosen memutuskan pengajuan
          example: "dosen@digitalbdg.ac.id"
        atasan_nama:
          type: string
          example: Ibu Atasan
        atasan_email:
          type: string
          example: atasan@contoh.co.id
        atasan_phonenumber:
          type: string
        status:
          type: string
          enum: [diajukan, disetujui, berjalan, tinjauan-tengah, selesai, ditolak]
          example: diajukan
        catatan:
          type: string
          description: Alasan penolakan atau catatan putusan dosen
    TinjauanProyekKerja:
      description: Satu tinjauan dari satu penilai pada satu titik waktu. Satu peran hanya punya satu tinjauan per jenis.
      type: object
      properties:
        id:
          type: string
        proyek_kerja_id:
          type: string
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        penilai_peran:
          type: string
          enum: [dosen, atasan]
        penilai_nama:
          type: string
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
    AjukanProyekKerjaRequest:
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        prodi_kode:
          type: string
          example: trpl
        semester:
          type: integer
          example: 5
        rumpun_kode:
          type: string
          example: R11
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        atasan_nama:
          type: string
          example: Ibu Atasan
        atasan_email:
          type: string
          example: atasan@contoh.co.id
        atasan_phonenumber:
          type: string
    PutusanProyekKerjaRequest:
      type: object
      properties:
        setuju:
          type: boolean
          example: true
        catatan:
          type: string
          description: Wajib diisi kalau menolak
    TinjauanProyekKerjaRequest:
      type: object
      properties:
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        penilai_nama:
          type: string
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
    Materi:
      description: Satu butir katalog materi asinkron untuk satu minggu rumpun.
      type: object
      properties:
        id:
          type: string
        prodi_kode:
          type: string
          example: trpl
        rumpun_kode:
          type: string
          example: R1
        minggu:
          type: integer
          example: 3
        urutan:
          type: integer
          example: 1
        judul:
          type: string
          example: Pengenalan Git
        jenis:
          type: string
          enum: [video, bacaan, berkas]
        youtube_id:
          type: string
          description: Hanya untuk jenis video - ID 11 karakter yang sudah diurai server
          example: dQw4w9WgXcQ
        isi:
          type: string
          description: Hanya untuk jenis bacaan - teks lengkapnya
        berkas:
          description: >-
            Hanya untuk jenis berkas - referensi PDF di repo storage GitHub privat
            (repo/path/sha), bukan isi berkasnya. Kosong selama berkasnya belum
            diunggah lewat POST /materi/{id}/berkas.
          allOf:
            - $ref: '#/components/schemas/StorageRef'
        nama_berkas:
          type: string
          description: >-
            Nama berkas yang ditampilkan ke mahasiswa, sudah disanitasi. Path di
            repo storage bukan ini - di sana namanya masih diawali id materi
          example: slide-pekan-3.pdf
        halaman:
          type: integer
          description: >-
            Jumlah halaman PDF, ditetapkan saat dosen mengunggah - itu penyebut
            progres per halaman, jadi tidak diambil dari peramban mahasiswa
          example: 24
        ukuran_byte:
          type: integer
          format: int64
          example: 123456
        deskripsi:
          type: string
        dibuat_oleh:
          type: string
          description: Email kampus pembuat, atau "wa:<nomor>" kalau emailnya kosong
    MateriRequest:
      type: object
      required: [prodi_kode, rumpun_kode, minggu, judul, jenis]
      properties:
        prodi_kode:
          type: string
          example: trpl
        rumpun_kode:
          type: string
          example: R1
        minggu:
          type: integer
          minimum: 1
          maximum: 52
          example: 3
        urutan:
          type: integer
          minimum: 0
          example: 1
        judul:
          type: string
          maxLength: 200
        jenis:
          type: string
          enum: [video, bacaan, berkas]
        youtube_id:
          type: string
          description: Wajib untuk video - ID 11 karakter atau tautan YouTube apa pun
          example: https://youtu.be/dQw4w9WgXcQ
        isi:
          type: string
          maxLength: 100000
          description: Wajib untuk bacaan
        deskripsi:
          type: string
          maxLength: 1000
    BerkasMateri:
      description: >-
        Isi berkas PDF satu materi, dikirim base64 di dalam JSON. Bukan biner:
        repo storage-nya privat sehingga peramban tidak bisa mengambilnya
        langsung, dan frontend hanya memanggil REST lewat crootjs yang mengurai
        JSON.
      type: object
      properties:
        nama_berkas:
          type: string
          example: slide-pekan-3.pdf
        mime:
          type: string
          example: application/pdf
        halaman:
          type: integer
          description: Penyebut progres per halaman, ditetapkan dosen saat mengunggah
          example: 24
        ukuran_byte:
          type: integer
          format: int64
          example: 123456
        isi_base64:
          type: string
          format: byte
          description: Isi berkas PDF dalam base64
          example: JVBERi0xLjcK
    ProgresMateri:
      description: >-
        Progres satu (nim, rumpun, minggu, materi). persen_selesai yang tersimpan
        tidak pernah turun, begitu juga halaman_terakhir.
      type: object
      properties:
        id:
          type: string
        nim:
          type: string
          readOnly: true
          description: Diisi server dari roster lewat nomor WhatsApp pada token
          example: "2026TRPL001"
        rumpun_kode:
          type: string
          example: R1
        minggu:
          type: integer
          example: 3
        materi_id:
          type: string
          description: Slug/ID materi di katalog (video, bacaan, atau berkas), maksimal 200 karakter
          example: video-pengenalan-git
        persen_selesai:
          type: number
          format: double
          example: 80
        halaman_terakhir:
          type: integer
          description: >-
            Hanya untuk materi jenis berkas - halaman terjauh yang sudah dibuka.
            Keterangan untuk dosen; yang dipakai laporan kepatuhan tetap
            persen_selesai.
          example: 12
    CatatProgresRequest:
      type: object
      required: [rumpun_kode, minggu, materi_id, persen_selesai]
      properties:
        rumpun_kode:
          type: string
          example: R1
        minggu:
          type: integer
          minimum: 1
          maximum: 52
          example: 3
        materi_id:
          type: string
          maxLength: 200
          example: video-pengenalan-git
        persen_selesai:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 45
        halaman_terakhir:
          type: integer
          minimum: 0
          description: >-
            Opsional, dipakai materi jenis berkas. Digabung dengan aturan
            tidak-pernah-turun yang sama dengan persen_selesai.
          example: 12
    ProyekTelat:
      description: Satu proyek yang sudah melewati titik tengah semester tetapi tinjauan tengahnya belum lengkap.
      type: object
      properties:
        id:
          type: string
        nim:
          type: string
        judul_pekerjaan:
          type: string
        nama_perusahaan:
          type: string
        rumpun_kode:
          type: string
        status:
          type: string
        dosen_email:
          type: string
        kurang:
          type: array
          items:
            type: string
            enum: [dosen, atasan]
          description: Pihak yang tinjauan tengahnya belum masuk - itu yang menentukan siapa yang harus ditagih
          example: [atasan]
        hari_terlambat:
          type: integer
          example: 10
    RingkasanKaprodi:
      description: Ringkasan proyek kerja untuk kaprodi.
      type: object
      properties:
        prodi_kode:
          type: string
        angkatan:
          type: string
        semester:
          type: integer
        total:
          type: integer
        aktif:
          type: integer
          description: Sudah disetujui dan belum selesai/ditolak
        per_status:
          type: object
          additionalProperties:
            type: integer
          example: {diajukan: 2, berjalan: 5, selesai: 1}
        acuan_tengah:
          type: string
          enum: [kalender, tidak-ada-kalender]
        titik_tengah:
          type: string
          description: Tanggal titik tengah semester; kosong kalau tidak ada kalender terbit
          example: "2026-10-26"
        tanpa_acuan:
          type: integer
          description: Proyek aktif yang keterlambatannya tidak bisa dinilai karena kalender semesternya belum terbit
        telat:
          type: array
          items:
            $ref: '#/components/schemas/ProyekTelat'
    ProyekKerjaSaya:
      description: Proyek kerja milik pemegang token - yang dibimbing (dosen) atau yang diajukan sendiri (mahasiswa).
      type: object
      properties:
        peran:
          type: string
          enum: [dosen, mahasiswa]
        email:
          type: string
          description: Email kampus, diisi hanya untuk dosen
        proyekkerja:
          type: array
          items:
            $ref: '#/components/schemas/ProyekKerja'
    KalenderSemester:
      description: Kalender satu semester untuk satu prodi dan angkatan, diturunkan dari ritme mingguan kurikulum.
      type: object
      properties:
        id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          example: 1
        tanggal_mulai:
          type: string
          format: date-time
          description: Hari Senin pada pekan pertama semester
        sesi:
          type: array
          items:
            $ref: '#/components/schemas/SesiKalender'
        diterbitkan:
          type: boolean
          description: false = draft, belum terlihat publik
          example: false
        diterbitkan_pada:
          type: string
          format: date-time
    SesiKalender:
      description: Satu sesi harian pada kalender, hasil penerjemahan SesiHari ritme mingguan ke tanggal konkret.
      type: object
      properties:
        minggu:
          type: integer
          example: 1
        tanggal:
          type: string
          format: date-time
        hari:
          type: string
          example: Jumat
        moda:
          type: string
          example: opsional_luring_daring
        jam_mulai:
          type: string
          example: "08:00"
        jam_selesai:
          type: string
          example: "20:00"
        keterangan:
          type: string
        rumpun_kode:
          type: string
          description: FK opsional ke Rumpun.Kode
          example: R1
    BuatKalenderRequest:
      type: object
      properties:
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          example: 1
        tanggal_mulai:
          type: string
          description: Format YYYY-MM-DD. Kalau bukan hari Senin, dipakai hari Senin pada pekan yang sama.
          example: "2026-09-14"
        jumlah_minggu:
          type: integer
          description: Kosong = 16
          example: 16
    ProyekSaya:
      description: Proyek milik pemegang token - yang dibimbing (dosen) atau yang diikuti (mahasiswa).
      type: object
      properties:
        jabatan:
          type: array
          items: {type: string, enum: [admin, kaprodi]}
          description: Jabatan pimpinan dosen dari database saat itu
        prodi_mengajar:
          type: array
          items: {type: string}
          description: Prodi tempat dosen mengajar digabung prodi yang dipimpin (hanya dosen)
        kaprodi_prodi:
          type: array
          items: {type: string}
          description: Kode prodi yang dipimpin sebagai kaprodi
        peran:
          type: string
          enum: [dosen, mahasiswa]
          example: mahasiswa
        email:
          type: string
          description: Email kampus, diisi hanya untuk dosen yang sudah mengisinya
          example: "dosen@digitalbdg.ac.id"
        nim:
          type: string
          description: NIM pemilik nomor, diisi hanya untuk peran mahasiswa
          example: "2026001"
        prodi_kode:
          type: string
          description: >-
            Diisi hanya dari roster, untuk mahasiswa yang terdaftar di sana.
            Mahasiswa yang dikenali lewat jalur mundur penyisiran proyek tidak
            mendapatkannya, karena prodinya tidak tercatat di sumber yang
            tepercaya.
          example: trpl
        proyekblok:
          type: array
          items:
            $ref: '#/components/schemas/ProyekBlok'
    PenilaianProyek:
      description: Satu baris nilai per (proyek, nim, kode_mk) - satu proyek menilai beberapa mata kuliah sekaligus lewat artefak yang berbeda, jadi satu mahasiswa punya beberapa baris dalam satu proyek.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901299
        proyek_blok_id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        nim:
          type: string
          example: "2026001"
        kode_mk:
          type: string
          description: >-
            Kunci asing ke koleksi `matakuliah` - kode stabil, bukan teks tampilan.
            Server mengkanonikkannya saat menyimpan, jadi nilai yang dikembalikan di
            sini selalu bentuk kode ini apa pun ejaan yang dikirim.
          example: LITERASI-DIGITAL
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        nilai_akhir:
          type: number
          description: Selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15, tidak pernah diinput manual
          example: 84.25
        catatan:
          type: string
          example: Portofolio rapi, presentasi perlu latihan lagi
        dinilai_oleh:
          type: string
          description: Identitas penilai yang sebenarnya (bisa admin, bukan selalu pembimbing) - email kampus dosen kalau sudah diisi, kalau tidak nomornya sendiri dengan awalan "wa:" (data lama bisa berisi NIP)
          example: "dosen@digitalbdg.ac.id"
    KomponenNilai:
      description: Keempat komponen nilai, masing-masing berskala 0-100. Bobotnya tetap - hasil proyek 40%, ujian 30%, kuis 15%, presentasi 15% - dan dihitung di server, tidak disimpan per dokumen.
      type: object
      properties:
        hasil_proyek:
          type: number
          description: Skala 0-100, boleh memakai nilai kelompok (bobot 40%)
          minimum: 0
          maximum: 100
          example: 88
        ujian:
          type: number
          description: Skala 0-100, individu - ujian berpengawas di kampus (bobot 30%)
          minimum: 0
          maximum: 100
          example: 80
        kuis:
          type: number
          description: Skala 0-100, individu (bobot 15%)
          minimum: 0
          maximum: 100
          example: 85
        presentasi:
          type: number
          description: Skala 0-100, individu meski proyeknya kelompok (bobot 15%)
          minimum: 0
          maximum: 100
          example: 82
    RekapNilai:
      description: Bentuk ringkas nilai satu mahasiswa - nilai akhir per mata kuliah beserta rata-ratanya.
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        per_mata_kuliah:
          type: object
          description: Peta nama mata kuliah ke nilai akhirnya
          additionalProperties:
            type: number
          example:
            Literasi Digital (3): 84.25
            Kewirausahaan (3): 79.5
        rata_rata:
          type: number
          description: Rata-rata dari nilai akhir tiap mata kuliah (bukan dari komponen), dibulatkan 2 angka desimal
          example: 81.88
    BuatProyekBlokRequest:
      type: object
      properties:
        rumpun_kode:
          type: string
          description: Kode rumpun yang harus sudah ada di data kurikulum prodi itu
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_email:
          type: string
          description: Email kampus dosen aktif yang membimbing
          example: "dosen@digitalbdg.ac.id"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          description: Kalau dikosongkan, diisi draft
          enum:
            - draft
            - berjalan
            - selesai
          default: draft
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          description: Tidak boleh negatif dan tidak boleh lebih awal dari mulai_minggu
          example: 8
      required:
        - rumpun_kode
        - prodi_kode
        - angkatan
        - judul
        - dosen_email
    InputNilaiRequest:
      description: Body input nilai. nilai_akhir tidak ada di sini karena selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15.
      type: object
      properties:
        nim:
          type: string
          description: Harus NIM yang terdaftar sebagai anggota proyek ini
          example: "2026001"
        kode_mk:
          type: string
          description: >-
            Mata kuliah yang dinilai, harus milik rumpun proyek ini. Boleh ditulis
            sebagai kode (`LITERASI-DIGITAL`), nama lengkap (`Literasi Digital`), atau
            sebagian nama (`literasi`) - server mencocokkannya ke koleksi `matakuliah`
            lalu menyimpan `kode`-nya. Masukan yang cocok ke DUA mata kuliah ditolak
            dengan 422 yang menyebut pilihan yang sah, bukan ditebak. Nilai yang
            tersimpan dan dikembalikan selalu bentuk kode.
          example: literasi digital
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        catatan:
          type: string
          description: Opsional
          example: Portofolio rapi, presentasi perlu latihan lagi
      required:
        - nim
        - kode_mk
        - komponen
  requestBodies:
    TextMessageReq:
      description: Kirim Pesan teks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextMessage'
    TextMessageResp:
      description: Respon dari request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TextMessageResponse'
  securitySchemes:
    token:
      type: apiKey
      name: token
      in: header
    dosenToken:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.public
      description: >-
        Token PASETO WhatsAuth (keypair bersama PUBLICKEY/PRIVATEKEY) dari nomor
        WhatsApp yang terdaftar sebagai dosen, didapat lewat alur POST
        /whatsauth/request. Dikirim sebagai `Authorization: Bearer <token>` —
        BUKAN header `token` seperti endpoint WhatsApp/device di atas. Dokumen
        ini sebelumnya mendeklarasikannya sebagai apiKey header `token`, tidak
        sesuai kode (`mod/portaltugas/auth.go`, `mod/proyekblok/auth.go`
        keduanya membaca header Authorization).
