          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Isian kosong, atau email roster dipakai lebih dari satu mahasiswa (masuk dengan NIM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '429':
          description: Lebih dari 10 percobaan gagal per NIM/email atau 30 per IP dalam 15 menit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security: []
  /akun/sandi:
    get:
      tags:
        - akun
      summary: Status kata sandi pemilik token
      description: >-
        Identitas yang dipakai untuk masuk (NIM atau email kampus), apakah kata
        sandinya masih templat, dan apakah akun ini bisa masuk dengan kata sandi
        (dosen tanpa email kampus belum bisa). Dipakai halaman Ganti Kata Sandi.
      operationId: statusSandi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSandi'
        '401':
          description: Token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor token bukan dosen aktif maupun mahasiswa roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    put:
      tags:
        - akun
      summary: Ganti kata sandi sendiri
      description: >-
        Mengganti kata sandi pemilik token setelah kata sandi lamanya (templat atau
        yang tersimpan) terbukti. Kata sandi baru 8-128 karakter dan tidak sama
        dengan templat. Disimpan sebagai hash argon2id di koleksi `katasandi`;
        templat berhenti berlaku. Percobaan dengan kata sandi lama yang salah
        dibatasi seperti halaman masuk.
      operationId: gantiSandi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GantiSandiRequest'
      responses:
        '200':
          description: Kata sandi baru tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  identitas:
                    type: string
                    description: NIM atau email yang dipakai untuk masuk
        '401':
          description: Token tidak sah, atau kata sandi lama salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor token bukan dosen aktif maupun mahasiswa roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kata sandi baru terlalu pendek/panjang atau sama dengan templat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '429':
          description: Terlalu banyak percobaan kata sandi lama yang salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /pengguna/dosen:
    get:
      tags:
        - pengguna
