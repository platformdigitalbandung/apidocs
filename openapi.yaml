          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyek:
                    $ref: '#/components/schemas/ProyekKerja'
                  tinjauan:
