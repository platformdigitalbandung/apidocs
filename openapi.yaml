openapi: 3.0.3
info:
  title: Dokumen API Platform
  description: >-
    Penjelasan tata cara pemakaian API dari Whatsauth.


    Catatan: dua route websocket di backend (`/ws/whatsauth/public` untuk QR auth,
    `/ws/chatgpl/public` untuk chatGPL) tidak didokumentasikan di sini karena
    OpenAPI 3.0 tidak punya skema native untuk websocket.
  termsOfService: https://wa.my.id
  contact:
    email: awangga@gmail.com
  license:
    name: Buat dulu webhook untuk menerima dan mengirim pesan
    url: https://github.com/whatsauth/webhook
  version: 1.1.0
externalDocs:
  description: Pendaftaran Token Whatsauth
  url: https://wa.my.id
servers:
  - url: https://apk.fly.dev/api
tags:
  - name: botregister
    description: Pendaftaran nomor bot WhatsApp atau refresh token, disertai URL dan Secret WebHook. Bukan pendaftaran pengguna aplikasi - identitas orang datang dari WhatsAuth.
    externalDocs:
      description: Contoh Kode WebHook
      url: https://github.com/whatsauth/webhook
  - name: kalender
    description: Kalender akademik per prodi/angkatan/semester, diturunkan dari ritme mingguan kurikulum. Baca publik hanya untuk kalender yang sudah diterbitkan.
  - name: proyekkerja
    description: Modul Proyek Kerja/Magang - proyek semester-panjang di tempat kerja mahasiswa, disetujui dosen lalu ditinjau dua pihak (dosen dan atasan) pada tengah dan akhir semester.
  - name: akademik
    description: Roster mahasiswa - sumber identitas akademik bersama yang dipakai modul dasbor, blok/proyek, dan proyek kerja. Diisi pengelola prodi, bukan pendaftaran mandiri.
  - name: device
    description: Set whatsapp yg digunakan
    externalDocs:
      description: Tata cara input kode
      url: https://faq.whatsapp.com/1324084875126592
  - name: message
    description: Mengirim pesan ke tujuan
    externalDocs:
      description: Contoh Kode Program
      url: https://github.com/whatsauth/webhook/blob/09c999be72e25660395f27c879456938a57561d1/function.go#L36C9-L36C9
  - name: whatsauth
    description: Get Token and Authorize
  - name: version
    description: Cek status dan commit deployan yang sedang berjalan
  - name: tugas
    description: Portal Tugas - pengumpulan tugas mahasiswa dan laporan kemiripan
  - name: kurikulum
    description: Data referensi kurikulum - prodi, rumpun, CPL, ritme mingguan
  - name: dasbor
    description: Dasbor mahasiswa - beban belajar mingguan dan pelacakan capaian pembelajaran (CPL)
  - name: proyekblok
    description: Modul Blok/Proyek - instance proyek per rumpun kurikulum dan penilaian per mahasiswa per mata kuliah
paths:
  /health:
    # Rute ini ada di AKAR, bukan di bawah /api - server default dokumen ini
    # berakhiran /api, jadi path item ini menimpanya. Tanpa override, pembaca
    # dokumen akan memanggil https://apk.fly.dev/api/health yang menjawab 404.
    servers:
      - url: https://apk.fly.dev
        description: Produksi (akar, di luar prefix /api)
    get:
      tags:
        - tugas
      summary: Health check Portal Tugas
      description: >-
        Mengembalikan status service dan jumlah tugas yang tersimpan.
        Alamat lengkapnya `https://apk.fly.dev/health` - TANPA prefix `/api`.
      operationId: healthTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  n_tugas:
                    type: integer
                    example: 3
  /tugas:
    get:
      tags:
        - tugas
      summary: Daftar tugas
      operationId: daftarTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tugas:
                    type: array
                    items:
                      $ref: '#/components/schemas/TugasRingkas'
    post:
      tags:
        - tugas
      summary: Buat tugas baru
      description: Hanya dosen yang sudah login lewat WhatsAuth (lihat /whatsauth/request) yang bisa membuat tugas
      operationId: buatTugas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatTugasRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 66f0a1b2c3d4e5f678901234
                  judul:
                    type: string
                    example: Tugas Besar Basis Data
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal (judul/deskripsi tidak sesuai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /tugas/{id}:
    get:
      tags:
        - tugas
      summary: Detail tugas
      operationId: detailTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  judul:
                    type: string
                  deskripsi:
                    type: string
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/kirim:
    post:
      tags:
        - tugas
      summary: Kumpulkan berkas tugas
      description: Endpoint publik untuk mahasiswa mengumpulkan tugas. Body berupa multipart/form-data berisi nama, nim, dan berkas.
      operationId: kirimTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: Budi Santoso
                nim:
                  type: string
                  example: "1301210001"
                berkas:
                  type: string
                  format: binary
              required:
                - nama
                - nim
                - berkas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  kiriman_id:
                    type: string
                  n_kata:
                    type: integer
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Nama/NIM/berkas tidak valid atau gagal diekstrak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/laporan:
    get:
      tags:
        - tugas
      summary: Laporan kemiripan tugas
      description: Hanya dosen yang sudah login yang bisa mengakses laporan kemiripan antar kiriman
      operationId: laporanTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKemiripan'
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dosen/ping:
    get:
      tags:
        - tugas
      summary: Cek validitas token dosen
      operationId: pingDosen
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  user:
                    type: string
                    example: dosen
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kurikulum/prodi:
    get:
      tags:
        - kurikulum
      summary: Daftar program studi
      operationId: daftarProdi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  prodi:
                    type: array
                    items:
                      type: object
  /kurikulum/prodi/{prodi}/rumpun:
    get:
      tags:
        - kurikulum
      summary: Daftar rumpun matakuliah suatu prodi
      operationId: daftarRumpun
      parameters:
        - in: path
          name: prodi
          schema:
            type: string
          required: true
          description: Kode/slug program studi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  rumpun:
                    type: array
                    items:
                      type: object
  /kurikulum/prodi/{prodi}/matakuliah:
    get:
      tags:
        - kurikulum
      summary: Daftar mata kuliah terstruktur suatu prodi
      description: >-
        Mata kuliah dengan kode stabil dan SKS berupa angka, diturunkan dari
        `rumpun.mata_kuliah` saat seed kurikulum. Berbeda dari daftar rumpun yang
        memuat mata kuliah sebagai teks tampilan (`"Literasi Digital (3)"`) - SKS
        di sini tidak perlu diurai dari dalam tanda kurung. Publik, seperti rute
        kurikulum lainnya.
      operationId: daftarMataKuliah
      parameters:
        - in: path
          name: prodi
          schema:
            type: string
          required: true
          description: Kode/slug program studi
        - in: query
          name: rumpun
          schema:
            type: string
          required: false
          description: Saring per kode rumpun; kosong berarti seluruh prodi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  matakuliah:
                    type: array
                    items:
                      $ref: '#/components/schemas/MataKuliah'
                  total_sks:
                    type: integer
                    description: Jumlah SKS seluruh mata kuliah yang dikembalikan
                    example: 58
        '404':
          description: Prodi tidak ada di data kurikulum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /kurikulum/seed:
    post:
      tags:
        - kurikulum
      summary: Seed data referensi kurikulum
      description: Menulis data referensi kurikulum (prodi, rumpun, CPL, ritme mingguan) ke Mongo. Idempoten, langkah manual satu kali dipanggil operator setelah deploy - dilindungi token dosen yang sama dengan Portal Tugas.
      operationId: seedKurikulum
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  ringkasan:
                    type: object
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kalender:
    get:
      tags:
        - kalender
      summary: Daftar kalender akademik
      description: Mengembalikan kalender yang sudah diterbitkan - tidak perlu token. Filter prodi, angkatan, dan semester opsional. Dosen yang menyertakan token WhatsAuth dan draft=1 ikut menerima kalender yang masih draft.
      operationId: daftarKalender
      parameters:
        - in: query
          name: prodi
          schema:
            type: string
          required: false
          example: trpl
        - in: query
          name: angkatan
          schema:
            type: string
          required: false
          example: "2026"
        - in: query
          name: semester
          schema:
            type: integer
          required: false
          example: 1
        - in: query
          name: draft
          schema:
            type: string
            enum: ["1"]
          required: false
          description: Sertakan kalender draft - wajib token dosen
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  kalender:
                    type: array
                    items:
                      $ref: '#/components/schemas/KalenderSemester'
        '401':
          description: draft=1 diminta tanpa token dosen yang sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
    post:
      tags:
        - kalender
      summary: Buat draft kalender semester
      description: Membuat draft kalender dari ritme mingguan kurikulum - tanggal tiap sesi diisi otomatis dari pola mingguan, lalu boleh disunting selagi masih draft. Satu prodi+angkatan+semester hanya boleh punya satu kalender. Hanya dosen (atau admin) lewat WhatsAuth.
      operationId: buatKalender
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatKalenderRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KalenderSemester'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Body tidak valid, tanggal_mulai bukan YYYY-MM-DD, prodi tidak ada di data kurikulum, ritme mingguan belum di-seed, atau kalender untuk kombinasi itu sudah ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kalender/{id}:
    delete:
      tags:
        - kalender
      summary: Hapus kalender
      description: Menghapus kalender - dipakai membatalkan rencana yang salah atau membersihkan kalender percobaan. Draft langsung terhapus. Kalender yang sudah diterbitkan hanya terhapus kalau konfirmasi=terbit disertakan, karena mahasiswa sudah melihatnya dan pembatalannya perlu diumumkan.
      operationId: hapusKalender
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
        - in: query
          name: konfirmasi
          required: false
          schema:
            type: string
            enum: [terbit]
          description: Wajib diisi terbit untuk menghapus kalender yang sudah diterbitkan
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  dihapus:
                    type: string
                    example: 6aa3f4f514984a96f23147dd
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kalender tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kalender sudah diterbitkan tetapi konfirmasi=terbit tidak disertakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    put:
      tags:
        - kalender
      summary: Sunting sesi kalender (hanya selagi draft)
      description: Mengganti seluruh daftar sesi kalender. Ditolak kalau kalender sudah diterbitkan - perubahan jadwal setelah terbit diumumkan, bukan diubah diam-diam.
      operationId: gantiSesiKalender
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sesi:
                  type: array
                  items:
                    $ref: '#/components/schemas/SesiKalender'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KalenderSemester'
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kalender tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Sesi kosong atau kalender sudah diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kalender/{id}/terbitkan:
    post:
      tags:
        - kalender
      summary: Terbitkan kalender
      description: Menandai kalender sebagai resmi sehingga terlihat publik. Idempoten - memanggil ulang tidak mengubah waktu terbit yang sudah tercatat.
      operationId: terbitkanKalender
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KalenderSemester'
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kalender tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dosen/nip:
    put:
      tags:
        - tugas
      summary: Isi NIP dosen
      description: Dosen hanya boleh mengisi NIP nomornya sendiri - kosongkan nohp untuk itu. Mengisi NIP dosen lain butuh peran admin, karena NIP menentukan proyek mana yang boleh dinilai seseorang. Sebelum rute ini ada, nip hanya bisa diisi lewat akses database langsung, padahal putusan proyek kerja serta pembuatan dan penilaian proyek blok semuanya berhenti tanpanya.
      operationId: setNIPDosen
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNIPRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  nohp:
                    type: string
                    example: "6281312000300"
                  nama:
                    type: string
                  nip:
                    type: string
                    example: "198501012010011001"
                  aktif:
                    type: boolean
        '401':
          description: Token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen terdaftar, atau mencoba mengisi NIP dosen lain tanpa peran admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: NIP kosong, terlalu pendek, memuat spasi, atau nomor tidak terdaftar sebagai dosen aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /mahasiswa:
    post:
      tags:
        - akademik
      summary: Tambah atau perbarui satu baris roster mahasiswa
      description: Upsert berdasarkan NIM. Ini bukan pendaftaran pengguna - mahasiswa tidak mendaftar sendiri, pengelola prodi yang mengisi. Nomor WhatsApp di sini yang menghubungkan identitas WhatsAuth ke identitas akademik, dan koleksi inilah sumber identitas yang dipakai modul dasbor, blok/proyek, serta proyek kerja.
      operationId: simpanMahasiswa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mahasiswa'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mahasiswa'
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal - nim, nama, prodi_kode, atau angkatan kosong, semester di luar rentang wajar, atau status tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    get:
      tags:
        - akademik
      summary: Daftar roster mahasiswa
      description: Filter opsional per prodi dan angkatan. Hanya dosen - roster memuat nomor WhatsApp dan surel mahasiswa.
      operationId: daftarMahasiswa
      parameters:
        - in: query
          name: prodi
          schema:
            type: string
          required: false
          example: trpl
        - in: query
          name: angkatan
          schema:
            type: string
          required: false
          example: "2026"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  mahasiswa:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mahasiswa'
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja:
    post:
      tags:
        - proyekkerja
      summary: Ajukan proyek kerja
      description: Mahasiswa mengajukan proyek di tempat kerjanya untuk dikonversi jadi SKS satu rumpun. Nomor WhatsApp diambil dari token, bukan dari body - itu yang jadi bukti kepemilikan NIM. Status awal diajukan; satu nim hanya boleh punya satu pengajuan yang belum ditolak per rumpun.
      operationId: ajukanProyekKerja
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjukanProyekKerjaRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekKerja'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal - field wajib kosong, surel atasan tidak sah, semester di luar rentang, rumpun tidak ada di data kurikulum, atau pengajuan untuk rumpun itu sudah ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/saya:
    get:
      tags:
        - proyekkerja
      summary: Proyek kerja milik pemegang token
      description: >-
        Mengembalikan proyek yang dibimbing kalau nomor pada token adalah dosen yang
        NIP-nya sudah terisi, selain itu proyek yang diajukan sendiri. Proyek milik
        mahasiswa dicari lewat NIM dari roster `mahasiswa`, bukan lewat nomor WhatsApp
        yang tersalin di dokumen saat pengajuan - nomor bisa berganti, NIM tidak.
      operationId: proyekKerjaSaya
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekKerjaSaya'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >-
            Nomor pada token belum terdaftar di roster `mahasiswa`. Sengaja bukan daftar
            kosong: nomor di luar roster tidak mungkin punya pengajuan, karena pengajuannya
            sendiri sudah ditolak lebih dulu - daftar kosong akan terbaca seperti "Anda
            belum pernah mengajukan".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Nomor terdaftar sebagai dosen tetapi `nip`-nya belum diisi - isi lewat PUT /dosen/nip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/tinjauan-atasan:
    get:
      tags:
        - proyekkerja
      summary: Ringkasan proyek untuk halaman tinjauan atasan
      description: Dipakai halaman tinjauan saat dimuat. Otorisasinya token tautan sekali-pakai, bukan WhatsAuth - atasan di kantor mahasiswa bukan pengguna platform ini. Balasannya sengaja ringkas dan tidak memuat NIM maupun nomor WhatsApp mahasiswa.
      operationId: ringkasTinjauanAtasan
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Token dari tautan tinjauan
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasTinjauanAtasan'
        '401':
          description: Tautan tidak sah, bukan tautan tinjauan atasan, atau sudah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
    post:
      tags:
        - proyekkerja
      summary: Atasan mengirim tinjauan lewat tautan
      description: Menyimpan tinjauan sebagai penilai_peran atasan lalu memperbarui status proyek. Balasannya hanya konfirmasi - isi dokumen proyek tidak dikirim balik ke pemegang tautan. Token boleh dikirim di body atau query.
      operationId: tinjauanAtasan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TinjauanAtasanRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  jenis:
                    type: string
                    example: tengah-semester
                  skor:
                    type: number
                    format: double
                    example: 88
                  status_proyek:
                    type: string
                    example: tinjauan-tengah
        '401':
          description: Tautan tidak sah atau sudah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Jenis atau skor tidak sah, atau proyek belum disetujui dan sudah selesai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /proyekkerja/{id}/tautan-tinjauan:
    post:
      tags:
        - proyekkerja
      summary: Terbitkan tautan tinjauan untuk atasan
      description: Dosen menerbitkan tautan sekali-pakai berumur 14 hari yang menunjuk satu proyek, lalu meneruskannya sendiri ke atasan. Platform ini belum punya pengiriman surel, dan mengirim otomatis lewat bot WhatsApp butuh nomor bot pengirim yang belum ada di konfigurasi. Tokennya memakai keypair PASETO yang sama dengan token lain.
      operationId: tautanTinjauanProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TautanTinjauan'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Proyek belum disetujui atau sudah selesai sehingga belum atau tidak lagi menerima tinjauan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/{id}:
    delete:
      tags:
        - proyekkerja
      summary: Hapus pengajuan proyek kerja
      description: Menghapus pengajuan beserta seluruh tinjauannya. Status diajukan atau ditolak langsung terhapus; status disetujui dan seterusnya perlu konfirmasi=hapus karena putusan dosen dan tinjauan yang sudah masuk ikut hilang. Tanpa endpoint ini satu nim dan rumpun yang salah ajukan terkunci selamanya, karena pengajuan kedua ditolak selama yang lama belum ditolak.
      operationId: hapusProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
        - in: query
          name: konfirmasi
          required: false
          schema:
            type: string
            enum: [hapus]
          description: Wajib diisi hapus untuk proyek yang sudah disetujui atau berjalan
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  dihapus:
                    type: string
                    example: 6aa3f4f514984a96f23147dd
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Proyek kerja ini bukan milik pemegang token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Proyek sudah disetujui atau berjalan tetapi konfirmasi=hapus tidak disertakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    get:
      tags:
        - proyekkerja
      summary: Detail proyek kerja beserta tinjauannya
      description: Dosen dan admin boleh melihat proyek mana pun; mahasiswa hanya proyek miliknya sendiri, dibuktikan nomor WhatsApp yang tercatat saat pengajuan. Field nilai_akhir hanya muncul kalau tinjauan akhir dari kedua penilai sudah masuk.
      operationId: detailProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyek:
                    $ref: '#/components/schemas/ProyekKerja'
                  tinjauan:
                    type: array
                    items:
                      $ref: '#/components/schemas/TinjauanProyekKerja'
                  nilai_akhir:
                    type: number
                    format: double
                    example: 85.5
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Proyek kerja ini bukan milik pemegang token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/{id}/putusan:
    post:
      tags:
        - proyekkerja
      summary: Putusan dosen atas pengajuan
      description: Menyetujui atau menolak pengajuan. Dinamai putusan, bukan setuju, karena endpoint ini juga dipakai menolak. Penolakan wajib disertai catatan alasan, dan putusan hanya berlaku untuk pengajuan yang masih berstatus diajukan.
      operationId: putusanProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutusanProyekKerjaRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekKerja'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau NIP dosen belum diisi di data dosen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Pengajuan sudah diputuskan sebelumnya, atau penolakan tanpa catatan alasan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekkerja/{id}/tinjauan:
    post:
      tags:
        - proyekkerja
      summary: Kirim tinjauan tengah atau akhir
      description: Menyimpan tinjauan dosen lalu memperbarui status proyek dari kelengkapan tinjauannya - status hanya naik kalau kedua pihak (dosen dan atasan) sudah menilai pada titik waktu itu. Satu peran hanya punya satu tinjauan per jenis, mengirim ulang berarti memperbarui. Jalur atasan lewat tautan sekali pakai belum tersedia.
      operationId: tinjauanProyekKerja
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 6aa3f4f514984a96f23147dd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TinjauanProyekKerjaRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyek:
                    $ref: '#/components/schemas/ProyekKerja'
                  tinjauan:
                    $ref: '#/components/schemas/TinjauanProyekKerja'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Jenis/peran/skor tidak sah, atau proyek berstatus belum disetujui atau sudah selesai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dasbor/beban-belajar/{nim}:
    get:
      tags:
        - dasbor
      summary: Beban belajar minggu berjalan seorang mahasiswa
      description: >-
        Menjumlahkan menit instruksional seluruh sesi kalender pada minggu yang
        sedang berjalan, lalu mengubahnya jadi SKS dengan dasar 85 menit
        terjadwal-terbukti per SKS per minggu (SN-Dikti 170 menit, separuhnya
        terjadwal - lihat dokumen kurikulum). Menit diambil dari ritme mingguan,
        bukan selisih jam kalender, karena jam kotor memuat jeda ibadah & makan
        yang tidak dihitung sebagai beban belajar.


        Prodi, angkatan, dan semester mahasiswa dibaca dari koleksi `mahasiswa`.
        Hanya kalender yang sudah diterbitkan yang dipakai. Dosen/admin boleh
        melihat siapa pun; mahasiswa hanya dirinya sendiri (kepemilikan NIM
        dibuktikan dari nomor WhatsApp di token lewat roster).
      operationId: bebanBelajarMahasiswa
      parameters:
        - name: nim
          in: path
          required: true
          schema:
            type: string
          example: "2026001"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BebanMingguan'
        '401':
          description: Token tidak valid atau tidak dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Mahasiswa mencoba melihat beban belajar orang lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: NIM tidak ada di roster mahasiswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kalender semester belum terbit, atau tanggal hari ini di luar rentang kalender
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dasbor/cpl/{nim}:
    get:
      tags:
        - dasbor
      summary: Cakupan CPL seorang mahasiswa
      description: >-
        Sebuah CPL dihitung tercapai kalau mahasiswa punya nilai LULUS pada
        minimal satu rumpun yang menyentuh CPL itu (`rumpun.cpl`) - dihitung
        dari nilai nyata, bukan dari klaim di dokumen kurikulum. Ambang lulusnya
        satu sumber dengan Modul Blok/Proyek.
      operationId: cakupanCPLMahasiswa
      parameters:
        - name: nim
          in: path
          required: true
          schema:
            type: string
          example: "2026001"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasanCakupanCPL'
        '401':
          description: Token tidak valid atau tidak dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Mahasiswa mencoba melihat cakupan CPL orang lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: NIM tidak ada di roster mahasiswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dasbor/prodi/{kode}/cpl:
    get:
      tags:
        - dasbor
      summary: Cakupan CPL agregat satu prodi
      description: >-
        Versi hidup dari matriks CPL yang selama ini ditulis manual di dokumen
        kurikulum: sebuah CPL tercapai kalau ADA mahasiswa mana pun di prodi itu
        yang sudah lulus di rumpun yang menyentuhnya. Tanpa token - isinya
        agregat tanpa data pribadi, memang untuk halaman akreditasi/landing.
      operationId: cakupanCPLProdi
      parameters:
        - name: kode
          in: path
          required: true
          schema:
            type: string
          example: trpl
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasanCakupanCPL'
        '404':
          description: >-
            Kode prodi tidak ada di data kurikulum. Sengaja dibedakan dari 200
            dengan ringkasan kosong: kode yang salah ketik tidak boleh terbaca
            seperti prodi yang ada tapi belum mencapai apa pun.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /proyekblok:
    get:
      tags:
        - proyekblok
      summary: Daftar proyek blok
      description: Siapa pun yang memegang token WhatsAuth yang masih berlaku boleh melihat daftar proyek blok. Token dikirim lewat header Authorization berisi "Bearer <token>". Filter prodi dan angkatan opsional - kalau keduanya dikosongkan seluruh proyek dikembalikan.
      operationId: daftarProyekBlok
      parameters:
        - in: query
          name: prodi
          schema:
            type: string
          required: false
          description: Kode/slug program studi, saring daftar ke satu prodi saja
          example: trpl
        - in: query
          name: angkatan
          schema:
            type: string
          required: false
          description: Tahun angkatan, saring daftar ke satu angkatan saja
          example: "2026"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyekblok:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProyekBlok'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    post:
      tags:
        - proyekblok
      summary: Buat instance proyek blok
      description: Membuat instance proyek nyata di atas satu rumpun kurikulum (lihat /kurikulum/prodi/{prodi}/rumpun) untuk satu angkatan, beserta anggota dan dosen pembimbingnya. Hanya dosen - atau admin - yang sudah login lewat WhatsAuth (lihat /whatsauth/request) yang boleh membuatnya. Kalau status dikosongkan, nilainya diisi draft.
      operationId: buatProyekBlok
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatProyekBlokRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekBlok'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Pemegang token bukan dosen (dan bukan admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Body JSON tidak valid atau validasi gagal - mis. rumpun_kode tidak ada di data kurikulum prodi itu, judul kosong, status di luar draft/berjalan/selesai, selesai_minggu lebih awal dari mulai_minggu, atau ada nim anggota yang terdaftar dua kali
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekblok/saya:
    get:
      tags:
        - proyekblok
      summary: Proyek blok milik pemegang token
      description: Mengembalikan proyek yang dibimbing kalau nomor WhatsApp di token adalah dosen yang NIP-nya sudah terisi, selain itu proyek yang diikuti sebagai anggota beserta NIM pemilik nomor. Pada peran mahasiswa, nomor WhatsApp anggota lain dikosongkan. Dosen yang NIP-nya belum diisi mendapat peran dosen dengan daftar kosong dan tanpa nip. Fungsi domain yang sama dipakai perintah WhatsApp "daftar proyek saya".
      operationId: proyekBlokSaya
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyekSaya'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekblok/{id}:
    get:
      tags:
        - proyekblok
      summary: Detail proyek blok beserta nilainya
      description: Mengembalikan satu proyek blok lengkap dengan seluruh baris penilaiannya (satu baris per mahasiswa per mata kuliah) dan rekap nilai per mahasiswa. Cukup token WhatsAuth yang masih berlaku.
      operationId: detailProyekBlok
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID proyek blok
          example: 66f0a1b2c3d4e5f678901234
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  proyek:
                    $ref: '#/components/schemas/ProyekBlok'
                  nilai:
                    type: array
                    items:
                      $ref: '#/components/schemas/PenilaianProyek'
                  rekap:
                    type: array
                    items:
                      $ref: '#/components/schemas/RekapNilai'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek blok tidak ditemukan (termasuk kalau id bukan ObjectID yang sah)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /proyekblok/{id}/nilai:
    post:
      tags:
        - proyekblok
      summary: Input atau perbarui nilai satu mahasiswa untuk satu mata kuliah
      description: >-
        Menyimpan nilai satu mahasiswa untuk satu mata kuliah di dalam proyek
        blok ini. Satu proyek menilai beberapa mata kuliah sekaligus, jadi
        kirim satu permintaan per pasangan nim dan kode_mk. Pemanggilan ulang
        dengan pasangan nim dan kode_mk yang sama memperbarui baris yang sudah
        ada, bukan menambah baris baru.


        Hanya dosen pembimbing proyek ini - NIP-nya cocok dengan dosen_nip
        proyek - atau admin yang boleh menilai. Dosen lain yang terdaftar pun
        tidak boleh menilai proyek yang bukan bimbingannya.


        nilai_akhir TIDAK diterima dari body - nilainya selalu dihitung server
        dari komponen dengan bobot tetap hasil proyek 40%, ujian 30%, kuis 15%,
        presentasi 15%. Kalau body memuat nilai_akhir, isinya diabaikan.
      operationId: inputNilaiProyekBlok
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID proyek blok
          example: 66f0a1b2c3d4e5f678901234
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputNilaiRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenilaianProyek'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Pemegang token bukan dosen pembimbing proyek ini (dan bukan admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Proyek blok tidak ditemukan (termasuk kalau id bukan ObjectID yang sah)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Body JSON tidak valid atau validasi gagal - mis. nim bukan anggota proyek ini, mata kuliah bukan bagian rumpun proyek, atau ada komponen di luar rentang 0-100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /mahasiswa/{nim}/nilai:
    get:
      tags:
        - proyekblok
      summary: Riwayat nilai satu mahasiswa
      description: Mengembalikan seluruh baris penilaian satu mahasiswa di semua proyek blok yang pernah diikutinya, beserta rekapnya. Dosen dan admin boleh melihat nilai siapa pun; mahasiswa hanya boleh melihat nilainya sendiri - kepemilikan NIM dibuktikan dari nomor WhatsApp di token yang terdaftar sebagai anggota proyek.
      operationId: nilaiMahasiswa
      parameters:
        - in: path
          name: nim
          schema:
            type: string
          required: true
          description: NIM mahasiswa
          example: "2026001"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  nim:
                    type: string
                    example: "2026001"
                  nilai:
                    type: array
                    items:
                      $ref: '#/components/schemas/PenilaianProyek'
                  rekap:
                    type: array
                    items:
                      $ref: '#/components/schemas/RekapNilai'
        '401':
          description: Header Authorization kosong, token kosong, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Mahasiswa hanya boleh melihat nilainya sendiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /v3/official/send/message/text:
    post:
      tags:
        - message
      summary: Kirim pesan teks (v3, nomor official)
      description: Mengirimkan pesan teks memakai nomor official milik user yang sedang login (token di header, bukan di body)
      operationId: sendMessageTextV3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '403':
          description: Token tidak valid atau tidak punya akses ke nomor official
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /version:
    get:
      tags:
        - version
      summary: Cek status aplikasi
      description: Mengembalikan status aplikasi dan git commit dari deployan yang sedang berjalan, dipakai untuk memastikan deployan berhasil tanpa perlu cek log server.
      operationId: getVersion
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  commit:
                    type: string
                    example: d4a105de7b3078d3c2c29121c4477ca41da7079a
  /botregister:
    post:
      tags:
        - botregister
      summary: Pendaftaran nomor bot WhatsApp atau refresh access token
      description: Mendaftarkan/memperbarui webhook satu nomor BOT WhatsApp beserta token API 30 hari. Ini bukan pendaftaran pengguna aplikasi - platform ini tidak punya pendaftaran pengguna, identitas orang datang dari WhatsAuth. Dokumennya disimpan di koleksi Mongo "bot" (nama lama "user").
      operationId: botRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebHook'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotAccount'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /device/{token}:
    get:
      tags:
        - device
      summary: Add device Whatsapp
      description: Menambahkan wa user ke server untuk dipakai oleh api dengan memasukkan code dari respon server
      operationId: getDevice
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
          description: Token yang diberikan kepada user
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid status value
  /device/status/{token}:
    get:
      tags:
        - device
      summary: Cek status pairing device
      description: Cek status koneksi device WhatsApp — TIDAK memicu permintaan pair code baru (beda dari GET /device/{token}). Catatan — bukan benar-benar read-only, kalau client belum ada di memori server, endpoint ini tetap membuat koneksi baru di background. Berguna untuk troubleshoot tanpa perlu cek log server.
      operationId: getDeviceStatus
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
          description: Token yang diberikan kepada user
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  phonenumber:
                    type: string
                    example: "6282258512828"
                  store_id_ada:
                    type: boolean
                    description: Pernah berhasil pairing (sesi tersimpan di Postgres)
                  is_connected:
                    type: boolean
                    description: Socket websocket ke server WhatsApp sedang tersambung
                  is_logged_in:
                    type: boolean
                    description: Sesi sudah lolos login penuh, siap kirim/terima pesan
        '403':
          description: Token tidak valid
  /numbers/isonwa:
    post:
      tags:
        - device
      summary: Cek apakan nomor sudah terdaftar di Whatsapp atau belum
      description: Pengecekan daftar nomor yang akan di cek apakah ada di whatsapp atau belum
      operationId: isOnWhatsApp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneList'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaList'
        '400':
          description: Invalid status value
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /v2/send/message/text:
    post:
      tags:
        - message
      summary: Kirim pesan teks
      description: Mengirimkan pesan teks kepada perorangan atau group
      operationId: sendMessageText
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '503':
