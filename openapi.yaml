      summary: Atur dosen pengampu prodi (kaprodi, untuk prodinya)
      description: >-
        Dosen pengampu prodi. Hanya kaprodi (2026-09-14; admin tidak), dan hanya
        centang prodi yang dipimpinnya yang berubah - prodi lain milik dosen itu
        tetap; menambahkan prodi di luar lingkupnya ditolak 403. Setiap kode harus
        prodi yang ada. Menentukan prodi mana yang kuis gerbang dan katalog
