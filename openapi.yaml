        dan mengubah ritme yang hanya dipakai kalender prodinya (atau belum
        dipakai kalender mana pun, draft ikut dihitung); ritme yang dipakai
        kalender prodi lain tidak bisa diubah dari satu prodi. kapasitas_sks_per_semester kosong
