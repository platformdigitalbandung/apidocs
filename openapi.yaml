  /rapor/{nim}:
    get:
      tags:
        - rapor
      summary: Rapor seluruh semester satu mahasiswa
      description: >-
        Skala huruf A >=80, B >=70, C >=60, D >=50, E <50 dengan bobot 4/3/2/1/0;
        batas C = ambang lulus 60 (D tidak lulus). Nilai mata kuliah berasal
        dari nilai akhir kelas yang sudah lengkap (sejak 2026-09-26 satu-satunya
        sumber; penilaian proyek blok dipensiunkan). Satu nilai per mata kuliah
        - kalau ada beberapa (mengulang), dipakai yang tertinggi. SKS dan semester dari koleksi matakuliah; nilai berkode yang
        tidak terpetakan ditampilkan terpisah dan tidak masuk IP. Rumpun yang
        diakui lewat RPL disetujui ditampilkan terpisah, tanpa nilai angka.
        Mahasiswa hanya boleh melihat rapornya sendiri; dosen/admin siapa pun.
      operationId: raporMahasiswa
      parameters:
        - {name: nim, in: path, required: true, schema: {type: string}, example: 2026TRPL001, description: "NIM mahasiswa di roster `mahasiswa`."}
