        dihitung di belum_dinilai. IP dari mata kuliah yang sudah dinilai.
        Didaftarkan sebelum /rapor/{nim}.
      operationId: rekapRaporSemester
      parameters:
        - {name: prodi, in: path, required: true, schema: {type: string}, example: trpl}
        - {name: angkatan, in: path, required: true, schema: {type: string}, example: "2026"}
        - {name: semester, in: path, required: true, schema: {type: integer, minimum: 1}, example: 1}
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RekapRaporSemester'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan kaprodi prodi ini atau admin. Laporan tingkat prodi hanya untuk kaprodi (prodinya sendiri) dan admin (semua prodi); dosen biasa ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Prodi tidak ada di data kurikulum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Belum ada mata kuliah semester itu, belum ada mahasiswa angkatan itu di roster, atau semester bukan angka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /rapor/{nim}:
    get:
      tags:
        - rapor
      summary: Rapor seluruh semester satu mahasiswa
      description: >-
        Skala huruf A >=80, B >=70, C >=60, D >=50, E <50 dengan bobot 4/3/2/1/0;
        batas C sama dengan ambang lulus proyek blok (D tidak lulus). Satu nilai
        per mata kuliah - kalau ada beberapa (mengulang), dipakai yang
        tertinggi. SKS dan semester dari koleksi matakuliah; nilai berkode yang
        tidak terpetakan ditampilkan terpisah dan tidak masuk IP. Rumpun yang
        diakui lewat RPL disetujui ditampilkan terpisah, tanpa nilai angka.
        Mahasiswa hanya boleh melihat rapornya sendiri; dosen/admin siapa pun.
      operationId: raporMahasiswa
      parameters:
        - {name: nim, in: path, required: true, schema: {type: string}, example: 2026TRPL001}
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rapor'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Mahasiswa melihat rapor orang lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: NIM tidak ada di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /beranda/agenda:
    get:
      tags:
        - beranda
      summary: Agenda beranda per peran (mahasiswa, dosen, kaprodi, admin)
      description: >-
        Hal yang belum dikerjakan (`sifat: perlu`) dan yang akan datang
        (`sifat: akan`) untuk setiap peran yang dipegang pemilik token. Peran dicek
        dari database, bukan dari pemilih peran di peramban: bagian yang tidak
        dipegang selalu array kosong dan tidak disebut di `peran`. Bagian yang
        disebut di `peran` tapi kosong berarti semuanya beres. Dihitung saat
        diminta dari koleksi modul lain; butir yang gagal dihitung dilewati
        (dicatat di log server) tanpa menggagalkan agenda.

        Jenis butir per peran:
        mahasiswa - kalender_belum_terbit (akan; kalender prodi, angkatan,
        dan semesternya belum terbit, jadi agenda mingguan belum dihitung),
        materi_belum_selesai, kuis_belum_lulus (minggu berjalan kalender
        terbit), proyek_kerja_menunggu, rpl_menunggu;
        dosen - email_belum_diisi, belum_pengampu (belum dicentang mengajar
        di prodi mana pun dan bukan kaprodi), forum_belum_dijawab (prodi
        mengajar), proyek_kerja_putusan, proyek_kerja_tinjauan, rpl_menunggu,
        kalender_belum_terbit (akan; prodi mengajar tanpa kalender terbit),
        rekaman_belum_terbit, materi_minggu_depan_kosong,
        kuis_minggu_depan_kosong, ujian_diawasi;
        kaprodi (per prodi yang dipimpin) - kurikulum_belum_lengkap,
        pengampu_kosong, kalender_belum_terbit, proyek_kerja_telat,
        forum_lewat_sla;
        admin - prodi_tanpa_kaprodi, rujukan_nip_lama (kaprodi masih
        memakai data lama karena belum mengisi email kampus),
        dosen_tanpa_email.


        Urutan: setiap bagian sudah diurutkan dan frontend menampilkannya apa
        adanya. Bagian kaprodi mengikuti ketergantungan pekerjaan - kurikulum,
        dosen pengampu, kalender, lalu laporan (proyek kerja, forum) - bukan
        tanda mendesak. Bagian lain: `perlu` dulu, yang mendesak di depan,
        lalu tenggat terdekat.
      operationId: agendaBeranda
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaBeranda'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Nomor belum terdaftar sebagai mahasiswa maupun dosen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /jabatan/dosen:
    get:
      tags:
        - jabatan
      summary: Daftar dosen (admin dan kaprodi)
      description: >-
        Dosen aktif, urut nama, beserta email kampus (kosong = belum diisi, belum
        bisa ditetapkan), jabatan (admin), kode prodi yang dipimpinnya sebagai
        kaprodi (termasuk rujukan NIP lama yang belum dimigrasi), dan prodi
        mengajarnya. Tanpa nomor WhatsApp dan tanpa NIP.
        Dipakai halaman Kelola Kaprodi (jabatan.html, admin) dan Dosen Pengampu
