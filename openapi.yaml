      security:
        - token:
            - write:apiKey
            - read:apiKey
  /send/message/document:
    post:
      tags:
        - message
      summary: Kirim pesan document
      description: Mengirimkan pesan document kepada perorangan atau group
      operationId: sendMessageDoc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /whatsauth/request:
    post:
      tags:
        - whatsauth
      summary: Permintaan otorisasi aplikasi
      description: Mengirimkan token otorisasi pada user
      operationId: whatsauthRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAuth'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
components:
  schemas:
    JID:
      type: object
      properties:
        User:
          type: string
          description: The user ID
        RawAgent:
          type: integer
          format: int32
          description: The raw agent
        Device:
          type: integer
          format: int32
          description: The device ID
        Integrator:
          type: integer
          format: int32
          description: The integrator ID
        Server:
          type: string
          description: The server
      required:
        - User
        - RawAgent
        - Device
        - Integrator
        - Server
    VerifiedName:
      type: object
      properties:
        Name:
          type: string
          description: The verified business name
        Certainty:
          type: string
          description: The certainty of the verification
      required:
        - Name
        - Certainty
    WaList:
      type: object
      properties:
        phonenumbers:
          type: array
          items:
            $ref: '#/components/schemas/IsOnWhatsAppResponse'
      required:
        - phonenumbers
    IsOnWhatsAppResponse:
      type: object
      properties:
        Query:
          type: string
          description: The query string used
        JID:
          $ref: '#/components/schemas/JID'
        IsIn:
          type: boolean
          description: Whether the phone is registered or not
        VerifiedName:
          $ref: '#/components/schemas/VerifiedName'
      required:
        - Query
        - JID
        - IsIn
    WebHook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.site/
            secret: 
              type: string
              example: isju8ekf9ke
            readstatusoff: 
              type: boolean
              example: false
            sendtyping: 
              type: boolean
              example: false
    BotAccount:
      type: object
      properties:
        phonenumber:
          type: string
          example: 6281111
        webhook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.com
            secret: 
              type: string
              example: isju8ekf9ke
        token:
          type: string
          example: v4.public.asoiduas
    PhoneList:
      type: object
      properties:
        phoneNumbers:
          type: array
          items:
            type: string
          description: Daftar nomor telepon
      required:
        - phoneNumbers
      example:
        phoneNumbers:
          - "08123456789"
          - "81234567890"
          - "628123456789"
    TextMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        isgroup:
          type: boolean
          example: false
        messages:
          type: string
          example: hai kak
    ImageMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64image:
          type: string
          example: iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mP8/5+hnoEIwDiqkL4KAcT9GO0U4BxoAAAAAElFTkSuQmCC
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    DocumentMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64doc:
          type: string
          example: 
        filename:
          type: string
          example: filename.pdf
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    WhatsAuth:
      type: object
      properties:
        uuid:
          type: string
          example: isodjaoidsjaoid
        phonenumber:
          type: string
          example: 6281212
        delay:
          type: integer
          example: 2
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
          example: Nomor tidak terdaftar di whatsapp
    TextMessageResponse:
      type: object
      properties:
        Timestamp:
          type: string
          example: 2024-08-02T06:34:58Z
        ID:
          type: string
          example: 3EB0B5C35133EC28D4EA1B
        ServerID:
          type: integer
          example: 0
        DebugTimings:
                    type: object
                    properties:
                      Queue:
                        type: integer
                        example: 480
                      Marshal:
                        type: integer
                        example: 11410
                      GetParticipants:
                        type: integer
                        example: 0
                      GetDevices:
                        type: integer
                        example: 227151959
                      GroupEncrypt:
                        type: integer
                        example: 0
                      PeerEncrypt:
                        type: integer
                        example: 31024016
                      Send:
                        type: integer
                        example: 98170
                      Resp:
                        type: integer
                        example: 234692326
                      Retry:
                        type: integer
                        example: 0
    DeviceResponse:
      type: object
      properties:
        phonenumber:
          type: string
          example: 628888888
        status:
          type: boolean
          example: false
        code:
          type: string
          example: RGCF-L1LH
        message:
          type: string
          example: Pair Code Device
    DetailError:
      description: Bentuk error khusus modul Portal Tugas & Kurikulum (beda dari ErrorMessage yang dipakai modul WhatsAuth)
      type: object
      properties:
        detail:
          type: string
          example: Tugas tidak ditemukan
    TugasRingkas:
      type: object
      properties:
        id:
          type: string
        judul:
          type: string
        deskripsi:
          type: string
        prodi_kode:
          type: string
          description: Prodi pemilik tugas (sejak 2026-09-15). Kosong untuk tugas lama yang belum diberi prodi.
          example: pai
        n_kiriman:
          type: integer
        sudah_kirim:
          type: boolean
          description: >-
            Hanya untuk token mahasiswa di roster (dicocokkan lewat NIM dari nomor pada token):
            true bila ia sudah pernah mengirim jawaban untuk tugas ini. Tidak dikirim untuk dosen/admin.
        kirim_terakhir:
          type: string
          format: date-time
          description: Waktu kiriman terakhir mahasiswa pemegang token untuk tugas ini; hanya ada bila sudah_kirim true.
    BuatTugasRequest:
      type: object
      properties:
        judul:
          type: string
          example: Tugas Besar Basis Data
        deskripsi:
          type: string
          example: Kerjakan rancangan ERD dan normalisasi
        prodi_kode:
          type: string
          description: Prodi tugas; harus prodi tempat pembuat mengajar atau yang dipimpinnya
          example: trpl
      required:
        - judul
        - prodi_kode
    PerKiriman:
      type: object
      properties:
        id:
          type: string
        nama:
          type: string
        nim:
          type: string
        filename:
          type: string
        max_score:
          type: number
          nullable: true
        pasangan_id:
          type: string
          nullable: true
        pasangan_nama:
          type: string
        band:
          type: string
    Pasangan:
      type: object
      properties:
        a_id:
          type: string
        a_nama:
          type: string
        b_id:
          type: string
        b_nama:
          type: string
        score:
          type: number
        band:
          type: string
    LaporanKemiripan:
      type: object
      properties:
        tugas_id:
          type: string
        disclaimer:
          type: string
          example: "Skor adalah kemiripan tekstual, bukan vonis plagiat. Keputusan akhir tetap pada dosen setelah pemeriksaan manual."
        per_kiriman:
          type: array
          items:
            $ref: '#/components/schemas/PerKiriman'
        pasangan:
          type: array
          items:
            $ref: '#/components/schemas/Pasangan'
    BebanMingguan:
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        minggu:
          type: integer
          description: Nomor minggu dalam kalender semester
          example: 3
        tanggal_mulai:
          type: string
          format: date
          example: "2026-09-07"
        menit_total:
          type: integer
          description: Total menit instruksional terjadwal pada minggu itu
          example: 1440
        sks:
          type: number
          format: float
          description: menit_total dibagi 85 menit per SKS, dibulatkan satu desimal
          example: 16.9
        kapasitas_sks:
          type: number
          format: float
          description: Kapasitas SKS per semester menurut ritme mingguan
          example: 16.9
        hari:
          type: array
          items:
            type: string
          description: Hari yang benar-benar berjadwal; hari bebas (0 menit) tidak disebut
          example: [Senin, Selasa, Rabu, Kamis, Jumat]
        catatan:
          type: string
          description: Terisi hanya kalau ada hari di luar ritme sehingga menitnya diperkirakan dari selisih jam
    CakupanCPL:
      type: object
      properties:
        cpl_kode:
          type: string
          example: CPL02
        deskripsi:
          type: string
          description: Rumusan CPL-nya, kalau sudah diisi prodi
        domain:
          type: string
          example: Pengetahuan
        tercapai:
          type: boolean
          example: true
        rumpun_bukti:
          type: array
          items:
            type: string
          description: Rumpun yang sudah punya nilai lulus DAN menyentuh CPL ini; kosong berarti belum tercapai
          example: [R1]
        status:
          type: string
          enum: [tercapai, belum, ditopang-jalur-lain]
          description: >-
            Memisahkan "belum tercapai" dari "di luar jangkauan perhitungan ini".
            `belum` = dipetakan ke rumpun tapi rumpunnya belum punya nilai lulus.
            `ditopang-jalur-lain` = tidak dipetakan ke rumpun mana pun, jadi
            berapa pun nilai yang masuk ia tidak akan pernah tercapai lewat jalur
            ini - buktinya ada di jalur kontinu/KKN/Magang/TA (lihat penopang_lain).
          example: tercapai
        penopang_lain:
          type: array
          items:
            type: string
          description: Diisi untuk CPL yang ditopang di luar penilaian proyek blok
          example: [jalur kontinu, KKN Tematik]
        rumpun_bukti_rpl:
          type: array
          items:
            type: string
          description: >-
            Rumpun yang diakui lewat pengajuan RPL yang DISETUJUI dan menyentuh
            CPL ini. Sengaja dipisah dari rumpun_bukti (nilai proyek blok) karena
            RPL adalah tinjauan dokumen pengalaman kerja lampau, bukan artefak
            yang dinilai - laporan akreditasi harus tetap bisa menjawab CPL ini
            terbukti dari mana.
          example: [R11]
    HasilAutograder:
      type: object
      properties:
        id: {type: string}
        workflow_run_id: {type: integer, format: int64, description: Unik - webhook yang dikirim ulang tidak menggandakan dokumen}
        nim: {type: string, description: Kosong kalau username GitHub belum ada di roster}
        github_username: {type: string}
        repo: {type: string}
        pr_nomor: {type: integer}
        commit_sha: {type: string}
        kesimpulan: {type: string, description: conclusion workflow run}
        versi_binari: {type: string, example: v0.2.0}
        go_versi: {type: string}
        tes_dosen_lulus: {type: integer, description: Ukuran kebenaran - hanya tes dari folder tes dosen}
        tes_dosen_total: {type: integer}
        tes_dosen_gagal:
          type: array
          items: {type: string}
        tes_semua_lulus: {type: integer, description: Termasuk tes buatan mahasiswa}
        tes_semua_total: {type: integer}
        build_gagal: {type: boolean}
        persen_baris: {type: number, description: Coverage pernyataan Go dari semua tes - bukan ukuran kebenaran}
        terisolasi: {type: boolean, description: go test dijalankan di kontainer Docker}
        mulai: {type: string, format: date-time}
        selesai: {type: string, format: date-time}
        diterima: {type: string, format: date-time}
    HasilAutograderBerskor:
      allOf:
        - $ref: '#/components/schemas/HasilAutograder'
        - type: object
          properties:
            skor:
              type: number
              description: >-
                0-100, dihitung saat dibaca dari bobot yang berlaku - TIDAK
                disimpan. Build gagal selalu 0. Kalau soal tidak punya tes
                dosen sama sekali, porsi tes dialihkan ke coverage.
              example: 59
    BobotAutograder:
      type: object
      description: >-
        Pembagian bobot di dalam komponen autograder, satu pengaturan untuk
        seluruh platform. Bukan besar komponennya terhadap nilai rumpun - itu
        15% menurut kurikulum dan tidak diatur di sini.
      properties:
        id: {type: string}
        tes_dosen: {type: number, description: Porsi dari rasio tes dosen yang lulus, 0..1, example: 0.7}
        coverage: {type: number, description: Porsi dari persen baris ter-cover, 0..1, example: 0.3}
        diperbarui: {type: string, format: date-time}
        diubah_oleh: {type: string, description: Email kampus dosen yang terakhir mengubah - snapshot pelaku}
    BobotAutograderRequest:
      type: object
      required: [tes_dosen, coverage]
      properties:
        tes_dosen: {type: number, example: 0.7}
        coverage: {type: number, example: 0.3}
    WebhookWorkflowRun:
      type: object
      description: Bagian payload webhook GitHub workflow_run yang dibaca backend
      properties:
        action: {type: string, example: completed}
        workflow_run:
          type: object
          properties:
            id: {type: integer, format: int64}
            path: {type: string, example: .github/workflows/autograder.yml}
            event: {type: string, example: pull_request_target}
            conclusion: {type: string}
            actor:
              type: object
              properties:
                login: {type: string}
        repository:
          type: object
          properties:
            full_name: {type: string}
            owner:
              type: object
              properties:
                login: {type: string, example: platformdigitalbandung}
    RekamanSesi:
      type: object
      properties:
        id: {type: string}
        kalender_id: {type: string}
        sesi_index: {type: integer, description: Posisi sesi di larik kalender terbit}
        youtube_id: {type: string, example: dQw4w9WgXcQ}
        judul: {type: string}
        diunggah_oleh: {type: string, description: Email kampus dosen}
        diterbitkan_pada: {type: string, format: date-time}
        tenggat: {type: string, format: date-time, description: Tengah malam WIB setelah tanggal sesi}
        terlambat: {type: boolean}
    TerbitkanRekamanRequest:
      type: object
      required: [kalender_id, sesi_index, url_video]
      properties:
        kalender_id: {type: string}
        sesi_index: {type: integer}
