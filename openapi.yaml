  /progresmateri:
    post:
      tags:
        - progresmateri
      summary: Catat progres satu materi asinkron
      description: >-
        Dipanggil player video (YouTube Player API), pembaca materi
        (scroll-tracking), atau pembaca berkas PDF (per halaman) secara berkala. NIM tidak dikirim - diambil dari
        roster lewat nomor WhatsApp pada token. Upsert per (nim, rumpun_kode,
        minggu, materi_id), dan persen_selesai yang tersimpan TIDAK PERNAH
        TURUN - memutar mundur untuk menonton ulang tidak boleh menghapus bukti
        bahwa materinya pernah ditonton sampai jauh. Sejak katalog materi ada
        (2026-09-13), materi_id WAJIB berupa id materi di katalog, dan materi
        itu harus milik prodi mahasiswa serta rumpun_kode dan minggu yang
        dilaporkan - tanpa itu progres bisa dilaporkan atas materi pilihan
        sendiri. Untuk materi berkas (sejak 2026-09-14) halaman_terakhir tidak
        boleh melebihi jumlah halaman berkas, dan persen_selesai dipangkas ke
        halaman terjauh dibagi jumlah halaman.
      operationId: catatProgresMateri
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatatProgresRequest'
      responses:
        '200':
          description: successful operation — persen_selesai berisi nilai yang tersimpan, bukan yang dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresMateri'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Nomor pada token belum terdaftar sebagai mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: >-
            Validasi gagal - rumpun_kode/materi_id kosong, materi_id lebih dari
            200 karakter, minggu di luar 1-52, persen_selesai di luar 0-100,
            halaman_terakhir negatif atau melebihi jumlah halaman berkas, materi_id tidak menunjuk materi di katalog,
            atau materinya milik prodi/rumpun/minggu lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
