      description: >-
        Admin: semua dosen, aktif dan nonaktif. Kaprodi: dosen aktif yang mengajar
        di prodi yang dipimpinnya. Berbeda dari `GET /jabatan/dosen`, balasan ini
        memuat nomor WhatsApp dan status kata sandi (alat pengelola). `admin` dan
        `lingkup` menyebut hak pemanggil (dari basis data).
