          in: path
          required: true
          schema:
            type: string
          example: "2026001"
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BebanMingguan'
        '401':
          description: Token tidak valid atau tidak dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Mahasiswa mencoba melihat beban belajar orang lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: NIM tidak ada di roster mahasiswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kalender semester belum terbit, atau tanggal hari ini di luar rentang kalender
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kuisgerbang:
    get:
      tags:
        - kuisgerbang
      summary: Daftar kuis beserta kunci jawaban (dosen, prodi tempat ia mengajar atau kelas yang diajarnya)
      description: >-
        Untuk menyusun dan menyunting kuis. Berbeda dari jalur mahasiswa, balasan
        ini memuat `indeks_benar` dan jumlah mahasiswa yang sudah mengerjakan.
      operationId: daftarKuisGerbang
      parameters:
        - {in: query, name: prodi, required: false, schema: {type: string}, example: pai, description: "Kode program studi (huruf kecil), mis. `trpl`, `bisdig`, `pai`, `hes`; daftar dari `GET /kurikulum/prodi`."}
        - {in: query, name: rumpun, required: false, schema: {type: string}, example: R1, description: "Kode rumpun (blok mata kuliah), mis. `R1`."}
      responses:
        '200':
          description: Daftar kuis, urut prodi, rumpun, minggu
          content:
            application/json:
              schema:
                type: object
                properties:
                  kuis:
                    type: array
                    items:
                      $ref: '#/components/schemas/KuisGerbangSunting'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    post:
      tags:
        - kuisgerbang
      summary: Buat atau ganti kuis satu prodi + rumpun (+ mata kuliah) + minggu (pengajar kelas itu / kaprodinya)
      description: >-
        Satu kuis per prodi + rumpun + minggu, atau per prodi + rumpun + `mk_kode` +
        minggu untuk kelas mata kuliah lepas (sejak 2026-09-25); mengirim kunci yang
        sama mengganti kuisnya. Hanya pengajar kelas rumpun itu (kelas mata kuliah
        lepas: hanya mata kuliahnya) atau kaprodinya; `mk_kode` harus mata kuliah
        rumpun itu. 1-50 soal, tiap soal 2-6 pilihan, `indeks_benar` (mulai 0) wajib
        menunjuk salah satu pilihan, ambang 0-100 (0 = bawaan 60). Rumpun harus ada
        di kurikulum prodi itu. Kuis yang sudah dikerjakan mahasiswa tidak bisa
        diganti (422), karena skor tercatat dihitung dari soal lama.
      operationId: simpanKuisGerbang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KuisGerbangSunting'
      responses:
        '200':
          description: Kuis tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KuisGerbangSunting'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Susunan kuis tidak sah, rumpun tidak ada di prodi itu, atau kuis sudah dikerjakan mahasiswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kuisgerbang/{id}:
    delete:
      tags:
        - kuisgerbang
      summary: Hapus kuis (dosen/kaprodi untuk prodinya)
      description: >-
        Kuis yang sudah dikerjakan butuh `?konfirmasi=hapus`. Jawaban mahasiswa
        tidak ikut dihapus supaya riwayat skor tetap bisa diaudit.
      operationId: hapusKuisGerbang
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: ObjectID kuis}
        - {in: query, name: konfirmasi, required: false, schema: {type: string, enum: [hapus]}, description: "Wajib `hapus` bila kuis sudah dikerjakan mahasiswa; tanpa itu dijawab 422."}
      responses:
        '200':
          description: Terhapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, example: true}
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kuis tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kuis sudah dikerjakan dan belum dikonfirmasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kuisgerbang/{id}/submit:
    post:
      tags:
        - kuisgerbang
      summary: Submit jawaban kuis
      description: >-
        Backend yang menghitung skor dan lulus. NIM diambil dari roster `mahasiswa`
        lewat nomor WhatsApp pada token, bukan dari body. Mengirim ulang memperbarui
        baris yang sama. Kuis milik prodi lain ditolak 403.
      operationId: submitKuisGerbang
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID kuis
      requestBody:
        required: true
        content:
          application/json:
