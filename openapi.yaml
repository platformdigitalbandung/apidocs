  /sesiujian:
    get:
      tags:
        - sesiujian
      summary: Daftar sesi ujian untuk pengawas
      description: >-
        Ditambahkan di luar tiga rute rencana modul: ketiga rute lain butuh id
        sesi, dan pengawas bisa jadi dosen yang berbeda dari yang menjadwalkan
        sehingga tidak pernah melihat id itu. pengawas=saya diterjemahkan jadi
        email kampus pemegang token (plus NIP lamanya selama sesi lama belum
        dimigrasi). Diurutkan menurut tanggal_jam.
      operationId: daftarSesiUjian
      parameters:
        - in: query
          description: Kode rumpun (blok mata kuliah), mis. `R1`; daftar dari `GET /kurikulum/prodi/{prodi}/rumpun`.
          name: rumpun
          schema:
            type: string
          required: false
          example: R3
        - in: query
          name: pengawas
          schema:
            type: string
          required: false
          description: Email kampus pengawas, atau "saya" untuk pemegang token
          example: saya
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  sesi:
                    type: array
                    items:
                      $ref: '#/components/schemas/SesiUjian'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen atau admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: pengawas=saya tetapi email kampus pemegang token belum diisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    post:
      tags:
        - sesiujian
      summary: Jadwalkan sesi ujian
      description: >-
        Hanya dosen atau admin. `tanggal_jam` dikirim sebagai teks RFC3339 beserta zona
        waktu dan diurai eksplisit di server.
      operationId: jadwalkanSesiUjian
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesiUjianRequest'
      responses:
        '201':
          description: Sesi terjadwal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesiUjian'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen maupun admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Body tidak sah, jenis tidak dikenal, atau tanggal_jam bukan RFC3339
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
