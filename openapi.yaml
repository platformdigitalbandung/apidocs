                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Email kosong, tidak sah, bukan @digitalbdg.ac.id, sudah dipakai dosen lain, atau nomor bukan dosen aktif
          content:
