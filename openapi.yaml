                    type: integer
                    description: Jumlah catatan progres yang kini kehilangan judul materinya
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Materi tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Materi sudah punya progres dan konfirmasi=hapus belum diberikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /materi/{id}/berkas:
    post:
      tags:
        - materi
      summary: Unggah berkas PDF ke satu materi
      description: >-
        Multipart/form-data: berkas PDF pada field `berkas`. Jumlah halaman
        (penyebut progres) DIHITUNG SERVER dari berkasnya sejak 2026-09-14;
        field `halaman` kiriman peramban dosen hanya dipakai kalau server gagal
        mengurai PDF-nya. Hanya admin, atau dosen/kaprodi untuk prodi materi
        itu (prodi tempat ia mengajar). Hanya PDF,
        diperiksa dari magic bytes `%PDF-` dan bukan dari nama berkasnya, dan
        maksimal 20 MiB. Berkasnya naik ke repo storage GitHub privat lewat
        GHPAT; yang masuk basis data hanya referensi repo/path/sha
        (pdb/README.md poin 8), dan nama berkas dari dosen disanitasi dulu
        sebelum dipakai jadi bagian path. Materinya sekaligus disetel berjenis
        `berkas`.
      operationId: unggahBerkasMateri
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - berkas
              properties:
                berkas:
                  type: string
                  format: binary
                  description: Berkas PDF, maksimal 20 MiB
                halaman:
                  type: integer
                  minimum: 1
                  description: >-
                    Opsional. Jumlah halaman hitungan peramban dosen, dipakai
                    hanya kalau server tidak bisa menghitung dari berkasnya.
                    Boleh juga dikirim sebagai query string.
                  example: 24
      responses:
        '200':
          description: Berkas tersimpan - balasannya dokumen materi terbaru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materi'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan dosen, atau dosen untuk prodi tempat ia tidak mengajar (admin tidak punya hak lintas prodi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Materi tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: >-
            Berkas tidak dikirim atau tidak terbaca, bukan PDF, namanya kosong,
            ukurannya lebih dari 20 MiB, atau halaman bukan bilangan lebih besar
            dari 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '502':
          description: Gagal mengunggah ke repo storage GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    get:
      tags:
        - materi
      summary: Ambil berkas PDF satu materi
      description: >-
        Butuh token WhatsAuth apa pun, sama seperti daftar katalog - mahasiswa di
        roster maupun dosen/admin. Balasannya JSON dengan isi berkas dalam
        base64, BUKAN biner: repo storage-nya privat sehingga peramban tidak bisa
        mengambil berkasnya langsung dari GitHub, dan seluruh pemanggilan REST
        frontend wajib lewat crootjs yang hanya mengurai JSON (pdb/README.md
        bagian Frontend).
      operationId: ambilBerkasMateri
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BerkasMateri'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Materi milik prodi lain, atau pembaca bukan dosen/admin/mahasiswa di roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Materi tidak ada, bukan jenis berkas, atau belum punya berkas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '502':
          description: Gagal membaca berkas dari repo storage GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /progresmateri:
    post:
      tags:
        - progresmateri
      summary: Catat progres satu materi asinkron
      description: >-
        Dipanggil player video (YouTube Player API), pembaca materi
        (scroll-tracking), atau pembaca berkas PDF (per halaman) secara berkala. NIM tidak dikirim - diambil dari
        roster lewat nomor WhatsApp pada token. Upsert per (nim, rumpun_kode,
        minggu, materi_id), dan persen_selesai yang tersimpan TIDAK PERNAH
        TURUN - memutar mundur untuk menonton ulang tidak boleh menghapus bukti
        bahwa materinya pernah ditonton sampai jauh. Sejak katalog materi ada
        (2026-09-13), materi_id WAJIB berupa id materi di katalog, dan materi
        itu harus milik prodi mahasiswa serta rumpun_kode dan minggu yang
        dilaporkan - tanpa itu progres bisa dilaporkan atas materi pilihan
        sendiri. Untuk materi berkas (sejak 2026-09-14) halaman_terakhir tidak
        boleh melebihi jumlah halaman berkas, dan persen_selesai dipangkas ke
        halaman terjauh dibagi jumlah halaman.
      operationId: catatProgresMateri
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatatProgresRequest'
      responses:
        '200':
          description: successful operation — persen_selesai berisi nilai yang tersimpan, bukan yang dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresMateri'
        '401':
          description: Token WhatsAuth tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
