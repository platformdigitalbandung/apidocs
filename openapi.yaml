      description: Upsert berdasarkan NIM. Ini bukan pendaftaran pengguna - mahasiswa tidak mendaftar sendiri, pengelola prodi yang mengisi. Nomor WhatsApp di sini yang menghubungkan identitas WhatsAuth ke identitas akademik, dan koleksi inilah sumber identitas yang dipakai modul dasbor, blok/proyek, serta proyek kerja.
      operationId: simpanMahasiswa
      requestBody:
        content:
