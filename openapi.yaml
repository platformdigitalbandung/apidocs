          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: >-
            Validasi gagal - field wajib kosong, minggu di luar 1-52, jenis tak
            dikenal, youtube_id bukan video YouTube yang sah, isi bacaan kosong,
            atau rumpun tidak ada pada prodi itu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
