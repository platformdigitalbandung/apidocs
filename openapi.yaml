        Kelas yang sudah punya tugas atau nilai butuh `?konfirmasi=hapus`; tugas dan nilainya tidak
        ikut terhapus. Kelas otomatis yang dihapus tidak dibuat ulang dengan sendirinya (hanya lewat
        `POST /kelas/otomatis`).
      operationId: hapusKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
        - {in: query, name: konfirmasi, required: false, schema: {type: string, enum: [hapus]}, description: "Wajib `hapus` kalau kelas sudah punya tugas atau nilai"}
      responses:
        '200':
          description: Terhapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  tugas_tertinggal: {type: integer}
                  nilai_tertinggal: {type: integer}
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan kaprodi prodi kelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Kelas sudah punya tugas atau nilai dan konfirmasi belum diberikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kelas/{id}/pengumuman:
    get:
      tags:
        - kelas
      summary: Pengumuman kelas (anggota kelas)
      description: 50 pengumuman terbaru di Beranda kelas, terbaru dulu (sejak 2026-09-25, tahap 3).
      operationId: daftarPengumumanKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  pengumuman:
                    type: array
                    items:
                      $ref: '#/components/schemas/PengumumanKelas'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan anggota kelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
    post:
      tags:
        - kelas
      summary: Buat pengumuman kelas (pengajar kelas / kaprodinya)
      description: >-
        Isi 1-3000 karakter. `kirim_grup: true` juga mengirimnya lewat bot ke grup WhatsApp kelas
        (satu pesan per kelas). Pengumuman tetap tersimpan walau pengiriman ke grup gagal; hasilnya
        di `grup`: `terkirim`, kosong (tidak diminta), atau keterangan kegagalan (kelas belum punya
        grup, bot tidak tersambung).
      operationId: buatPengumumanKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PengumumanRequest'
      responses:
        '201':
          description: Pengumuman tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  pengumuman:
                    $ref: '#/components/schemas/PengumumanKelas'
                  grup:
                    type: string
                    example: terkirim
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan pengajar kelas maupun kaprodinya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Isi kosong atau lebih dari 3000 karakter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kelas/{id}/pengumuman/{pid}:
    delete:
      tags:
        - kelas
      summary: Hapus pengumuman kelas (pengajar kelas / kaprodinya)
      description: Pesan yang sudah terkirim ke grup WhatsApp tidak ikut ditarik.
      operationId: hapusPengumumanKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
        - {in: path, name: pid, required: true, schema: {type: string}, description: "Id pengumuman dari `GET /kelas/{id}/pengumuman`"}
      responses:
        '200':
          description: Terhapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan pengajar kelas maupun kaprodinya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas atau pengumuman tidak ditemukan (termasuk pengumuman kelas lain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kelas/{id}/isi:
    get:
      tags:
        - kelas
      summary: Isi kelas per minggu - materi, kuis, tugas (anggota kelas)
      description: >-
        Materi dan kuis gerbang rumpun kelas (kelas mata kuliah lepas: hanya yang ber-`mk_kode` mata
        kuliahnya), dan tugas kelas, dikelompokkan per minggu kalender. Peserta menerima
        status tugas dan hasil kuisnya sendiri; pengajar menerima jumlah yang sudah menyerahkan/dinilai.
      operationId: isiKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsiKelas'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan anggota kelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kelas/{id}/tugas:
    post:
      tags:
        - kelas
      summary: Buat tugas kelas (pengajar kelas / kaprodinya)
      description: >-
        Tugas hanya untuk peserta kelas ini. Tenggat opsional (RFC3339, atau `YYYY-MM-DDTHH:MM` yang
        dibaca WIB); kiriman sesudahnya tetap diterima dan ditandai terlambat. Nilai maksimal bawaan
        100. Lampiran soal menyusul lewat `POST /tugas/{id}/lampiran`.
      operationId: buatTugasKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatTugasKelasRequest'
      responses:
        '201':
          description: Tugas dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tugas'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan pengajar kelas maupun kaprodinya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Judul kosong, tenggat tidak terbaca, nilai maksimal di luar 1-1000, atau minggu di luar 0-52
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kelas/{id}/bobot:
    put:
      tags:
        - kelas
      summary: Atur komponen dan bobot nilai kelas (pengajar kelas / kaprodinya)
      description: >-
        1-10 komponen, kunci unik `[a-z0-9_]`, jenis `tugas` (rata-rata tugas kelas), `kuis` (rata-rata
        kuis gerbang kelas), atau `manual` (diisi pengajar); `tugas` dan `kuis` masing-masing paling
        banyak satu; tiap bobot > 0 dan jumlahnya tepat 100. Bawaan kelas rumpun: hasil proyek 40,
        ujian 30, kuis 15, presentasi 15; kelas mata kuliah lepas: tugas 40, kuis 20, ujian 40.
      operationId: bobotKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BobotKelasRequest'
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  bobot:
                    type: array
                    items:
                      $ref: '#/components/schemas/KomponenBobot'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan pengajar kelas maupun kaprodinya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Bobot tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kelas/{id}/nilai:
    get:
      tags:
        - kelas
      summary: Buku nilai kelas
      description: >-
        Pengajar, kaprodi, dan admin melihat semua peserta; peserta hanya barisnya sendiri (tanpa
        catatan pengajar). Tugas dihitung dari kiriman yang sudah dikembalikan (belum menyerahkan
        padahal tenggat lewat = 0); kuis dari skor kuis gerbang (minggu yang sudah lewat tanpa
        mengerjakan = 0). Nilai akhir hanya ada kalau semua komponen punya nilai, dan masuk rapor untuk
        setiap mata kuliah kelas itu.
      operationId: nilaiKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuNilaiKelas'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan anggota kelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
  /kelas/{id}/nilai/{nim}:
    put:
      tags:
        - kelas
      summary: Simpan nilai komponen manual satu peserta (pengajar kelas / kaprodinya)
      description: >-
        Hanya komponen berjenis `manual`; nilai 0-100, `null` menghapus nilai komponen itu. NIM harus
        peserta kelas.
      operationId: simpanNilaiKelas
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}, description: "Id kelas (ObjectID) dari `GET /kelas/saya` atau `GET /kelas`."}
        - {in: path, name: nim, required: true, schema: {type: string}, description: NIM peserta}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NilaiManualRequest'
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NilaiKelas'
        '401':
          description: Tanpa token, atau token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '403':
          description: Bukan pengajar kelas maupun kaprodinya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Kelas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Komponen bukan manual, nilai di luar 0-100, atau NIM bukan peserta kelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - whatsauthToken: []
components:
  schemas:
    JID:
      type: object
      properties:
        User:
          type: string
          description: The user ID
        RawAgent:
          type: integer
          format: int32
          description: The raw agent
        Device:
          type: integer
          format: int32
          description: The device ID
        Integrator:
          type: integer
          format: int32
          description: The integrator ID
        Server:
          type: string
          description: The server
      required:
        - User
        - RawAgent
        - Device
        - Integrator
        - Server
    VerifiedName:
      type: object
      properties:
        Name:
          type: string
          description: The verified business name
        Certainty:
          type: string
          description: The certainty of the verification
      required:
        - Name
        - Certainty
    WaList:
      type: object
      properties:
        phonenumbers:
          type: array
          items:
            $ref: '#/components/schemas/IsOnWhatsAppResponse'
      required:
        - phonenumbers
    IsOnWhatsAppResponse:
      type: object
      properties:
        Query:
          type: string
          description: The query string used
        JID:
          $ref: '#/components/schemas/JID'
        IsIn:
          type: boolean
          description: Whether the phone is registered or not
        VerifiedName:
          $ref: '#/components/schemas/VerifiedName'
      required:
        - Query
        - JID
        - IsIn
    WebHook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.site/
            secret: 
              type: string
              example: isju8ekf9ke
            readstatusoff: 
              type: boolean
              example: false
            sendtyping: 
              type: boolean
              example: false
    BotAccount:
      type: object
      properties:
        phonenumber:
          type: string
          example: 6281111
        webhook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.com
            secret: 
              type: string
              example: isju8ekf9ke
        token:
          type: string
          example: v4.public.asoiduas
    PhoneList:
      type: object
      properties:
        phoneNumbers:
          type: array
          items:
            type: string
          description: Daftar nomor telepon
      required:
        - phoneNumbers
      example:
        phoneNumbers:
          - "08123456789"
          - "81234567890"
          - "628123456789"
    TextMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        isgroup:
          type: boolean
          example: false
        messages:
          type: string
          example: hai kak
    ImageMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64image:
          type: string
          example: iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mP8/5+hnoEIwDiqkL4KAcT9GO0U4BxoAAAAAElFTkSuQmCC
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    DocumentMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64doc:
          type: string
          example: 
        filename:
          type: string
          example: filename.pdf
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    WhatsAuth:
      type: object
      properties:
        uuid:
          type: string
          example: isodjaoidsjaoid
        phonenumber:
          type: string
          example: 6281212
        delay:
          type: integer
          example: 2
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
          example: Nomor tidak terdaftar di whatsapp
    TextMessageResponse:
      type: object
      properties:
        Timestamp:
          type: string
          example: 2024-08-02T06:34:58Z
        ID:
          type: string
          example: 3EB0B5C35133EC28D4EA1B
        ServerID:
          type: integer
          example: 0
        DebugTimings:
                    type: object
                    properties:
                      Queue:
                        type: integer
                        example: 480
                      Marshal:
                        type: integer
                        example: 11410
                      GetParticipants:
                        type: integer
                        example: 0
                      GetDevices:
                        type: integer
                        example: 227151959
                      GroupEncrypt:
                        type: integer
                        example: 0
                      PeerEncrypt:
                        type: integer
                        example: 31024016
                      Send:
                        type: integer
                        example: 98170
                      Resp:
                        type: integer
                        example: 234692326
                      Retry:
                        type: integer
                        example: 0
    DeviceResponse:
      type: object
      properties:
        phonenumber:
          type: string
          example: 628888888
        status:
          type: boolean
          example: false
        code:
          type: string
          example: RGCF-L1LH
        message:
          type: string
          example: Pair Code Device
    OTPLoginRequest:
      type: object
      required: [phonenumber, otp]
      properties:
        phonenumber:
          type: string
          example: '081234567890'
        otp:
          type: string
          example: '042517'
    LoginInfo:
      description: Token login WhatsAuth, bentuk yang sama dengan pesan WebSocket `/ws/whatsauth/public`
      type: object
      properties:
        phone:
          type: string
          example: '6281234567890'
        alias:
          type: string
        login:
          type: string
          description: Token PASETO v4.public, berlaku 18 jam
    DetailError:
      description: Bentuk error khusus modul Portal Tugas & Kurikulum (beda dari ErrorMessage yang dipakai modul WhatsAuth)
      type: object
      properties:
        detail:
          type: string
          example: Tugas tidak ditemukan
    Tugas:
      description: Dokumen tugas. Tugas kelas punya `kelas_id`; tugas prodi lama tidak.
      type: object
      properties:
        id: {type: string}
        judul: {type: string, example: Analisis pesaing}
        deskripsi: {type: string}
        prodi_kode: {type: string, example: trpl}
        kelas_id: {type: string}
        minggu: {type: integer, description: Minggu kalender kelas; 0/tidak ada = tidak disebut}
        tenggat: {type: string, format: date-time}
        nilai_maks: {type: number, description: Skala nilai tugas (bawaan 100)}
        lampiran_nama: {type: string, description: "Nama lampiran soal; unduh lewat GET /tugas/{id}/lampiran"}
        dibuat_oleh: {type: string, description: Email kampus pembuat}
        dibuat: {type: string, format: date-time}
    TugasDetail:
      description: Balasan GET /tugas/{id}.
      type: object
      properties:
        id: {type: string}
        judul: {type: string}
        deskripsi: {type: string}
        prodi_kode: {type: string}
        kelas_id: {type: string, description: Hanya tugas kelas}
        kelas_nama: {type: string, description: Hanya tugas kelas}
        minggu: {type: integer}
        tenggat: {type: string, format: date-time, nullable: true}
        nilai_maks: {type: number}
        lampiran_nama: {type: string}
        kiriman_saya:
          type: object
          description: Hanya untuk mahasiswa yang sudah mengirim
          properties:
            dikirim: {type: string, format: date-time}
            filename: {type: string}
            terlambat: {type: boolean}
            jumlah_kirim: {type: integer}
            dikembalikan: {type: boolean}
            nilai: {type: number, nullable: true, description: Hanya setelah dikembalikan}
            komentar: {type: string, description: Hanya setelah dikembalikan}
    BuatTugasKelasRequest:
      type: object
      required: [judul]
      properties:
        judul: {type: string, maxLength: 200, example: Analisis pesaing}
        deskripsi: {type: string, maxLength: 5000, example: Bandingkan tiga pesaing dalam tabel.}
        minggu: {type: integer, description: "Minggu kalender kelas (opsional)", example: 3}
        tenggat: {type: string, description: "RFC3339, atau YYYY-MM-DDTHH:MM (WIB); kosong = tanpa tenggat", example: "2026-12-01T23:59"}
        nilai_maks: {type: number, description: "1-1000; 0/kosong = 100", example: 100}
    NilaiKirimanRequest:
      type: object
      properties:
        nilai: {type: number, nullable: true, description: "0 sampai nilai maksimal tugas; null menghapus nilai"}
        komentar: {type: string, maxLength: 3000}
        kembalikan: {type: boolean, description: "true = nilai dan komentar terlihat mahasiswa dan masuk buku nilai"}
    KirimanPeserta:
      description: Kiriman terakhir satu peserta untuk satu tugas; tanpa kiriman_id = belum menyerahkan.
      type: object
      properties:
        nim: {type: string}
        nama: {type: string}
        kiriman_id: {type: string}
        filename: {type: string}
        dikirim: {type: string, format: date-time}
        jumlah_kirim: {type: integer}
        terlambat: {type: boolean}
        nilai: {type: number, nullable: true}
        komentar: {type: string}
        dikembalikan: {type: boolean}
        ada_berkas: {type: boolean, description: Berkas asli tersimpan di repo storage}
    KomponenBobot:
      type: object
      required: [kunci, nama, jenis, bobot]
      properties:
        kunci: {type: string, pattern: '^[a-z0-9_]+$', example: ujian}
        nama: {type: string, example: Ujian}
        jenis: {type: string, enum: [tugas, kuis, manual]}
        bobot: {type: number, description: Persen; jumlah semua komponen tepat 100, example: 30}
    Kelas:
      description: >-
        Dokumen koleksi `kelas`. Satu kelas = satu rumpun berproyek pengikat, atau satu mata kuliah
        (`mk_kode`) rumpun wadah, pada satu kalender semester terbit.
      type: object
      properties:
        id: {type: string}
        prodi_kode: {type: string, example: trpl}
        rumpun_kode: {type: string, example: R1}
        mk_kode: {type: string, description: Hanya kelas mata kuliah lepas}
        nama: {type: string, example: R1 Literasi & Wirausaha Digital}
        kalender_id: {type: string}
        angkatan: {type: string, example: "2026"}
        semester: {type: integer, example: 1}
        periode: {type: string, example: Ganjil 2026/2027}
        pengajar: {type: array, items: {type: string}, description: Email kampus pengajar}
        peserta_tambahan: {type: array, items: {type: string}, description: NIM di luar peserta otomatis}
        peserta_keluar: {type: array, items: {type: string}, description: NIM peserta otomatis yang dikeluarkan}
        bobot: {type: array, items: {$ref: '#/components/schemas/KomponenBobot'}}
        otomatis: {type: boolean, description: Dibuat otomatis dari kalender terbit}
        dibuat: {type: string, format: date-time}
    OrangKelas:
      type: object
      properties:
        nama: {type: string}
        email: {type: string, description: Pengajar}
        nim: {type: string, description: Peserta}
        status: {type: string, description: Peserta - status roster}
        sumber: {type: string, enum: [roster, tambahan], description: Peserta}
    KelasRingkas:
      allOf:
        - $ref: '#/components/schemas/Kelas'
        - type: object
          properties:
            rumpun_nama: {type: string}
            mk_nama: {type: string}
            prodi_nama: {type: string}
            pengajar_orang: {type: array, items: {$ref: '#/components/schemas/OrangKelas'}}
            jumlah_peserta: {type: integer}
            peran: {type: string, enum: [peserta, pengajar, kaprodi, admin], description: Peran pemanggil di kelas ini (admin hanya baca)}
    KelasDetail:
      allOf:
        - $ref: '#/components/schemas/KelasRingkas'
        - type: object
          properties:
            grup_wa:
              $ref: '#/components/schemas/GrupWAKelas'
            peserta: {type: array, items: {$ref: '#/components/schemas/OrangKelas'}}
            mata_kuliah: {type: array, items: {$ref: '#/components/schemas/MataKuliah'}}
            minggu_awal: {type: string, format: date-time, description: Senin minggu 1 kalender}
            jumlah_minggu: {type: integer}
            minggu_ini: {type: integer, description: 0 = di luar rentang kalender}
    GrupWAKelas:
      description: >-
        Grup WhatsApp kelas (sejak 2026-09-25, satu grup per kelas). `tautan_buat` (wa.me ke bot dengan
        pesan `daftar grup | <id kelas> | <nama kelas>`) hanya untuk pengajar/kaprodi selama grupnya belum ada.
      type: object
      properties:
        ada: {type: boolean}
        tautan_undangan: {type: string, example: "https://chat.whatsapp.com/AbCdEf"}
        tautan_buat: {type: string}
    PengumumanKelas:
      type: object
      properties:
        id: {type: string}
        kelas_id: {type: string}
        isi: {type: string}
        oleh: {type: string, description: "Email kampus penulis"}
        oleh_nama: {type: string, description: "Nama penulis, dibaca dari data dosen saat ditampilkan"}
        ke_grup: {type: boolean, description: "Sudah terkirim ke grup WhatsApp kelas"}
        dibuat: {type: string, format: date-time}
    PengumumanRequest:
      type: object
      required: [isi]
      properties:
        isi: {type: string, maxLength: 3000, example: "Kelas daring Kamis dimulai pukul 19.00."}
        kirim_grup: {type: boolean, description: "Kirim juga ke grup WhatsApp kelas lewat bot"}
    KalenderRingkasKelas:
      type: object
      properties:
        id: {type: string}
        angkatan: {type: string}
        semester: {type: integer}
        periode: {type: string}
    KuisKelas:
      type: object
      properties:
        id: {type: string}
        minggu: {type: integer}
        mk_kode: {type: string}
        jumlah_soal: {type: integer}
        ambang_lulus: {type: number}
        skor: {type: number, description: Hasil pemanggil (peserta) bila sudah mengerjakan}
        lulus: {type: boolean}
        dikerjakan: {type: integer, description: Untuk pengajar - peserta yang sudah mengerjakan}
    TugasKelas:
      allOf:
        - $ref: '#/components/schemas/Tugas'
        - type: object
          properties:
            status: {type: string, enum: [ditugaskan, diserahkan, terlambat, dinilai], description: Hanya untuk peserta}
            kirim_terakhir: {type: string, format: date-time}
            nilai: {type: number, description: Hanya setelah dikembalikan}
            komentar: {type: string, description: Hanya setelah dikembalikan}
            diserahkan: {type: integer, description: Untuk pengajar}
            dinilai: {type: integer, description: Untuk pengajar - sudah dikembalikan}
    MingguKelas:
      type: object
      properties:
        minggu: {type: integer}
        mulai: {type: string, format: date-time}
        materi: {type: array, items: {$ref: '#/components/schemas/Materi'}}
        kuis: {type: array, items: {$ref: '#/components/schemas/KuisKelas'}}
        tugas: {type: array, items: {$ref: '#/components/schemas/TugasKelas'}}
    IsiKelas:
      type: object
      properties:
        kelas_id: {type: string}
        peran: {type: string}
        minggu: {type: array, items: {$ref: '#/components/schemas/MingguKelas'}}
        tugas_tanpa_minggu: {type: array, items: {$ref: '#/components/schemas/TugasKelas'}}
    BarisNilaiKelas:
      type: object
      properties:
        nim: {type: string}
        nama: {type: string}
        komponen: {type: object, additionalProperties: {type: number, nullable: true}, description: Nilai per kunci komponen; null = belum ada}
        tugas: {type: object, additionalProperties: {type: number, nullable: true}, description: Nilai 0-100 per id tugas}
        nilai_akhir: {type: number, nullable: true, description: null kalau ada komponen yang belum lengkap}
        sementara: {type: number, description: Dari komponen yang sudah ada saja}
        huruf: {type: string, example: A}
        lengkap: {type: boolean}
        catatan: {type: string, description: Tidak dikirim ke peserta}
    BukuNilaiKelas:
      type: object
      properties:
        kelas_id: {type: string}
        komponen: {type: array, items: {$ref: '#/components/schemas/KomponenBobot'}}
        tugas: {type: array, items: {$ref: '#/components/schemas/Tugas'}}
        baris: {type: array, items: {$ref: '#/components/schemas/BarisNilaiKelas'}}
        catatan: {type: array, items: {type: string}}
    NilaiKelas:
      type: object
      properties:
        id: {type: string}
        kelas_id: {type: string}
        nim: {type: string}
        komponen: {type: object, additionalProperties: {type: number}}
        catatan: {type: string}
        diperbarui: {type: string, format: date-time}
    BuatKelasRequest:
      type: object
      required: [kalender_id, rumpun_kode]
      properties:
        kalender_id: {type: string}
        rumpun_kode: {type: string, example: R3}
        mk_kode: {type: string, description: Kosong = kelas rumpun}
        nama: {type: string, description: Kosong = nama bawaan}
    OtomatisKelasRequest:
      type: object
      required: [kalender_id]
      properties:
        kalender_id: {type: string}
    UbahKelasRequest:
      type: object
      properties:
        nama: {type: string, nullable: true}
        pengajar: {type: array, nullable: true, items: {type: string}, description: Email kampus; menggantikan seluruh daftar}
        peserta_tambahan: {type: array, nullable: true, items: {type: string}}
        peserta_keluar: {type: array, nullable: true, items: {type: string}}
    BobotKelasRequest:
      type: object
      required: [bobot]
      properties:
        bobot: {type: array, items: {$ref: '#/components/schemas/KomponenBobot'}}
    NilaiManualRequest:
      type: object
      properties:
        komponen: {type: object, additionalProperties: {type: number, nullable: true}, example: {ujian: 85}}
        catatan: {type: string}
    TugasRingkas:
      type: object
      properties:
        id:
          type: string
        judul:
          type: string
        deskripsi:
          type: string
        prodi_kode:
          type: string
          description: Prodi pemilik tugas (sejak 2026-09-15). Kosong untuk tugas lama yang belum diberi prodi.
          example: pai
        n_kiriman:
          type: integer
        sudah_kirim:
          type: boolean
          description: >-
            Hanya untuk token mahasiswa di roster (dicocokkan lewat NIM dari nomor pada token):
            true bila ia sudah pernah mengirim jawaban untuk tugas ini. Tidak dikirim untuk dosen/admin.
        kirim_terakhir:
          type: string
          format: date-time
          description: Waktu kiriman terakhir mahasiswa pemegang token untuk tugas ini; hanya ada bila sudah_kirim true.
        kelas_id:
          type: string
          description: Kelas pemilik tugas (sejak 2026-09-25); tidak ada untuk tugas prodi lama
        tenggat:
          type: string
          format: date-time
          description: Tenggat pengumpulan; tidak ada bila tugas tanpa tenggat
    PerKiriman:
      type: object
      properties:
        id:
          type: string
        nama:
          type: string
        nim:
          type: string
        filename:
          type: string
        max_score:
          type: number
          nullable: true
        pasangan_id:
          type: string
          nullable: true
        pasangan_nama:
          type: string
        band:
          type: string
    Pasangan:
      type: object
      properties:
        a_id:
          type: string
        a_nama:
          type: string
        b_id:
          type: string
        b_nama:
          type: string
        score:
          type: number
        band:
          type: string
    LaporanKemiripan:
      type: object
      properties:
        tugas_id:
          type: string
        disclaimer:
          type: string
          example: "Skor adalah kemiripan tekstual, bukan vonis plagiat. Keputusan akhir tetap pada dosen setelah pemeriksaan manual."
        per_kiriman:
          type: array
          items:
            $ref: '#/components/schemas/PerKiriman'
        pasangan:
          type: array
          items:
            $ref: '#/components/schemas/Pasangan'
    BebanMingguan:
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        minggu:
          type: integer
          description: Nomor minggu dalam kalender semester
          example: 3
        tanggal_mulai:
          type: string
          format: date
          example: "2026-09-07"
        menit_total:
          type: integer
          description: Total menit instruksional terjadwal pada minggu itu
          example: 1440
        sks:
          type: number
          format: float
          description: menit_total dibagi 85 menit per SKS, dibulatkan satu desimal
          example: 16.9
        kapasitas_sks:
          type: number
          format: float
          description: Kapasitas SKS per semester menurut ritme mingguan
          example: 16.9
        hari:
          type: array
          items:
            type: string
          description: Hari yang benar-benar berjadwal; hari bebas (0 menit) tidak disebut
          example: [Senin, Selasa, Rabu, Kamis, Jumat]
        catatan:
          type: string
          description: Terisi hanya kalau ada hari di luar ritme sehingga menitnya diperkirakan dari selisih jam
    CakupanCPL:
      type: object
      properties:
        cpl_kode:
          type: string
          example: CPL02
        deskripsi:
          type: string
          description: Rumusan CPL-nya, kalau sudah diisi prodi
        domain:
          type: string
          example: Pengetahuan
        tercapai:
          type: boolean
          example: true
        rumpun_bukti:
          type: array
          items:
            type: string
          description: Rumpun yang sudah punya nilai lulus DAN menyentuh CPL ini; kosong berarti belum tercapai
          example: [R1]
        status:
          type: string
          enum: [tercapai, belum, ditopang-jalur-lain]
          description: >-
            Memisahkan "belum tercapai" dari "di luar jangkauan perhitungan ini".
            `belum` = dipetakan ke rumpun tapi rumpunnya belum punya nilai lulus.
            `ditopang-jalur-lain` = tidak dipetakan ke rumpun mana pun, jadi
            berapa pun nilai yang masuk ia tidak akan pernah tercapai lewat jalur
            ini - buktinya ada di jalur kontinu/KKN/Magang/TA (lihat penopang_lain).
          example: tercapai
        penopang_lain:
          type: array
          items:
            type: string
          description: Diisi untuk CPL yang ditopang di luar nilai kelas rumpun
          example: [jalur kontinu, KKN Tematik]
        rumpun_bukti_rpl:
          type: array
          items:
            type: string
          description: >-
            Rumpun yang diakui lewat pengajuan RPL yang DISETUJUI dan menyentuh
            CPL ini. Sengaja dipisah dari rumpun_bukti (nilai akhir kelas rumpun) karena
            RPL adalah tinjauan dokumen pengalaman kerja lampau, bukan artefak
            yang dinilai - laporan akreditasi harus tetap bisa menjawab CPL ini
            terbukti dari mana.
          example: [R11]
    HasilAutograder:
      type: object
      properties:
        id: {type: string}
        workflow_run_id: {type: integer, format: int64, description: Unik - webhook yang dikirim ulang tidak menggandakan dokumen}
        nim: {type: string, description: Kosong kalau username GitHub belum ada di roster}
        github_username: {type: string}
        repo: {type: string}
        pr_nomor: {type: integer}
        commit_sha: {type: string}
        kesimpulan: {type: string, description: conclusion workflow run}
        versi_binari: {type: string, example: v0.2.0}
        go_versi: {type: string}
        tes_dosen_lulus: {type: integer, description: Ukuran kebenaran - hanya tes dari folder tes dosen}
        tes_dosen_total: {type: integer}
        tes_dosen_gagal:
          type: array
          items: {type: string}
        tes_semua_lulus: {type: integer, description: Termasuk tes buatan mahasiswa}
        tes_semua_total: {type: integer}
        build_gagal: {type: boolean}
        persen_baris: {type: number, description: Coverage pernyataan Go dari semua tes - bukan ukuran kebenaran}
        terisolasi: {type: boolean, description: go test dijalankan di kontainer Docker}
        mulai: {type: string, format: date-time}
        selesai: {type: string, format: date-time}
        diterima: {type: string, format: date-time}
    HasilAutograderBerskor:
      allOf:
        - $ref: '#/components/schemas/HasilAutograder'
        - type: object
          properties:
            skor:
              type: number
              description: >-
                0-100, dihitung saat dibaca dari bobot yang berlaku - TIDAK
                disimpan. Build gagal selalu 0. Kalau soal tidak punya tes
                dosen sama sekali, porsi tes dialihkan ke coverage.
              example: 59
    BobotAutograder:
      type: object
      description: >-
        Pembagian bobot di dalam komponen autograder, satu pengaturan untuk
        seluruh platform. Bukan besar komponennya terhadap nilai rumpun - itu
        15% menurut kurikulum dan tidak diatur di sini.
      properties:
        id: {type: string}
        tes_dosen: {type: number, description: "Porsi dari rasio tes dosen yang lulus, 0..1", example: 0.7}
        coverage: {type: number, description: "Porsi dari persen baris ter-cover, 0..1", example: 0.3}
        diperbarui: {type: string, format: date-time}
        diubah_oleh: {type: string, description: Email kampus dosen yang terakhir mengubah - snapshot pelaku}
    BobotAutograderRequest:
      type: object
      required: [tes_dosen, coverage]
      properties:
        tes_dosen: {type: number, example: 0.7}
        coverage: {type: number, example: 0.3}
    WebhookWorkflowRun:
      type: object
      description: Bagian payload webhook GitHub workflow_run yang dibaca backend
      properties:
        action: {type: string, example: completed}
        workflow_run:
          type: object
          properties:
            id: {type: integer, format: int64}
            path: {type: string, example: .github/workflows/autograder.yml}
            event: {type: string, example: pull_request_target}
            conclusion: {type: string}
            actor:
              type: object
              properties:
                login: {type: string}
        repository:
          type: object
          properties:
            full_name: {type: string}
            owner:
              type: object
              properties:
                login: {type: string, example: platformdigitalbandung}
    RekamanSesi:
      type: object
      properties:
        id: {type: string}
        kalender_id: {type: string}
        sesi_index: {type: integer, description: Posisi sesi di larik kalender terbit}
        youtube_id: {type: string, example: dQw4w9WgXcQ}
        judul: {type: string}
        diunggah_oleh: {type: string, description: Email kampus dosen}
        diterbitkan_pada: {type: string, format: date-time}
        tenggat: {type: string, format: date-time, description: Tengah malam WIB setelah tanggal sesi}
        terlambat: {type: boolean}
    TerbitkanRekamanRequest:
      type: object
      required: [kalender_id, sesi_index, url_video]
      properties:
        kalender_id: {type: string}
        sesi_index: {type: integer}
        url_video: {type: string, description: Tautan YouTube atau ID videonya, example: "https://youtu.be/dQw4w9WgXcQ"}
        judul: {type: string, maxLength: 150}
    SesiRekaman:
      type: object
      properties:
        sesi_index: {type: integer}
        minggu: {type: integer}
        tanggal: {type: string, format: date-time}
        hari: {type: string}
        tenggat: {type: string, format: date-time}
        status: {type: string, enum: [terbit-tepat, terbit-terlambat, belum-ada, menunggu, belum-berlangsung]}
        rekaman: {$ref: '#/components/schemas/RekamanSesi'}
    DaftarRekamanKalender:
      type: object
      properties:
        kalender_id: {type: string}
        prodi_kode: {type: string}
        angkatan: {type: string}
        semester: {type: integer}
        sesi:
          type: array
          items: {$ref: '#/components/schemas/SesiRekaman'}
    RekapRekaman:
      type: object
      properties:
        sekarang: {type: string, format: date-time}
        kalender:
          type: array
          items:
            type: object
            properties:
              kalender_id: {type: string}
              prodi_kode: {type: string}
              angkatan: {type: string}
              semester: {type: integer}
              jatuh_tempo: {type: integer}
              terbit_tepat: {type: integer}
              terbit_terlambat: {type: integer}
              belum_ada: {type: integer}
              menunggu: {type: integer}
              perlu_perhatian:
                type: array
                items: {$ref: '#/components/schemas/SesiRekaman'}
    SkalaHuruf:
      type: object
      properties:
        huruf: {type: string, example: C}
        minimal: {type: number, example: 60}
        bobot: {type: number, example: 2}
    NilaiRapor:
      type: object
      properties:
        kode_mk: {type: string, example: LITERASI-DIGITAL}
        nama: {type: string}
        sks: {type: integer}
        rumpun_kode: {type: string}
        nilai_akhir: {type: number, example: 83.2}
        huruf: {type: string, example: A}
        bobot: {type: number, example: 4}
        lulus: {type: boolean}
        cpl:
          type: array
          items: {type: string}
    SemesterRapor:
      type: object
      properties:
        semester: {type: integer}
        mata_kuliah:
          type: array
          items: {$ref: '#/components/schemas/NilaiRapor'}
        sks_dinilai: {type: integer}
        sks_lulus: {type: integer}
        ip: {type: number, example: 3.5}
        cpl_tersentuh:
          type: array
          items: {type: string}
          description: CPL rumpun dari mata kuliah yang lulus
    Rapor:
      type: object
      properties:
        nim: {type: string}
        nama: {type: string}
        prodi_kode: {type: string}
        angkatan: {type: string}
        semester_berjalan: {type: integer}
        semester:
          type: array
          items: {$ref: '#/components/schemas/SemesterRapor'}
        sks_dinilai: {type: integer}
        sks_lulus: {type: integer}
        ipk: {type: number}
        rumpun_diakui_rpl:
          type: array
          items: {type: string}
          description: Tanpa nilai angka; tidak masuk IP/IPK
        tidak_terpetakan:
          type: array
          items:
            type: object
            properties:
              kode_mk: {type: string}
              nilai_akhir: {type: number}
              huruf: {type: string}
        skala:
          type: array
          items: {$ref: '#/components/schemas/SkalaHuruf'}
        catatan:
          type: array
          items: {type: string}
    BarisRekapRapor:
      type: object
      properties:
        nim: {type: string}
        nama: {type: string}
        nilai:
          type: object
          additionalProperties: {type: string}
          description: kode_mk -> huruf; mata kuliah yang belum dinilai tidak muncul
          example: {LITERASI-DIGITAL: A, KEWIRAUSAHAAN: B}
        belum_dinilai: {type: integer}
        sks_dinilai: {type: integer}
        sks_lulus: {type: integer}
        ip: {type: number}
    RekapRaporSemester:
      type: object
      properties:
        prodi_kode: {type: string}
        angkatan: {type: string}
        semester: {type: integer}
        mata_kuliah:
          type: array
          items:
            type: object
            properties:
              kode: {type: string}
              nama: {type: string}
              sks: {type: integer}
        mahasiswa:
          type: array
          items: {$ref: '#/components/schemas/BarisRekapRapor'}
        skala:
          type: array
          items: {$ref: '#/components/schemas/SkalaHuruf'}
    ForumUtas:
      type: object
      properties:
        id: {type: string}
        nim: {type: string}
        prodi_kode: {type: string}
        rumpun_kode: {type: string, example: R1}
        minggu: {type: integer, example: 3}
        judul: {type: string}
        isi: {type: string}
        status: {type: string, enum: [terbuka, dijawab, ditutup]}
        dibuat: {type: string, format: date-time}
        tenggat_sla: {type: string, format: date-time}
        dijawab_dosen_pada: {type: string, format: date-time, description: Waktu balasan dosen pertama; tidak ada kalau belum dijawab dosen}
        jumlah_balasan: {type: integer}
        lewat_tenggat: {type: boolean, description: Dihitung saat dibaca}
    ForumBalasan:
      type: object
      properties:
        id: {type: string}
        forum_id: {type: string}
        peran: {type: string, enum: [dosen, mahasiswa]}
        nim: {type: string, description: Hanya untuk peran mahasiswa}
        email: {type: string, description: Email kampus - hanya untuk peran dosen}
        isi: {type: string}
        dibuat: {type: string, format: date-time}
    TanyaForumRequest:
      type: object
      required: [rumpun_kode, minggu, isi]
      properties:
        rumpun_kode: {type: string, example: R1}
        minggu: {type: integer, minimum: 1, maximum: 52, example: 3}
        judul: {type: string, maxLength: 150, description: Opsional; kosong berarti diambil dari awal isi}
        isi: {type: string, maxLength: 4000}
    BalasForumRequest:
      type: object
      required: [isi]
      properties:
        isi: {type: string, maxLength: 4000}
    ForumDetail:
      type: object
      properties:
        utas: {$ref: '#/components/schemas/ForumUtas'}
        balasan:
          type: array
          items: {$ref: '#/components/schemas/ForumBalasan'}
    RingkasanSLAForum:
      type: object
      properties:
        prodi_kode: {type: string}
        sekarang: {type: string, format: date-time}
        sla_jam: {type: integer, example: 24}
        hari_berlaku:
          type: array
          items: {type: string}
          example: [Senin, Selasa, Rabu]
        terbuka: {type: integer}
        menunggu_dalam_sla: {type: integer}
        terbuka_lewat_tenggat:
          type: array
          items: {$ref: '#/components/schemas/ForumUtas'}
        dijawab_tepat: {type: integer}
        dijawab_terlambat: {type: integer}
    ButirAgenda:
      type: object
      required: [jenis, sifat, judul, jumlah, tautan]
      properties:
        jenis: {type: string, description: 'Kunci stabil, mis. kuis_belum_lulus (daftar lengkap di GET /beranda/agenda)'}
        sifat: {type: string, enum: [perlu, akan], description: 'perlu = belum dikerjakan; akan = akan datang'}
        judul: {type: string}
        keterangan: {type: string}
        jumlah: {type: integer, description: 'Jumlah hal yang bisa dikerjakan satu per satu (mis. 3 pertanyaan forum); 0 untuk butir tunggal atau rincian yang bukan hitungan (mis. kekurangan kurikulum)'}
        tautan: {type: string, description: 'Halaman frontend relatif tempat mengerjakannya, mis. kuis.html'}
        prodi_kode: {type: string}
        tenggat: {type: string, format: date-time}
        mendesak: {type: boolean, description: Sudah lewat tenggat atau SLA}
    AgendaBeranda:
      type: object
      properties:
        peran:
          type: array
          items: {type: string, enum: [admin, kaprodi, dosen, mahasiswa]}
          description: Peran yang dipegang (dan dihitung), urut dari tertinggi
        admin: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        kaprodi: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        dosen: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        mahasiswa: {type: array, items: {$ref: '#/components/schemas/ButirAgenda'}}
        minggu_berjalan: {type: integer, description: 'Minggu berjalan kalender terbit prodi mahasiswa/prodi mengajar; 0 di luar masa perkuliahan'}
        dihitung: {type: string, format: date-time}
    DosenJabatan:
      type: object
      properties:
        email: {type: string, description: Email kampus; kosong kalau dosen belum mengisinya}
        nama: {type: string}
        jabatan: {type: string, enum: [admin], description: Kosong untuk dosen tanpa jabatan institusi}
        kaprodi_prodi:
          type: array
          items: {type: string}
          description: Kode prodi yang dipimpin sebagai kaprodi
        prodi_kode:
          type: array
          items: {type: string}
          description: Kode prodi tempat dosen mengajar (dosentugas.prodi_kode)
    MenitModa:
      type: object
      description: Menit instruksional menurut moda sesi kalender. Moda yang tidak dikenal dihitung di `lain` supaya `total` utuh.
      properties:
        asinkron:
          type: integer
        daring_sinkron:
          type: integer
        opsional_luring_daring:
          type: integer
        lain:
          type: integer
        total:
          type: integer
    KepatuhanMinggu:
      type: object
      properties:
        minggu:
          type: integer
        tanggal_mulai:
          type: string
          example: "2026-09-07"
        menit:
          $ref: '#/components/schemas/MenitModa'
    KepatuhanMataKuliah:
      type: object
      properties:
        kode:
          type: string
          example: LITERASI-DIGITAL
        nama:
          type: string
        sks:
          type: integer
        rumpun_kode:
          type: string
        menit:
          allOf:
            - $ref: '#/components/schemas/MenitModa'
          description: Total semester hasil ALOKASI sebanding SKS, bukan catatan per mata kuliah
        minggu_aktif:
          type: integer
        menit_per_minggu:
          type: number
        target_menit_per_minggu:
          type: integer
          description: SKS x 85 menit terjadwal-terbukti
        persen_target:
          type: number
        memenuhi:
          type: boolean
        cpl:
          type: array
          items:
            type: string
          description: Dari rumpun mata kuliah ini; kosong kalau prodi belum punya CPL terdaftar
        jumlah_dinilai:
          type: integer
          description: Mahasiswa berbeda yang punya nilai akhir kelas lengkap untuk mata kuliah ini di angkatan tersebut
        jumlah_lulus:
          type: integer
    LaporanKepatuhan:
      type: object
      properties:
        prodi_kode:
          type: string
        angkatan:
          type: string
        semester:
          type: integer
        kalender_id:
          type: string
        jumlah_minggu:
          type: integer
        menit_per_sks_sndikti:
          type: integer
          example: 170
        menit_per_sks_terjadwal:
          type: integer
          example: 85
        total_sks:
          type: integer
        kapasitas_sks:
          type: number
          example: 16.9
        menit:
          $ref: '#/components/schemas/MenitModa'
        per_minggu:
          type: array
          items:
            $ref: '#/components/schemas/KepatuhanMinggu'
        mata_kuliah:
          type: array
          items:
            $ref: '#/components/schemas/KepatuhanMataKuliah'
        jumlah_memenuhi:
          type: integer
        cpl_terdaftar:
          type: boolean
          description: false kalau prodi belum punya satu pun CPL (mis. Bisnis Digital)
        catatan:
          type: array
          items:
            type: string
    RekapKepatuhanMataKuliah:
      type: object
      properties:
        prodi_kode:
          type: string
        kode:
          type: string
        nama:
          type: string
        sks:
          type: integer
        semester:
          type: integer
        per_angkatan:
          type: array
          items:
            type: object
            properties:
              angkatan:
                type: string
              kalender_id:
                type: string
              jumlah_minggu:
                type: integer
              baris:
                $ref: '#/components/schemas/KepatuhanMataKuliah'
    RingkasanCakupanCPL:
      type: object
      properties:
        prodi_kode:
          type: string
          example: trpl
        nim:
          type: string
          description: Terisi pada cakupan per mahasiswa, kosong pada agregat prodi
          example: "2026001"
        total:
          type: integer
          description: Seluruh CPL prodi ini
          example: 11
        tercapai:
          type: integer
          description: >-
            JANGAN dibaca sebagai "tercapai dari total" - penyebut yang benar
            adalah dapat_dinilai. Sebagian CPL sengaja tidak dipetakan ke rumpun
            mana pun sehingga tidak akan pernah masuk hitungan ini.
          example: 7
        dapat_dinilai:
          type: integer
          description: total dikurangi ditopang_jalur_lain - jumlah CPL yang memang bisa dibuktikan dari nilai kelas rumpun
          example: 10
        ditopang_jalur_lain:
          type: integer
          description: Jumlah CPL yang tidak dipetakan ke rumpun mana pun (mis. CPL01 TRPL)
          example: 1
        tercapai_hanya_rpl:
          type: integer
          description: >-
            Berapa dari tercapai yang buktinya SEMATA-MATA RPL, tanpa satu pun
            nilai kelas. Angka yang perlu dilihat asesor sebelum membaca
            tercapai sebagai capaian yang dinilai di kelas.
          example: 0
        daftar:
          type: array
          items:
            $ref: '#/components/schemas/CakupanCPL'
    ProyekBlok:
      description: Instance proyek nyata di atas satu rumpun kurikulum untuk satu angkatan. Definisi mata kuliah dan CPL-nya tidak diduplikasi ke sini - ambil dari rumpun lewat rumpun_kode.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        rumpun_kode:
          type: string
          description: Kode rumpun kurikulum yang jadi cetak biru blok ini
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_email:
          type: string
          description: Email kampus dosen pembimbing/penilai utama - hanya dia (atau admin) yang boleh menginput nilai
          example: "dosen@digitalbdg.ac.id"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          enum:
            - draft
            - berjalan
            - selesai
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          example: 8
    KuisGerbang:
      description: Kuis gerbang satu prodi + rumpun pada satu minggu. Dalam balasan API untuk mahasiswa, `soal` tidak pernah memuat `indeks_benar`.
      type: object
      properties:
        id:
          type: string
        prodi_kode:
          type: string
          example: pai
        rumpun_kode:
          type: string
          example: R1
        mk_kode:
          type: string
          description: Mata kuliah untuk kuis kelas mata kuliah lepas (sejak 2026-09-25); kosong = kuis rumpun
        minggu:
          type: integer
          example: 3
        ambang_lulus:
          type: number
          format: double
          description: Persentase, mis. 70
          example: 70
        soal:
          type: array
          items:
            $ref: '#/components/schemas/SoalKuis'
    KuisGerbangSunting:
      description: Bentuk kuis untuk dosen - body penyusunan dan baris daftar. Memuat kunci jawaban; tidak pernah dipakai membalas mahasiswa.
      type: object
      required: [prodi_kode, rumpun_kode, minggu, soal]
      properties:
        id: {type: string, readOnly: true}
        prodi_kode: {type: string, example: pai}
        rumpun_kode: {type: string, example: R1}
        mk_kode: {type: string, description: "Opsional - mata kuliah rumpun itu, untuk kelas mata kuliah lepas (sejak 2026-09-25)"}
        minggu: {type: integer, example: 2}
        ambang_lulus: {type: number, example: 70, description: 0 berarti bawaan 60}
        dibuat_oleh: {type: string, readOnly: true, description: "Email kampus penyusun/penyunting terakhir, atau wa:<nomor> bila email kosong"}
        dikerjakan: {type: integer, readOnly: true, description: Jumlah mahasiswa yang sudah mengerjakan}
        soal:
          type: array
          items:
            type: object
            required: [pertanyaan, pilihan, indeks_benar]
            properties:
              pertanyaan: {type: string, example: "Rukun Islam ada berapa?"}
              pilihan: {type: array, items: {type: string}, example: ["4", "5", "6"]}
              indeks_benar: {type: integer, example: 1, description: Mulai 0}
    SoalKuis:
      description: Satu butir pilihan ganda. `indeks_benar` tidak pernah ikut dalam balasan.
      type: object
      properties:
        pertanyaan:
          type: string
          example: Port standar HTTPS?
        pilihan:
          type: array
          items:
            type: string
          example: ["80", "443", "22"]
    StatusJawabanKuis:
      description: >-
        Satu baris riwayat kuis mahasiswa - pengerjaan (JawabanKuis) beserta prodi, rumpun, dan minggu
        kuisnya, dibaca dari kuis saat diminta. Kosong kalau kuisnya sudah dihapus.
      allOf:
        - $ref: '#/components/schemas/JawabanKuis'
        - type: object
          properties:
            prodi_kode:
              type: string
              example: pai
            rumpun_kode:
              type: string
              example: R1
            rumpun_nama:
              type: string
              example: Studi Al-Quran
            minggu:
              type: integer
              example: 3
    JawabanKuis:
      description: Satu pengerjaan oleh satu mahasiswa atas satu kuis, disimpan per (kuis, nim).
      type: object
      properties:
        id:
          type: string
        kuis_id:
          type: string
        nim:
          type: string
          readOnly: true
          description: Diisi server dari roster lewat nomor WhatsApp pada token
          example: "2026001"
        jawaban_idx:
          type: array
          items:
            type: integer
        skor:
          type: number
          format: double
          description: Persentase 0-100, dihitung server
          example: 75
        lulus:
          type: boolean
          example: true
    SesiUjian:
      description: Satu jadwal ujian untuk satu rumpun.
      type: object
      properties:
        id:
          type: string
        rumpun_kode:
          type: string
          example: R1
        jenis:
          type: string
          enum:
            - tengah-blok
            - akhir-blok
          example: akhir-blok
        tanggal_jam:
          type: string
          format: date-time
          example: "2026-11-20T09:00:00+07:00"
        lokasi:
          type: string
          example: Lab 2, Gedung A
        pengawas:
          type: string
          description: Email kampus dosen pengawas (NIP pada data lama yang belum dimigrasi)
          example: "dosen@digitalbdg.ac.id"
    SesiUjianRequest:
      type: object
      required:
        - rumpun_kode
        - jenis
        - tanggal_jam
        - lokasi
        - pengawas
      properties:
        rumpun_kode:
          type: string
          example: R1
        jenis:
          type: string
          enum:
            - tengah-blok
            - akhir-blok
        tanggal_jam:
          type: string
          description: RFC3339 beserta zona waktu
          example: "2026-11-20T09:00:00+07:00"
        lokasi:
          type: string
          example: Lab 2, Gedung A
        pengawas:
          type: string
          description: Email kampus dosen pengawas
    KehadiranUjian:
      description: Satu baris per (sesi, nim).
      type: object
      properties:
        id:
          type: string
        sesi_ujian_id:
          type: string
        nim:
          type: string
          example: "2026001"
        jam_masuk:
          type: string
          format: date-time
        jam_selesai:
          type: string
          format: date-time
        dicatat_oleh:
          type: string
          readOnly: true
          description: Email kampus pengawas yang check-in manual; tanpa email tercatat sebagai `wa:<nomor>`
    StorageRef:
      description: >-
        Referensi berkas di repo storage GitHub privat. Yang disimpan ke database
        hanya ini, bukan isi berkasnya (pdb/README.md poin 8).
      type: object
      properties:
        repo:
          type: string
          example: platformdigitalbandung/storage
        path:
          type: string
          example: rpl/66f1a2b3c4d5e6f7a8b9c0d1/sertifikat.pdf
        sha:
          type: string
          example: e69de29bb2d1d6434b8b29ae775ad8c2e48c5391
    PengajuanRPL:
      description: >-
        Pengakuan pengalaman kerja sebelum masuk kuliah jadi kredit satu rumpun.
      type: object
      properties:
        id:
          type: string
        nim:
          type: string
          readOnly: true
          description: Diisi server dari roster lewat nomor WhatsApp pada token
          example: "2026TRPL001"
        rumpun_target:
          type: string
          example: R11
        deskripsi:
          type: string
        bukti_url:
          type: array
          description: >-
            Referensi berkas di repo storage GitHub privat (repo/path/sha), bukan isi
            berkasnya - pdb/README.md poin 8.
          items:
            $ref: '#/components/schemas/StorageRef'
        status:
          type: string
          enum:
            - diajukan
            - ditinjau
            - disetujui
            - ditolak
        dinilai_oleh:
          type: string
          readOnly: true
          description: Email kampus peninjau; tanpa email tercatat sebagai `wa:<nomor>`
        catatan:
          type: string
    Prodi:
      type: object
      required: [kode, nama, sks_total, semester, jenjang]
      properties:
        kaprodi_email:
          type: string
          description: Email kampus dosen yang menjabat kaprodi; hanya diubah lewat PUT /kurikulum/prodi/{prodi}/kaprodi
        id: {type: string}
        kode: {type: string, description: 'Huruf kecil/angka/tanda hubung, 2-20 karakter, diawali huruf. Kunci di rumpun, cpl, matakuliah, mahasiswa, kalender_semester', example: pai}
        nama: {type: string, example: Pendidikan Agama Islam}
        sks_total: {type: integer, example: 144}
        semester: {type: integer, description: Jumlah semester program, example: 8}
        jenjang: {type: string, example: S1}
        semester_proyek_kerja_min:
          type: integer
          description: >-
            Semester paling awal mahasiswa prodi ini boleh mengajukan proyek
            kerja/magang. Kosong/0 berarti bawaan platform (4).
          example: 5
    Rumpun:
      type: object
      required: [kode, nama, sks, semester, mata_kuliah]
      properties:
        id: {type: string}
        prodi_kode: {type: string, description: Diisi dari path saat menulis}
        kode: {type: string, example: R1}
        nama: {type: string, example: Dasar Keilmuan}
        mata_kuliah:
          type: array
          description: Sumber tunggal koleksi matakuliah - diturunkan dari daftar ini
          items: {type: string}
        sks: {type: integer, example: 12}
        proyek_pengikat: {type: string}
        moda: {type: string, enum: [ritme_mingguan, tempat_kerja], default: ritme_mingguan}
        semester: {type: integer, example: 1}
        cpl:
          type: array
          items: {type: string}
        catatan: {type: string}
    CapaianPembelajaran:
      type: object
      required: [kode, domain]
      properties:
        id: {type: string}
        prodi_kode: {type: string, description: Diisi dari path saat menulis}
        kode: {type: string, example: CPL01}
        domain: {type: string, example: sikap}
        deskripsi:
          type: string
          description: >-
            Rumusan CPL-nya sendiri. Opsional supaya dokumen lama yang hanya
            berisi kode tetap terbaca.
          example: Bertakwa kepada Tuhan Yang Maha Esa dan mampu menunjukkan sikap religius
        rumpun_penyentuh:
          type: array
          items: {type: string}
        penguatan_usulan:
          type: array
          items: {type: string}
        penopang_lain:
          type: array
          description: Rumpun/mata kuliah lain yang menopang CPL ini di luar rumpun penyentuh utama
          items: {type: string}
    SesiHari:
      type: object
      required: [hari, moda]
      properties:
        hari: {type: string, description: Nama hari Bahasa Indonesia, example: Senin}
        moda: {type: string, enum: [asinkron, daring_sinkron, opsional_luring_daring, bebas]}
        jam_mulai: {type: string, example: '08.00'}
        jam_selesai: {type: string, example: '10.00'}
        menit_instruksional: {type: integer, example: 120}
        catatan: {type: string}
    RitmeMingguan:
      type: object
      required: [nama, sesi]
      properties:
        id: {type: string}
        nama: {type: string, description: Kalender semester menunjuk ritme lewat nama ini, example: 'Fase 1 - Semester 1-6'}
        sesi:
          type: array
          items:
            $ref: '#/components/schemas/SesiHari'
        total_menit_per_minggu: {type: integer, description: Boleh dikosongkan - dijumlahkan dari sesinya}
        kapasitas_sks_per_semester: {type: number}
    MataKuliah:
      description: >-
        Satu mata kuliah kurikulum, milik satu rumpun. Diturunkan dari
        `rumpun.mata_kuliah` saat seed - bukan daftar kedua yang diketik ulang.
      type: object
      properties:
        id:
          type: string
          example: 66f1a2b3c4d5e6f7a8b9c0d1
        kode:
          type: string
          description: Unik per prodi, diturunkan dari nama mata kuliah
          example: LITERASI-DIGITAL
        nama:
          type: string
          example: Literasi Digital
        sks:
          type: integer
          description: Angka, bukan teks di dalam tanda kurung
          example: 3
        prodi_kode:
          type: string
          example: trpl
        rumpun_kode:
          type: string
          example: R1
        semester:
          type: integer
          example: 1
        kode_institusi:
          type: string
          description: Opsional; kode SIAKAD/PDDikti, diisi kaprodi lewat PUT .../matakuliah/{kode}
          example: BD-1103
        cpl:
          type: array
          description: Opsional; pemetaan CPL yang berlaku sekarang ada di level rumpun
          items:
            type: string
    AnggotaProyek:
      description: >-
        Anggota proyek. Hanya `nim` yang bermakna sebagai masukan - ia kunci asing
        ke koleksi `mahasiswa`. `nama` dan `phonenumber` adalah cuplikan yang
        diselaraskan server dari roster saat proyek disimpan; nilai yang dikirim
        klien untuk kedua field itu diabaikan kalau NIM-nya sudah ada di roster.
      type: object
      properties:
        nim:
          type: string
          description: Kunci asing ke koleksi `mahasiswa`. Prodi anggota harus sama dengan prodi proyek.
          example: "2026001"
        nama:
          type: string
          readOnly: true
          description: Cuplikan dari roster - bukan masukan.
          example: Budi Santoso
        phonenumber:
          type: string
          readOnly: true
          description: >-
            Cuplikan nomor WhatsApp dari roster, dipakai untuk notifikasi. Kepemilikan
            NIM di GET /mahasiswa/{nim}/nilai dibuktikan lewat roster, bukan lewat
            nomor yang tersimpan di dokumen proyek ini.
          example: "6281234567890"
    SetEmailDosenRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email dosen pemegang token, domain apa pun (sejak 2026-09-17)
          example: "dosen@digitalbdg.ac.id"
    Mahasiswa:
      description: Satu baris roster akademik. Bukan akun - autentikasi tetap WhatsAuth, dan phonenumber di sini yang menghubungkan token ke identitas akademik.
      type: object
      properties:
        github_username:
          type: string
          description: Opsional, huruf kecil, unik antar-NIM - jembatan hasil autograder ke NIM
          example: marfanwicaksono
        id:
          type: string
        nim:
          type: string
          description: Kunci akademik, unik
          example: "2026001"
        nama:
          type: string
          example: Budi Santoso
        phonenumber:
          type: string
          description: Nomor WhatsApp yang dipakai login WhatsAuth
          example: "6281234567890"
        email:
          type: string
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          description: Semester berjalan, dipakai memilih kalender akademik yang berlaku
          example: 5
        status:
          type: string
          enum: [aktif, cuti, lulus, keluar]
          example: aktif
    TautanTinjauan:
      description: Tautan sekali-pakai untuk atasan, diterbitkan dosen lalu diteruskan sendiri ke atasan.
      type: object
      properties:
        proyek_kerja_id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        atasan_nama:
          type: string
          example: Ibu Atasan
        url:
          type: string
          example: https://platform.digitalbdg.ac.id/tinjauan.html?token=v4.public.xxxx
        token:
          type: string
        kedaluwarsa:
          type: string
          format: date-time
    RingkasTinjauanAtasan:
      description: Tampilan proyek untuk halaman tinjauan atasan - tanpa NIM dan nomor WhatsApp mahasiswa.
      type: object
      properties:
        proyek_kerja_id:
          type: string
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        atasan_nama:
          type: string
          example: Ibu Atasan
        status:
          type: string
          example: berjalan
        sudah_ditinjau:
          type: array
          description: Jenis tinjauan yang sudah dikirim atasan ini
          items:
            type: string
            enum: [tengah-semester, akhir]
    TinjauanAtasanRequest:
      type: object
      properties:
        token:
          type: string
          description: Token dari tautan tinjauan - boleh juga dikirim sebagai query
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
    ProyekKerja:
      description: Proyek semester-panjang di tempat kerja mahasiswa, dikonversi jadi SKS satu rumpun kurikulum.
      type: object
      properties:
        id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        nim:
          type: string
          example: "2026001"
        phonenumber:
          type: string
          description: Diisi server dari token WhatsAuth saat pengajuan - bukti kepemilikan NIM
          example: "6281234567890"
        prodi_kode:
          type: string
          example: trpl
        semester:
          type: integer
          example: 5
        rumpun_kode:
          type: string
          example: R11
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        dosen_email:
          type: string
          description: Email kampus dosen, diisi saat dosen memutuskan pengajuan
          example: "dosen@digitalbdg.ac.id"
        atasan_nama:
          type: string
          example: Ibu Atasan
        atasan_email:
          type: string
          example: atasan@contoh.co.id
        atasan_phonenumber:
          type: string
        status:
          type: string
          enum: [diajukan, disetujui, berjalan, tinjauan-tengah, selesai, ditolak]
          example: diajukan
        catatan:
          type: string
          description: Alasan penolakan atau catatan putusan dosen
    TinjauanProyekKerja:
      description: Satu tinjauan dari satu penilai pada satu titik waktu. Satu peran hanya punya satu tinjauan per jenis.
      type: object
      properties:
        id:
          type: string
        proyek_kerja_id:
          type: string
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        penilai_peran:
          type: string
          enum: [dosen, atasan]
        penilai_nama:
          type: string
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
    AjukanProyekKerjaRequest:
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        prodi_kode:
          type: string
          example: trpl
        semester:
          type: integer
          example: 5
        rumpun_kode:
          type: string
          example: R11
        nama_perusahaan:
          type: string
          example: PT Contoh Nusantara
        judul_pekerjaan:
          type: string
          example: Modul penagihan otomatis
        deskripsi:
          type: string
        atasan_nama:
          type: string
          example: Ibu Atasan
        atasan_email:
          type: string
          example: atasan@contoh.co.id
        atasan_phonenumber:
          type: string
    PutusanProyekKerjaRequest:
      type: object
      properties:
        setuju:
          type: boolean
          example: true
        catatan:
          type: string
          description: Wajib diisi kalau menolak
    TinjauanProyekKerjaRequest:
      type: object
      properties:
        jenis:
          type: string
          enum: [tengah-semester, akhir]
        penilai_nama:
          type: string
        skor:
          type: number
          format: double
          example: 88
        catatan:
          type: string
    Materi:
      description: Satu butir katalog materi asinkron untuk satu minggu rumpun.
      type: object
      properties:
        id:
          type: string
        prodi_kode:
          type: string
          example: trpl
        rumpun_kode:
          type: string
          example: R1
        mk_kode:
          type: string
          description: Mata kuliah untuk materi kelas mata kuliah lepas (sejak 2026-09-25); kosong = materi seluruh rumpun
          example: MKU101
        minggu:
          type: integer
          example: 3
        urutan:
          type: integer
          example: 1
        judul:
          type: string
          example: Pengenalan Git
        jenis:
          type: string
          enum: [video, bacaan, berkas]
        youtube_id:
          type: string
          description: Hanya untuk jenis video - ID 11 karakter yang sudah diurai server
          example: dQw4w9WgXcQ
        isi:
          type: string
          description: Hanya untuk jenis bacaan - teks lengkapnya
        berkas:
          description: >-
            Hanya untuk jenis berkas - referensi PDF di repo storage GitHub privat
            (repo/path/sha), bukan isi berkasnya. Kosong selama berkasnya belum
            diunggah lewat POST /materi/{id}/berkas.
          allOf:
            - $ref: '#/components/schemas/StorageRef'
        nama_berkas:
          type: string
          description: >-
            Nama berkas yang ditampilkan ke mahasiswa, sudah disanitasi. Path di
            repo storage bukan ini - di sana namanya masih diawali id materi
          example: slide-pekan-3.pdf
        halaman:
          type: integer
          description: >-
            Jumlah halaman PDF, ditetapkan saat dosen mengunggah - itu penyebut
            progres per halaman, jadi tidak diambil dari peramban mahasiswa
          example: 24
        ukuran_byte:
          type: integer
          format: int64
          example: 123456
        deskripsi:
          type: string
        dibuat_oleh:
          type: string
          description: Email kampus pembuat, atau "wa:<nomor>" kalau emailnya kosong
    MateriRequest:
      type: object
      required: [prodi_kode, rumpun_kode, minggu, judul, jenis]
      properties:
        prodi_kode:
          type: string
          example: trpl
        rumpun_kode:
          type: string
          example: R1
        mk_kode:
          type: string
          description: Opsional - mata kuliah rumpun itu, untuk kelas mata kuliah lepas
          example: MKU101
        minggu:
          type: integer
          minimum: 1
          maximum: 52
          example: 3
        urutan:
          type: integer
          minimum: 0
          example: 1
        judul:
          type: string
          maxLength: 200
        jenis:
          type: string
          enum: [video, bacaan, berkas]
        youtube_id:
          type: string
          description: Wajib untuk video - ID 11 karakter atau tautan YouTube apa pun
          example: https://youtu.be/dQw4w9WgXcQ
        isi:
          type: string
          maxLength: 100000
          description: Wajib untuk bacaan
        deskripsi:
          type: string
          maxLength: 1000
    BerkasMateri:
      description: >-
        Isi berkas PDF satu materi, dikirim base64 di dalam JSON. Bukan biner:
        repo storage-nya privat sehingga peramban tidak bisa mengambilnya
        langsung, dan frontend hanya memanggil REST lewat crootjs yang mengurai
        JSON.
      type: object
      properties:
        nama_berkas:
          type: string
          example: slide-pekan-3.pdf
        mime:
          type: string
          example: application/pdf
        halaman:
          type: integer
          description: Penyebut progres per halaman, ditetapkan dosen saat mengunggah
          example: 24
        ukuran_byte:
          type: integer
          format: int64
          example: 123456
        isi_base64:
          type: string
          format: byte
          description: Isi berkas PDF dalam base64
          example: JVBERi0xLjcK
    ProgresMateri:
      description: >-
        Progres satu (nim, rumpun, minggu, materi). persen_selesai yang tersimpan
        tidak pernah turun, begitu juga halaman_terakhir.
      type: object
      properties:
        id:
          type: string
        nim:
          type: string
          readOnly: true
          description: Diisi server dari roster lewat nomor WhatsApp pada token
          example: "2026TRPL001"
        rumpun_kode:
          type: string
          example: R1
        minggu:
          type: integer
          example: 3
        materi_id:
          type: string
          description: Slug/ID materi di katalog (video, bacaan, atau berkas), maksimal 200 karakter
          example: video-pengenalan-git
        persen_selesai:
          type: number
          format: double
          example: 80
        halaman_terakhir:
          type: integer
          description: >-
            Hanya untuk materi jenis berkas - halaman terjauh yang sudah dibuka.
            Keterangan untuk dosen; yang dipakai laporan kepatuhan tetap
            persen_selesai.
          example: 12
    CatatProgresRequest:
      type: object
      required: [rumpun_kode, minggu, materi_id, persen_selesai]
      properties:
        rumpun_kode:
          type: string
          example: R1
        minggu:
          type: integer
          minimum: 1
          maximum: 52
          example: 3
        materi_id:
          type: string
          maxLength: 200
          example: video-pengenalan-git
        persen_selesai:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 45
        halaman_terakhir:
          type: integer
          minimum: 0
          description: >-
            Opsional, dipakai materi jenis berkas. Digabung dengan aturan
            tidak-pernah-turun yang sama dengan persen_selesai.
          example: 12
    ProyekTelat:
      description: Satu proyek yang sudah melewati titik tengah semester tetapi tinjauan tengahnya belum lengkap.
      type: object
      properties:
        id:
          type: string
        nim:
          type: string
        judul_pekerjaan:
          type: string
        nama_perusahaan:
          type: string
        rumpun_kode:
          type: string
        status:
          type: string
        dosen_email:
          type: string
        kurang:
          type: array
          items:
            type: string
            enum: [dosen, atasan]
          description: Pihak yang tinjauan tengahnya belum masuk - itu yang menentukan siapa yang harus ditagih
          example: [atasan]
        hari_terlambat:
          type: integer
          example: 10
    RingkasanKaprodi:
      description: Ringkasan proyek kerja untuk kaprodi.
      type: object
      properties:
        prodi_kode:
          type: string
        angkatan:
          type: string
        semester:
          type: integer
        total:
          type: integer
        aktif:
          type: integer
          description: Sudah disetujui dan belum selesai/ditolak
        per_status:
          type: object
          additionalProperties:
            type: integer
          example: {diajukan: 2, berjalan: 5, selesai: 1}
        acuan_tengah:
          type: string
          enum: [kalender, tidak-ada-kalender]
        titik_tengah:
          type: string
          description: Tanggal titik tengah semester; kosong kalau tidak ada kalender terbit
          example: "2026-10-26"
        tanpa_acuan:
          type: integer
          description: Proyek aktif yang keterlambatannya tidak bisa dinilai karena kalender semesternya belum terbit
        telat:
          type: array
          items:
            $ref: '#/components/schemas/ProyekTelat'
    ProyekKerjaSaya:
      description: Proyek kerja milik pemegang token - yang dibimbing (dosen) atau yang diajukan sendiri (mahasiswa).
      type: object
      properties:
        peran:
          type: string
          enum: [dosen, mahasiswa]
        email:
          type: string
          description: Email kampus, diisi hanya untuk dosen
        proyekkerja:
          type: array
          items:
            $ref: '#/components/schemas/ProyekKerja'
    KalenderSemester:
      description: Kalender satu semester untuk satu prodi dan angkatan, diturunkan dari ritme mingguan kurikulum.
      type: object
      properties:
        id:
          type: string
          example: 6aa3f4f514984a96f23147dd
        prodi_kode:
          type: string
          example: trpl
        ritme_nama:
          type: string
          description: Nama ritme mingguan kurikulum yang dipakai; kosong berarti ritme bawaan
          example: ritme-trpl-2026
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          example: 1
        tanggal_mulai:
          type: string
          format: date-time
          description: Hari Senin pada pekan pertama semester
        sesi:
          type: array
          items:
            $ref: '#/components/schemas/SesiKalender'
        diterbitkan:
          type: boolean
          description: false = draft, belum terlihat publik
          example: false
        diterbitkan_pada:
          type: string
          format: date-time
    SesiKalender:
      description: Satu sesi harian pada kalender, hasil penerjemahan SesiHari ritme mingguan ke tanggal konkret.
      type: object
      properties:
        minggu:
          type: integer
          example: 1
        tanggal:
          type: string
          format: date-time
        hari:
          type: string
          example: Jumat
        moda:
          type: string
          example: opsional_luring_daring
        jam_mulai:
          type: string
          example: "08:00"
        jam_selesai:
          type: string
          example: "20:00"
        keterangan:
          type: string
        rumpun_kode:
          type: string
          description: FK opsional ke Rumpun.Kode
          example: R1
    BuatKalenderRequest:
      type: object
      properties:
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        semester:
          type: integer
          example: 1
        tanggal_mulai:
          type: string
          description: Format YYYY-MM-DD. Kalau bukan hari Senin, dipakai hari Senin pada pekan yang sama.
          example: "2026-09-14"
        jumlah_minggu:
          type: integer
          description: Kosong = 16
          example: 16
    ProyekSaya:
      description: Proyek milik pemegang token - yang dibimbing (dosen) atau yang diikuti (mahasiswa).
      type: object
      properties:
        jabatan:
          type: array
          items: {type: string, enum: [admin, kaprodi]}
          description: Jabatan pimpinan dosen dari database saat itu
        prodi_mengajar:
          type: array
          items: {type: string}
          description: Prodi tempat dosen mengajar digabung prodi yang dipimpin (hanya dosen)
        kaprodi_prodi:
          type: array
          items: {type: string}
          description: Kode prodi yang dipimpin sebagai kaprodi
        jumlah_kelas_diajar:
          type: integer
          description: Kelas yang pengajarnya memuat email dosen ini (sejak 2026-09-25; hanya dosen)
        peran:
          type: string
          enum: [dosen, mahasiswa]
          example: mahasiswa
        email:
          type: string
          description: Email kampus, diisi hanya untuk dosen yang sudah mengisinya
          example: "dosen@digitalbdg.ac.id"
        nim:
          type: string
          description: NIM pemilik nomor, diisi hanya untuk peran mahasiswa
          example: "2026001"
        prodi_kode:
          type: string
          description: >-
            Diisi hanya dari roster, untuk mahasiswa yang terdaftar di sana.
            Mahasiswa yang dikenali lewat jalur mundur penyisiran proyek tidak
            mendapatkannya, karena prodinya tidak tercatat di sumber yang
            tepercaya.
          example: trpl
        proyekblok:
          type: array
          items:
            $ref: '#/components/schemas/ProyekBlok'
    PenilaianProyek:
      description: Satu baris nilai per (proyek, nim, kode_mk) - satu proyek menilai beberapa mata kuliah sekaligus lewat artefak yang berbeda, jadi satu mahasiswa punya beberapa baris dalam satu proyek.
      type: object
      properties:
        id:
          type: string
          example: 66f0a1b2c3d4e5f678901299
        proyek_blok_id:
          type: string
          example: 66f0a1b2c3d4e5f678901234
        nim:
          type: string
          example: "2026001"
        kode_mk:
          type: string
          description: >-
            Kunci asing ke koleksi `matakuliah` - kode stabil, bukan teks tampilan.
            Server mengkanonikkannya saat menyimpan, jadi nilai yang dikembalikan di
            sini selalu bentuk kode ini apa pun ejaan yang dikirim.
          example: LITERASI-DIGITAL
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        nilai_akhir:
          type: number
          description: Selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15, tidak pernah diinput manual
          example: 84.25
        catatan:
          type: string
          example: Portofolio rapi, presentasi perlu latihan lagi
        dinilai_oleh:
          type: string
          description: Identitas penilai yang sebenarnya (bisa admin, bukan selalu pembimbing) - email kampus dosen kalau sudah diisi, kalau tidak nomornya sendiri dengan awalan "wa:" (data lama bisa berisi NIP)
          example: "dosen@digitalbdg.ac.id"
    KomponenNilai:
      description: Keempat komponen nilai, masing-masing berskala 0-100. Bobotnya tetap - hasil proyek 40%, ujian 30%, kuis 15%, presentasi 15% - dan dihitung di server, tidak disimpan per dokumen.
      type: object
      properties:
        hasil_proyek:
          type: number
          description: Skala 0-100, boleh memakai nilai kelompok (bobot 40%)
          minimum: 0
          maximum: 100
          example: 88
        ujian:
          type: number
          description: Skala 0-100, individu - ujian berpengawas di kampus (bobot 30%)
          minimum: 0
          maximum: 100
          example: 80
        kuis:
          type: number
          description: Skala 0-100, individu (bobot 15%)
          minimum: 0
          maximum: 100
          example: 85
        presentasi:
          type: number
          description: Skala 0-100, individu meski proyeknya kelompok (bobot 15%)
          minimum: 0
          maximum: 100
          example: 82
    RekapNilai:
      description: Bentuk ringkas nilai satu mahasiswa - nilai akhir per mata kuliah beserta rata-ratanya.
      type: object
      properties:
        nim:
          type: string
          example: "2026001"
        per_mata_kuliah:
          type: object
          description: Peta nama mata kuliah ke nilai akhirnya
          additionalProperties:
            type: number
          example:
            Literasi Digital (3): 84.25
            Kewirausahaan (3): 79.5
        rata_rata:
          type: number
          description: Rata-rata dari nilai akhir tiap mata kuliah (bukan dari komponen), dibulatkan 2 angka desimal
          example: 81.88
    BuatProyekBlokRequest:
      type: object
      properties:
        rumpun_kode:
          type: string
          description: Kode rumpun yang harus sudah ada di data kurikulum prodi itu
          example: R1
        prodi_kode:
          type: string
          example: trpl
        angkatan:
          type: string
          example: "2026"
        judul:
          type: string
          example: Portofolio Digital Profesional
        deskripsi:
          type: string
          example: Menyusun portofolio digital profesional sekaligus rencana usaha berbasis teknologi
        dosen_email:
          type: string
          description: Email kampus dosen aktif yang membimbing
          example: "dosen@digitalbdg.ac.id"
        anggota:
          type: array
          items:
            $ref: '#/components/schemas/AnggotaProyek'
        status:
          type: string
          description: Kalau dikosongkan, diisi draft
          enum:
            - draft
            - berjalan
            - selesai
          default: draft
          example: berjalan
        mulai_minggu:
          type: integer
          example: 1
        selesai_minggu:
          type: integer
          description: Tidak boleh negatif dan tidak boleh lebih awal dari mulai_minggu
          example: 8
      required:
        - rumpun_kode
        - prodi_kode
        - angkatan
        - judul
        - dosen_email
    InputNilaiRequest:
      description: Body input nilai. nilai_akhir tidak ada di sini karena selalu dihitung server dari komponen dengan bobot tetap 40/30/15/15.
      type: object
      properties:
        nim:
          type: string
          description: Harus NIM yang terdaftar sebagai anggota proyek ini
          example: "2026001"
        kode_mk:
          type: string
          description: >-
            Mata kuliah yang dinilai, harus milik rumpun proyek ini. Boleh ditulis
            sebagai kode (`LITERASI-DIGITAL`), nama lengkap (`Literasi Digital`), atau
            sebagian nama (`literasi`) - server mencocokkannya ke koleksi `matakuliah`
            lalu menyimpan `kode`-nya. Masukan yang cocok ke DUA mata kuliah ditolak
            dengan 422 yang menyebut pilihan yang sah, bukan ditebak. Nilai yang
            tersimpan dan dikembalikan selalu bentuk kode.
          example: literasi digital
        komponen:
          $ref: '#/components/schemas/KomponenNilai'
        catatan:
          type: string
          description: Opsional
          example: Portofolio rapi, presentasi perlu latihan lagi
      required:
        - nim
        - kode_mk
        - komponen
    MasukSandiRequest:
      type: object
      required:
        - identitas
        - sandi
      properties:
        identitas:
          type: string
          description: NIM (mahasiswa) atau email (dosen / roster mahasiswa)
          example: 2026TRPL001
        sandi:
          type: string
          format: password
    GantiSandiRequest:
      type: object
      required:
        - sandi_lama
        - sandi_baru
      properties:
        sandi_lama:
          type: string
          format: password
          description: Kata sandi yang berlaku sekarang (templat atau yang tersimpan)
        sandi_baru:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    StatusSandi:
      type: object
      properties:
        peran:
          type: string
          enum:
            - mahasiswa
            - dosen
        identitas:
          type: string
          description: NIM atau email kampus untuk masuk
        templat:
          type: boolean
          description: true = masih kata sandi templat
        bisa_masuk:
          type: boolean
        alasan:
          type: string
          description: Diisi kalau bisa_masuk false
    ResetSandiRequest:
      type: object
      required:
        - peran
        - id
      properties:
        peran:
          type: string
          enum:
            - mahasiswa
            - dosen
        id:
          type: string
          description: _id dokumen mahasiswa atau dosentugas (24 heksadesimal)
    PenggunaDosen:
      type: object
      properties:
        id:
          type: string
        nama:
          type: string
        nohp:
          type: string
        email:
          type: string
          description: Email kampus; kosong = belum diisi dosennya (belum bisa masuk dengan kata sandi)
        aktif:
          type: boolean
        admin:
          type: boolean
        kaprodi_prodi:
          type: array
          items:
            type: string
        prodi_kode:
          type: array
          description: Prodi tempat mengajar (dicentang kaprodi)
          items:
            type: string
        sandi_sendiri:
          type: boolean
          description: false = masih kata sandi templat
    PenggunaMahasiswa:
      allOf:
        - $ref: '#/components/schemas/Mahasiswa'
        - type: object
          properties:
            sandi_sendiri:
              type: boolean
              description: false = masih kata sandi templat
    TambahDosenRequest:
      type: object
      required:
        - nohp
        - nama
      properties:
        nohp:
          type: string
          description: Nomor WhatsApp; awalan 0, 8, atau 62 dibakukan jadi 62…
          example: '081234567890'
        nama:
          type: string
    UbahDosenRequest:
      type: object
      required:
        - nama
        - nohp
      properties:
        nama:
          type: string
        nohp:
          type: string
    AktifRequest:
      type: object
      required:
        - aktif
      properties:
        aktif:
          type: boolean
    JabatanAdminRequest:
      type: object
      required:
        - admin
      properties:
        admin:
          type: boolean
    RiwayatJabatan:
      type: object
      properties:
        id:
          type: string
        dosen_id:
          type: string
        nama:
          type: string
          description: Snapshot nama dosen saat itu
        jabatan:
          type: string
        aksi:
          type: string
          enum:
            - tetapkan
            - cabut
        oleh:
          type: string
          description: Email kampus (atau wa:<nomor>) admin yang mengubah
        pada:
          type: string
          format: date-time
  requestBodies:
    TextMessageReq:
      description: Kirim Pesan teks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextMessage'
    TextMessageResp:
      description: Respon dari request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TextMessageResponse'
  securitySchemes:
    token:
      type: apiKey
      name: token
      in: header
    whatsauthToken:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.public
      description: >-
        Token PASETO WhatsAuth (satu keypair bersama PUBLICKEY/PRIVATEKEY untuk
        seluruh backend) atas nama nomor WhatsApp pemegangnya — mahasiswa di
        roster, dosen, kaprodi, maupun admin (dulu bernama `dosenToken`; peran
        dibaca dari klaim `role`, bukan dari nama skema). Didapat lewat halaman
        login https://platform.digitalbdg.ac.id/login/ — NIM/email + kata sandi
        (`POST /akun/masuk`) atau WhatsAuth QR / magic link / OTP; lihat "Cara
        mendapatkan token" di pengantar. Dikirim sebagai
        `Authorization: Bearer <token>` — BUKAN header `token` seperti endpoint
        bot WhatsApp/device. Berlaku 18 jam; perubahan peran baru terbaca setelah
        masuk ulang.
