                $ref: '#/components/schemas/Mahasiswa'
        '401':
          description: Bukan dosen atau token tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal - nim, nama, prodi_kode, atau angkatan kosong, semester di luar rentang wajar, atau status tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
    get:
      tags:
        - akademik
      summary: Daftar roster mahasiswa
      description: Filter opsional per prodi dan angkatan. Hanya dosen - roster memuat nomor WhatsApp dan surel mahasiswa.
