openapi: 3.0.3
info:
  title: Dokumen API Platform
  description: >-
    Penjelasan tata cara pemakaian API dari Whatsauth.


    Catatan: dua route websocket di backend (`/ws/whatsauth/public` untuk QR auth,
    `/ws/chatgpl/public` untuk chatGPL) tidak didokumentasikan di sini karena
    OpenAPI 3.0 tidak punya skema native untuk websocket.
  termsOfService: https://wa.my.id
  contact:
    email: awangga@gmail.com
  license:
    name: Buat dulu webhook untuk menerima dan mengirim pesan
    url: https://github.com/whatsauth/webhook
  version: 1.1.0
externalDocs:
  description: Pendaftaran Token Whatsauth
  url: https://wa.my.id
servers:
  - url: https://apk.fly.dev/api
tags:
  - name: signup
    description: Melakukan pendaftaran atau refresh token disertai URL dan Secret WebHook
    externalDocs:
      description: Contoh Kode WebHook
      url: https://github.com/whatsauth/webhook
  - name: device
    description: Set whatsapp yg digunakan
    externalDocs:
      description: Tata cara input kode
      url: https://faq.whatsapp.com/1324084875126592
  - name: message
    description: Mengirim pesan ke tujuan
    externalDocs:
      description: Contoh Kode Program
      url: https://github.com/whatsauth/webhook/blob/09c999be72e25660395f27c879456938a57561d1/function.go#L36C9-L36C9
  - name: whatsauth
    description: Get Token and Authorize
  - name: version
    description: Cek status dan commit deployan yang sedang berjalan
  - name: tugas
    description: Portal Tugas - pengumpulan tugas mahasiswa dan laporan kemiripan
  - name: kurikulum
    description: Data referensi kurikulum - prodi, rumpun, CPL, ritme mingguan
paths:
  /health:
    get:
      tags:
        - tugas
      summary: Health check Portal Tugas
      description: Mengembalikan status service dan jumlah tugas yang tersimpan
      operationId: healthTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  n_tugas:
                    type: integer
                    example: 3
  /tugas:
    get:
      tags:
        - tugas
      summary: Daftar tugas
      operationId: daftarTugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tugas:
                    type: array
                    items:
                      $ref: '#/components/schemas/TugasRingkas'
    post:
      tags:
        - tugas
      summary: Buat tugas baru
      description: Hanya dosen yang sudah login lewat WhatsAuth (lihat /whatsauth/request) yang bisa membuat tugas
      operationId: buatTugas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatTugasRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 66f0a1b2c3d4e5f678901234
                  judul:
                    type: string
                    example: Tugas Besar Basis Data
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Validasi gagal (judul/deskripsi tidak sesuai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /tugas/{id}:
    get:
      tags:
        - tugas
      summary: Detail tugas
      operationId: detailTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  judul:
                    type: string
                  deskripsi:
                    type: string
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/kirim:
    post:
      tags:
        - tugas
      summary: Kumpulkan berkas tugas
      description: Endpoint publik untuk mahasiswa mengumpulkan tugas. Body berupa multipart/form-data berisi nama, nim, dan berkas.
      operationId: kirimTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: Budi Santoso
                nim:
                  type: string
                  example: "1301210001"
                berkas:
                  type: string
                  format: binary
              required:
                - nama
                - nim
                - berkas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  kiriman_id:
                    type: string
                  n_kata:
                    type: integer
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Nama/NIM/berkas tidak valid atau gagal diekstrak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /tugas/{id}/laporan:
    get:
      tags:
        - tugas
      summary: Laporan kemiripan tugas
      description: Hanya dosen yang sudah login yang bisa mengakses laporan kemiripan antar kiriman
      operationId: laporanTugas
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ObjectID tugas
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKemiripan'
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /dosen/ping:
    get:
      tags:
        - tugas
      summary: Cek validitas token dosen
      operationId: pingDosen
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  user:
                    type: string
                    example: dosen
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /kurikulum/prodi:
    get:
      tags:
        - kurikulum
      summary: Daftar program studi
      operationId: daftarProdi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  prodi:
                    type: array
                    items:
                      type: object
  /kurikulum/prodi/{prodi}/rumpun:
    get:
      tags:
        - kurikulum
      summary: Daftar rumpun matakuliah suatu prodi
      operationId: daftarRumpun
      parameters:
        - in: path
          name: prodi
          schema:
            type: string
          required: true
          description: Kode/slug program studi
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  rumpun:
                    type: array
                    items:
                      type: object
  /kurikulum/seed:
    post:
      tags:
        - kurikulum
      summary: Seed data referensi kurikulum
      description: Menulis data referensi kurikulum (prodi, rumpun, CPL, ritme mingguan) ke Mongo. Idempoten, langkah manual satu kali dipanggil operator setelah deploy - dilindungi token dosen yang sama dengan Portal Tugas.
      operationId: seedKurikulum
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  ringkasan:
                    type: object
        '401':
          description: Token dosen tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
      security:
        - dosenToken: []
  /v3/official/send/message/text:
    post:
      tags:
        - message
      summary: Kirim pesan teks (v3, nomor official)
      description: Mengirimkan pesan teks memakai nomor official milik user yang sedang login (token di header, bukan di body)
      operationId: sendMessageTextV3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '403':
          description: Token tidak valid atau tidak punya akses ke nomor official
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /version:
    get:
      tags:
        - version
      summary: Cek status aplikasi
      description: Mengembalikan status aplikasi dan git commit dari deployan yang sedang berjalan, dipakai untuk memastikan deployan berhasil tanpa perlu cek log server.
      operationId: getVersion
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  commit:
                    type: string
                    example: d4a105de7b3078d3c2c29121c4477ca41da7079a
  /signup:
    post:
      tags:
        - signup
      summary: Pendaftaran Baru atau Refres Access Token
      description: Melakukan pendaftaran atau refresh token dengan input URL dan Secret WebHook. Balasan berupa Token yang baru yang berlaku selama 30 hari
      operationId: signUpNewUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebHook'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /device/{token}:
    get:
      tags:
        - device
      summary: Add device Whatsapp
      description: Menambahkan wa user ke server untuk dipakai oleh api dengan memasukkan code dari respon server
      operationId: getDevice
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
          description: Token yang diberikan kepada user
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid status value
  /device/status/{token}:
    get:
      tags:
        - device
      summary: Cek status pairing device
      description: Endpoint read-only untuk cek status koneksi device WhatsApp — TIDAK memicu pairing baru atau koneksi apa pun (beda dari GET /device/{token}). Berguna untuk troubleshoot tanpa perlu cek log server.
      operationId: getDeviceStatus
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
          description: Token yang diberikan kepada user
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  phonenumber:
                    type: string
                    example: "6282258512828"
                  store_id_ada:
                    type: boolean
                    description: Pernah berhasil pairing (sesi tersimpan di Postgres)
                  is_connected:
                    type: boolean
                    description: Socket websocket ke server WhatsApp sedang tersambung
                  is_logged_in:
                    type: boolean
                    description: Sesi sudah lolos login penuh, siap kirim/terima pesan
        '403':
          description: Token tidak valid
  /numbers/isonwa:
    post:
      tags:
        - device
      summary: Cek apakan nomor sudah terdaftar di Whatsapp atau belum
      description: Pengecekan daftar nomor yang akan di cek apakah ada di whatsapp atau belum
      operationId: isOnWhatsApp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneList'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaList'
        '400':
          description: Invalid status value
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /v2/send/message/text:
    post:
      tags:
        - message
      summary: Kirim pesan teks
      description: Mengirimkan pesan teks kepada perorangan atau group
      operationId: sendMessageText
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '503':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /send/message/image:
    post:
      tags:
        - message
      summary: Kirim pesan gambar
      description: Mengirimkan pesan gambar kepada perorangan atau group
      operationId: sendMessageImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /send/message/document:
    post:
      tags:
        - message
      summary: Kirim pesan document
      description: Mengirimkan pesan document kepada perorangan atau group
      operationId: sendMessageDoc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentMessage'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
  /whatsauth/request:
    post:
      tags:
        - whatsauth
      summary: Permintaan otorisasi aplikasi
      description: Mengirimkan token otorisasi pada user
      operationId: whatsauthRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAuth'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageResponse'
        '405':
          description: Invalid input
      security:
        - token:
            - write:apiKey
            - read:apiKey
components:
  schemas:
    JID:
      type: object
      properties:
        User:
          type: string
          description: The user ID
        RawAgent:
          type: integer
          format: int32
          description: The raw agent
        Device:
          type: integer
          format: int32
          description: The device ID
        Integrator:
          type: integer
          format: int32
          description: The integrator ID
        Server:
          type: string
          description: The server
      required:
        - User
        - RawAgent
        - Device
        - Integrator
        - Server
    VerifiedName:
      type: object
      properties:
        Name:
          type: string
          description: The verified business name
        Certainty:
          type: string
          description: The certainty of the verification
      required:
        - Name
        - Certainty
    WaList:
      type: object
      properties:
        phonenumbers:
          type: array
          items:
            $ref: '#/components/schemas/IsOnWhatsAppResponse'
      required:
        - phonenumbers
    IsOnWhatsAppResponse:
      type: object
      properties:
        Query:
          type: string
          description: The query string used
        JID:
          $ref: '#/components/schemas/JID'
        IsIn:
          type: boolean
          description: Whether the phone is registered or not
        VerifiedName:
          $ref: '#/components/schemas/VerifiedName'
      required:
        - Query
        - JID
        - IsIn
    WebHook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.site/
            secret: 
              type: string
              example: isju8ekf9ke
            readstatusoff: 
              type: boolean
              example: false
            sendtyping: 
              type: boolean
              example: false
    UserAccount:
      type: object
      properties:
        phonenumber:
          type: string
          example: 6281111
        webhook:
          type: object
          properties:
            url: 
              type: string
              example: https://webhook.com
            secret: 
              type: string
              example: isju8ekf9ke
        token:
          type: string
          example: v4.public.asoiduas
    PhoneList:
      type: object
      properties:
        phoneNumbers:
          type: array
          items:
            type: string
          description: Daftar nomor telepon
      required:
        - phoneNumbers
      example:
        phoneNumbers:
          - "08123456789"
          - "81234567890"
          - "628123456789"
    TextMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        isgroup:
          type: boolean
          example: false
        messages:
          type: string
          example: hai kak
    ImageMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64image:
          type: string
          example: iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mP8/5+hnoEIwDiqkL4KAcT9GO0U4BxoAAAAAElFTkSuQmCC
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    DocumentMessage:
      type: object
      properties:
        to:
          type: string
          example: 6281111
        base64doc:
          type: string
          example: 
        filename:
          type: string
          example: filename.pdf
        isgroup:
          type: boolean
          example: false
        caption:
          type: string
          example: hai kak
    WhatsAuth:
      type: object
      properties:
        uuid:
          type: string
          example: isodjaoidsjaoid
        phonenumber:
          type: string
          example: 6281212
        delay:
          type: integer
          example: 2
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
          example: Nomor tidak terdaftar di whatsapp
    TextMessageResponse:
      type: object
      properties:
        Timestamp:
          type: string
          example: 2024-08-02T06:34:58Z
        ID:
          type: string
          example: 3EB0B5C35133EC28D4EA1B
        ServerID:
          type: integer
          example: 0
        DebugTimings:
                    type: object
                    properties:
                      Queue:
                        type: integer
                        example: 480
                      Marshal:
                        type: integer
                        example: 11410
                      GetParticipants:
                        type: integer
                        example: 0
                      GetDevices:
                        type: integer
                        example: 227151959
                      GroupEncrypt:
                        type: integer
                        example: 0
                      PeerEncrypt:
                        type: integer
                        example: 31024016
                      Send:
                        type: integer
                        example: 98170
                      Resp:
                        type: integer
                        example: 234692326
                      Retry:
                        type: integer
                        example: 0
    DeviceResponse:
      type: object
      properties:
        phonenumber:
          type: string
          example: 628888888
        status:
          type: boolean
          example: false
        code:
          type: string
          example: RGCF-L1LH
        message:
          type: string
          example: Pair Code Device
    DetailError:
      description: Bentuk error khusus modul Portal Tugas & Kurikulum (beda dari ErrorMessage yang dipakai modul WhatsAuth)
      type: object
      properties:
        detail:
          type: string
          example: Tugas tidak ditemukan
    TugasRingkas:
      type: object
      properties:
        id:
          type: string
        judul:
          type: string
        deskripsi:
          type: string
        n_kiriman:
          type: integer
    BuatTugasRequest:
      type: object
      properties:
        judul:
          type: string
          example: Tugas Besar Basis Data
        deskripsi:
          type: string
          example: Kerjakan rancangan ERD dan normalisasi
      required:
        - judul
    PerKiriman:
      type: object
      properties:
        id:
          type: string
        nama:
          type: string
        nim:
          type: string
        filename:
          type: string
        max_score:
          type: number
          nullable: true
        pasangan_id:
          type: string
          nullable: true
        pasangan_nama:
          type: string
        band:
          type: string
    Pasangan:
      type: object
      properties:
        a_id:
          type: string
        a_nama:
          type: string
        b_id:
          type: string
        b_nama:
          type: string
        score:
          type: number
        band:
          type: string
    LaporanKemiripan:
      type: object
      properties:
        tugas_id:
          type: string
        disclaimer:
          type: string
          example: "Skor adalah kemiripan tekstual, bukan vonis plagiat. Keputusan akhir tetap pada dosen setelah pemeriksaan manual."
        per_kiriman:
          type: array
          items:
            $ref: '#/components/schemas/PerKiriman'
        pasangan:
          type: array
          items:
            $ref: '#/components/schemas/Pasangan'
  requestBodies:
    TextMessageReq:
      description: Kirim Pesan teks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextMessage'
    TextMessageResp:
      description: Respon dari request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TextMessageResponse'
  securitySchemes:
    token:
      type: apiKey
      name: token
      in: header
    dosenToken:
      type: apiKey
      name: token
      in: header
      description: Token PASETO WhatsAuth (keypair bersama PUBLICKEY/PRIVATEKEY) dari nomor WhatsApp yang terdaftar sebagai dosen, didapat lewat alur POST /whatsauth/request
