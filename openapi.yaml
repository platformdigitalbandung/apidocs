  /autograder/webhook:
    post:
      tags:
        - autograder
      summary: Penerima webhook GitHub workflow_run (autograder)
      description: >-
        Dipanggil GitHub, bukan pengguna - tanpa token WhatsAuth. Autentikasinya
        tanda tangan HMAC SHA-256 atas body mentah (X-Hub-Signature-256) dengan
        GHWEBHOOKSECRET. Hanya run yang selesai, berpemicu pull_request_target,
        dari berkas .github/workflows/autograder.yml, di repo milik organisasi
        platformdigitalbandung yang dicatat; selebihnya dijawab 202. Payload
        tidak membawa angka - backend mengambil artefak hasil-autograder sendiri
        lewat GitHub API memakai GHPAT, memetakan username GitHub ke NIM lewat
        roster, lalu menyimpan idempoten per workflow_run_id.
      operationId: webhookAutograder
      security: []
      parameters:
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}, example: "sha256=5c...", description: "HMAC-SHA256 badan permintaan mentah dengan `GHWEBHOOKSECRET`, format `sha256=<hex>`; salah atau kosong dijawab 401."}
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string, enum: [workflow_run, ping]}, description: "`ping` dibalas pong, `workflow_run` diproses, lainnya dijawab 202 dan diabaikan."}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookWorkflowRun'
      responses:
        '200':
          description: tercatat (atau pong untuk event ping)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  workflow_run_id: {type: integer, format: int64}
                  nim: {type: string}
                  terpetakan: {type: boolean, description: false kalau username GitHub belum ada di roster}
                  tes_dosen_lulus: {type: integer}
                  tes_dosen_total: {type: integer}
        '202':
          description: Tanda tangan sah, tetapi bukan run autograder yang dicatat (event, aksi, pemicu, berkas, atau organisasi lain)
          content:
            application/json:
              schema:
                type: object
                properties:
                  diabaikan: {type: string}
        '401':
          description: Tanda tangan webhook tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Payload bukan JSON yang sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '502':
          description: Artefak tidak bisa diambil dari GitHub (hak GHPAT, artefak kedaluwarsa, atau tidak ada) - bisa dikirim ulang dari riwayat webhook GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '503':
          description: GHWEBHOOKSECRET belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
  /autograder:
    get:
      tags:
        - autograder
      summary: Hasil autograder (angka mentah)
      description: >-
        Terbaru dulu, maksimal 200. Dosen/admin melihat siapa pun; mahasiswa
        hanya miliknya (NIM dari roster, query nim diabaikan). Yang DISIMPAN
