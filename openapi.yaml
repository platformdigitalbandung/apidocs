              schema:
                $ref: '#/components/schemas/DetailError'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasanCakupanCPL'
        '422':
          description: >-
            Prodi ini ada, tetapi belum punya satu pun CPL terdaftar di koleksi
            `cpl`. Bisnis Digital persis dalam keadaan ini - 14 rumpun, nol CPL.
            Tanpa pembedaan ini jawabannya 200 dengan total 0 dan tercapai 0,
            dan "0 dari 0 CPL tercakup" di halaman akreditasi terbaca seperti
